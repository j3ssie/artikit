<!doctype html>
<html lang="en" data-mode="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gimorra · Operations console (sample)</title>
<meta name="description" content="Gimorra console sample: dashboard, engagements, findings with proofs, targets, a new-scan form and settings, all on sample data." />
<meta name="color-scheme" content="dark light" />
<meta name="theme-color" content="#211b14" />
<link rel="icon" href="../assets/gimorra-logo.png" />
<script>(function(){try{var m=localStorage.getItem('gm-mode');if(m==='light'||m==='dark')document.documentElement.setAttribute('data-mode',m);}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ================= palettes ================= */
:root, :root[data-mode="dark"]{
  color-scheme:dark;
  --bg-app:#14100b; --bg-terminal:#1a150e; --bg-raised:#241d14; --bg-inset:#100c08; --bg-hover:#2c2418;
  --border-1:#332917; --border-2:#54432a;
  --text-1:#ead9c0; --text-2:#b59c7a; --text-dim:#77664c;
  --green:#a4c26f; --red:#e0705a; --yellow:#d8a24a; --orange:#cf8236; --blue:#8aa8bd; --magenta:#c98da4;
  --success:#a4c26f; --error:#e0705a; --warning:#cf8236; --info:#8aa8bd;
  --diff-add-bg:#12351c; --diff-del-bg:#40161d;
  --shadow-window:0 20px 60px rgba(0,0,0,.55);
  --accent:#78d670;
  --accent-fg:var(--accent); --accent-fill:var(--accent);
  --accent-soft-bg:color-mix(in oklab, var(--accent) 22%, var(--bg-terminal));
  --on-accent:#0d0d13;
  --badge-ink:78%;
  --selection:#2a3d66;
  /* dark legibility lift */
  --page-bg:color-mix(in oklab, var(--bg-app) 97.5%, var(--text-1));
  --surface:color-mix(in oklab, var(--bg-terminal) 96%, var(--text-1));
  --surface-raised:color-mix(in oklab, var(--bg-raised) 95.5%, var(--text-1));
  --border:color-mix(in oklab, var(--border-1) 91%, var(--text-1));
}
:root[data-mode="light"]{
  color-scheme:light;
  --bg-app:#efece8; --bg-terminal:#fbf9f6; --bg-raised:#ffffff; --bg-inset:#f4f1ec; --bg-hover:#e9e5df;
  --border-1:#ddd8d0; --border-2:#c2bab0;
  --text-1:#33302b; --text-2:#6b655c; --text-dim:#a39c90;
  --green:#357a35; --red:#c53a3a; --yellow:#a37414; --orange:#a05a16; --blue:#3565c0; --magenta:#ad3d8d;
  --success:#357a35; --error:#c53a3a; --warning:#a05a16; --info:#3565c0;
  --diff-add-bg:#e2f0dd; --diff-del-bg:#f9e1e1;
  --shadow-window:0 20px 60px rgba(60,50,35,.16);
  --accent:#78d670;
  --accent-fg:color-mix(in oklab, var(--accent) 44%, var(--text-1));
  --accent-fill:color-mix(in oklab, var(--accent) 90%, var(--text-1));
  --accent-soft-bg:color-mix(in oklab, var(--accent) 16%, var(--bg-terminal));
  --on-accent:var(--text-1);
  --badge-ink:67%;
  --selection:#d8e4f5;
  --page-bg:var(--bg-app); --surface:var(--bg-terminal); --surface-raised:var(--bg-raised); --border:var(--border-1);
}
:root{
  /* semantic aliases */
  --surface-sunken:var(--bg-inset);
  --border-subtle:color-mix(in oklab, var(--border) 55%, var(--surface));
  --border-strong:var(--border-2);
  --text:var(--text-1);
  --text-body:color-mix(in oklab, var(--text-1) 90%, var(--text-2));
  --text-muted:color-mix(in oklab, var(--text-2) 78%, var(--text-1));
  --text-faint:color-mix(in oklab, var(--text-dim) 55%, var(--text-1));
  --track:var(--bg-hover); --neutral-soft-bg:var(--bg-hover);
  /* radii: deliberately small */
  --r-ctl:5px; --r-pill:4px; --r-card:7px; --r-frame:9px; --r-window:10px;
  /* shadows */
  --shadow-glow:0 0 0 1px color-mix(in oklab, var(--accent) 30%, transparent), 0 0 18px -6px color-mix(in oklab, var(--accent) 70%, transparent);
  --shadow-glow-warn:0 0 0 1px color-mix(in oklab, var(--warning) 30%, transparent), 0 0 18px -6px color-mix(in oklab, var(--warning) 70%, transparent);
  --shadow-glow-danger:0 0 0 1px color-mix(in oklab, var(--error) 30%, transparent), 0 0 18px -6px color-mix(in oklab, var(--error) 70%, transparent);
  /* type scale */
  --fs-2xs:11.5px; --fs-xs:12.5px; --fs-sm:14px; --fs-md:15px; --fs-lg:16.5px; --fs-xl:20px; --fs-2xl:24px; --fs-3xl:28.5px;
  /* spacing */
  --u:4px; --gutter:22px; --stack:10px;
  /* motion */
  --ease:cubic-bezier(.2,0,0,1);
  --mode-hue:var(--warning);
}
@media (max-width:640px){:root{--gutter:14px}}

/* ================= base ================= */
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
html{scrollbar-color:var(--border-strong) transparent}
body{margin:0;background:var(--page-bg);color:var(--text);font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:var(--fs-md);line-height:1.55;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-variant-numeric:tabular-nums}
::selection{background:var(--selection)}
a{color:var(--accent-fg);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent-fg);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:600;color:var(--text);text-wrap:balance}
p{margin:0;color:var(--text-body);text-wrap:pretty}
svg.i{width:14px;height:14px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.label{font-size:var(--fs-2xs);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}
.muted{color:var(--text-muted)}.faint{color:var(--text-faint)}.body{color:var(--text-body)}
code{font-size:.92em;padding:.05em .35em;border-radius:var(--r-pill);background:var(--neutral-soft-bg);color:var(--text)}

/* ================= motion ================= */
@keyframes pageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes blink{50%{opacity:0}}
@keyframes softPulse{50%{opacity:.45}}
@keyframes halo1{50%{transform:scale(1.12);opacity:.78}}
@keyframes halo2{50%{transform:scale(.9);opacity:.38}}
@keyframes shimmer{to{background-position:-200% 0}}
.page.active{animation:pageIn 280ms var(--ease) both}
.stagger>*{animation:rise 320ms var(--ease) both}
.stagger>*:nth-child(1){animation-delay:40ms}.stagger>*:nth-child(2){animation-delay:80ms}.stagger>*:nth-child(3){animation-delay:120ms}.stagger>*:nth-child(4){animation-delay:160ms}.stagger>*:nth-child(5){animation-delay:200ms}
.page.active .grow{transform-origin:left;animation:growX 620ms var(--ease) both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ================= app shell ================= */
.frame{display:flex;height:100vh;height:100dvh;overflow:hidden;background:var(--surface)}
.mainc{display:flex;flex-direction:column;flex:1;min-width:0}
.content{flex:1;overflow-y:auto;padding:var(--gutter);background:var(--page-bg)}
.page{display:none;flex-direction:column;gap:calc(var(--stack)*2)}
.page.active{display:flex}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--border);padding:16px var(--gutter);font-size:var(--fs-sm);background:var(--surface);flex:none}
.topbar .left{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.brand{display:flex;align-items:center;gap:10px;flex:none;color:var(--text)}
.brand:hover{text-decoration:none}
.logo{position:relative;width:36px;height:36px;flex:none;isolation:isolate}
.logo img{display:block;width:36px;height:36px;border-radius:22%;position:relative;z-index:1}
.logo::before,.logo::after{content:"";position:absolute;left:50%;top:50%;translate:-50% -50%;border-radius:50%;pointer-events:none;background:radial-gradient(circle, color-mix(in oklab, var(--accent) 70%, transparent) 0%, transparent 70%);filter:blur(6px);z-index:0}
.logo::before{width:165%;height:165%;opacity:.62;animation:halo1 6s ease-in-out infinite}
.logo::after{width:230%;height:230%;opacity:.55;filter:blur(10px);animation:halo2 11s ease-in-out infinite}
.brand .word{font-size:var(--fs-xl);font-weight:700;letter-spacing:-.01em}
/* the tab strip scrolls when it runs out of room: padding keeps focus rings unclipped, the mask fades a cut-off tab at either edge */
.tabs{--fade:linear-gradient(90deg,transparent,#000 12px,#000 calc(100% - 20px),transparent);display:flex;align-items:center;gap:20px;min-width:0;padding:8px 20px 8px 12px;margin-block:-8px;overflow-x:auto;scroll-padding-inline:12px 28px;scrollbar-width:none;-webkit-overflow-scrolling:touch;-webkit-mask-image:var(--fade);mask-image:var(--fade)}
.tabs::-webkit-scrollbar{display:none}
.tab{display:inline-flex;align-items:center;gap:6px;padding-bottom:3px;font-size:var(--fs-md);white-space:nowrap;color:var(--text-muted);border-bottom:2px solid transparent;transition:color .16s,border-color .16s}
.tab:hover{color:var(--text-body);text-decoration:none}
.tab.on{color:var(--text);border-bottom-color:var(--accent)}
.topbar .right{display:flex;align-items:center;gap:12px;flex:none}
.modepill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:var(--fs-xs);white-space:nowrap;background:color-mix(in oklab, var(--mode-hue) 16%, var(--surface));border:1px solid color-mix(in oklab, var(--mode-hue) 45%, transparent);color:color-mix(in oklab, var(--mode-hue) 80%, var(--text));box-shadow:0 0 0 1px color-mix(in oklab, var(--mode-hue) 28%, transparent), 0 0 18px -6px color-mix(in oklab, var(--mode-hue) 75%, transparent)}
.modepill i{width:6px;height:6px;border-radius:50%;background:currentColor;animation:softPulse 1.6s ease-in-out infinite}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;padding:0;border:1px solid var(--border);border-radius:var(--r-ctl);background:var(--surface);color:var(--text-muted);transition:color .16s,background .16s}
.iconbtn:hover{color:var(--text);background:var(--bg-hover)}
.iconbtn:active,.btn-ghost:hover:active,.chip:not(.on):active{background:var(--surface-sunken)}
.iconbtn .moon{display:none}
:root[data-mode="light"] .iconbtn .sun{display:none}
:root[data-mode="light"] .iconbtn .moon{display:block}
.btn-primary{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 14px;border:0;border-radius:999px;background:var(--accent-fill);color:var(--on-accent);font-size:13px;font-weight:600;white-space:nowrap;transition:box-shadow .2s var(--ease),transform .2s var(--ease)}
.btn-primary:hover{box-shadow:var(--shadow-glow);transform:translateY(-1px);text-decoration:none}
.btn-primary:active{transform:none}
.btn-ghost{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--border);border-radius:var(--r-ctl);background:transparent;color:var(--text-muted);font-size:var(--fs-xs);white-space:nowrap;transition:color .16s,background .16s,border-color .16s}
.btn-ghost:hover{color:var(--text);background:var(--bg-hover);border-color:var(--border-strong);text-decoration:none}
.btn-ghost.danger:hover{color:color-mix(in oklab, var(--error) 85%, var(--text));border-color:color-mix(in oklab, var(--error) 50%, transparent);box-shadow:var(--shadow-glow-danger)}
@media (max-width:760px){
  .topbar{padding:12px var(--gutter)}
  /* labels collapse to icons but stay in the accessibility tree */
  .brand .word,.btn-primary .lbl,.modepill .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  .btn-primary{padding:0 10px}
}
/* touch: grow hit areas to about 40px without changing the drawn size */
@media (pointer:coarse){
  .iconbtn,.btn-primary,.btn-ghost,.chip,.tab{position:relative}
  .iconbtn::after,.btn-primary::after,.btn-ghost::after{content:"";position:absolute;inset:-6px}
  .chip::after{content:"";position:absolute;inset:-7px -3px}
  .tab::after{content:"";position:absolute;inset:-8px -6px}
}

/* ================= console blocks ================= */
:root{
  --sev-critical:var(--red); --sev-high:color-mix(in oklab, var(--red) 58%, var(--orange)); --sev-medium:var(--orange);
  --sev-low:color-mix(in oklab, var(--orange) 46%, var(--bg-raised)); --sev-info:color-mix(in oklab, var(--text-dim) 80%, var(--bg-raised));
  --tan:color-mix(in oklab, var(--text-2) 84%, var(--bg-raised));
}
.content{padding:0}
.pad{display:flex;flex-direction:column;gap:var(--stack);padding:var(--stack) var(--gutter) var(--gutter)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--stack)}
.grid3{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:var(--stack);align-items:start}
@media (max-width:980px){.grid2,.grid3{grid-template-columns:1fr}}
.pagehead{padding:18px var(--gutter) 14px}
.pagehead h1{font-size:var(--fs-3xl);letter-spacing:-.01em;line-height:1.2}
.pagehead p{margin-top:6px;font-size:var(--fs-md);color:var(--text-muted)}
.lede{padding:12px var(--gutter);font-size:var(--fs-xs);color:var(--text-muted);border-bottom:1px solid var(--border)}

/* stat grid: flush cells divided by hairlines */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--border);border-bottom:1px solid var(--border)}
.stats.five{grid-template-columns:repeat(5,minmax(0,1fr))}
.stat{background:var(--page-bg);padding:16px var(--gutter) 18px;min-width:0}
.stat .label{display:flex;align-items:center;gap:6px}
.stat .v{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:var(--fs-3xl);font-weight:600;line-height:1.1;letter-spacing:-.02em}
.stat .v small{font-size:var(--fs-xs);font-weight:400;letter-spacing:0;color:var(--text-muted)}
.c-green{color:var(--accent-fg)}.c-orange{color:var(--orange)}.c-ok{color:var(--success)}.c-blue{color:var(--blue)}.c-red{color:var(--red)}
@media (max-width:900px){.stats,.stats.five{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* panels */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);min-width:0}
.panel>header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border-subtle)}
.panel>header h2{font-size:var(--fs-lg)}
.panel>header .hint{font-size:var(--fs-xs);color:var(--text-muted);text-align:right}
.panel .pb{padding:16px}
.note{font-size:var(--fs-xs);color:var(--text-muted)}

/* stacked columns */
.chart{display:flex;align-items:flex-end;gap:10px;height:180px}
.colw{flex:1;min-width:0;height:100%;display:flex;flex-direction:column-reverse;gap:2px;border-bottom:1px solid var(--border);border-radius:3px;transition:opacity .14s}
.colw i{display:block;border-radius:2px;min-height:3px;background:var(--c)}
.chart:hover .colw:not(:hover){opacity:.5}
.axis{display:flex;justify-content:space-between;margin-top:10px;font-size:var(--fs-2xs);color:var(--text-muted)}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;margin-top:12px;font-size:var(--fs-xs);color:var(--text-muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;background:var(--c)}

/* ladders: name, track, count */
.ladder{display:grid;gap:12px}
.lrow{display:grid;grid-template-columns:104px minmax(0,1fr) 64px;align-items:center;gap:12px;font-size:var(--fs-xs)}
.lrow.cnt{grid-template-columns:28px 156px minmax(0,1fr)}
.lrow .k{display:flex;align-items:center;gap:8px;min-width:0;color:var(--text-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .k i{width:7px;height:7px;border-radius:2px;flex:none;background:var(--c)}
.lrow .n{text-align:right;color:var(--text-muted)}
.lrow .n b{font-weight:500;color:var(--text)}
.track{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.track i{display:block;height:100%;border-radius:inherit;background:var(--c, var(--tan));transform-origin:left;animation:growX 520ms var(--ease) both}
.stack{display:flex;gap:3px;height:12px}
.stack i{display:block;border-radius:2px;min-width:4px;background:var(--c)}
.verdict{display:grid;grid-template-columns:160px minmax(0,1fr);gap:24px;align-items:center}
.donut{width:160px;height:160px}
.donut circle{fill:none;stroke-width:17}
.donut text{fill:var(--text);font-family:inherit;text-anchor:middle}
.vlist{display:grid;gap:11px;font-size:var(--fs-sm)}
.vlist div{display:grid;grid-template-columns:10px minmax(0,1fr) 40px 44px;gap:10px;align-items:center;color:var(--text-body)}
.vlist i{width:8px;height:8px;border-radius:2px;background:var(--c)}
.vlist b{text-align:right;font-weight:500;color:var(--text)}
.vlist span:last-child{text-align:right;font-size:var(--fs-xs);color:var(--text-muted)}
@media (max-width:560px){.verdict{grid-template-columns:1fr;justify-items:center}.vlist{width:100%}.lrow.cnt{grid-template-columns:28px 110px minmax(0,1fr)}}

/* toolbars and data tables: flush to the page edge */
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px var(--gutter);border-bottom:1px solid var(--border)}
.filter{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;width:240px;max-width:100%;border:1px solid var(--border);border-radius:var(--r-ctl);background:var(--surface);color:var(--text-muted)}
.filter:focus-within{border-color:var(--accent-fg)}
.filter input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--text);font:inherit;font-size:var(--fs-sm)}
.filter input::placeholder{color:var(--text-muted)}
.sel{height:30px;padding:0 26px 0 10px;border:1px solid var(--border-strong);border-radius:var(--r-ctl);color:var(--text-body);font:inherit;font-size:var(--fs-xs);appearance:none;-webkit-appearance:none;cursor:pointer;
  background-color:var(--surface);background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(-45deg,transparent 50%,currentColor 50%);background-position:calc(100% - 14px) 13px,calc(100% - 9px) 13px;background-size:5px 5px;background-repeat:no-repeat}
.sel:hover{background-color:var(--bg-hover)}
.tw{overflow-x:auto}
table.dt{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
.dt th{padding:12px 10px;text-align:left;font-size:var(--fs-2xs);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);border-bottom:1px solid var(--border);white-space:nowrap}
.dt th button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.dt th button:focus-visible{outline:2px solid var(--accent-fg);outline-offset:3px}
.dt th button span{font-size:10px;letter-spacing:0;opacity:.7}
.dt th[aria-sort] button{color:var(--text)}
.dt td{padding:13px 10px;border-bottom:1px solid var(--border-subtle);vertical-align:middle;color:var(--text-body)}
.dt th:first-child,.dt td:first-child{padding-left:var(--gutter)}
.dt th:last-child,.dt td:last-child{padding-right:var(--gutter)}
.dt tr.link{cursor:pointer;transition:background .12s}
.dt tr.link:hover td,.dt tr.link:focus-within td{background:var(--bg-hover)}
.dt tr.cur td{background:var(--accent-soft-bg)}
.dt tr.cur td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.dt td.t{min-width:230px;color:var(--text);text-wrap:pretty}
.dt td.t a,.dt td.t button{all:unset;cursor:pointer;color:inherit}
.dt td.t a:focus-visible,.dt td.t button:focus-visible{outline:2px solid var(--accent-fg);outline-offset:3px}
.dt td.r,.dt th.r{text-align:right}
.dt td.m{font-size:var(--fs-xs);color:var(--text-muted)}
.dt td.num{font-size:var(--fs-md);color:var(--text)}
.dt td.asset{font-size:var(--fs-sm);overflow-wrap:anywhere;min-width:180px}
.dt td.nw{white-space:nowrap}
.panel .dt th:first-child,.panel .dt td:first-child{padding-left:16px}
.panel .dt th:last-child,.panel .dt td:last-child{padding-right:16px}
.panel .dt tr:last-child td{border-bottom:0}
:root[data-density="compact"] .dt td{padding-block:8px}
.tfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px var(--gutter);font-size:var(--fs-xs);color:var(--text-muted)}
.pager{display:flex;align-items:center;gap:8px}
.pager button{width:26px;height:26px;display:grid;place-items:center;padding:0;border:1px solid var(--border);border-radius:var(--r-ctl);background:none;color:var(--text-muted)}
.pager button:disabled{opacity:.4;cursor:not-allowed}
.pager button:not(:disabled):hover{background:var(--bg-hover);color:var(--text)}
.emptyrow{padding:40px var(--gutter);text-align:center;font-size:var(--fs-sm);color:var(--text-muted)}
.emptyrow b{display:block;margin-bottom:4px;color:var(--text);font-weight:600}

/* badges: a tone variable, text pulled toward ink so it holds contrast on its own tint */
.b{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:var(--r-pill);font-size:var(--fs-xs);white-space:nowrap;line-height:1;
  color:color-mix(in oklab, var(--c, var(--text-2)) var(--badge-ink), var(--text));background:color-mix(in oklab, var(--c, var(--text-2)) 18%, transparent)}
.b.line{background:none;border:1px solid var(--border-strong);color:var(--text-muted)}
.b.n{background:var(--neutral-soft-bg);color:var(--text-muted)}
.b+.b{margin-left:4px}
.t-critical{--c:var(--sev-critical)}.t-high{--c:var(--sev-high)}.t-medium{--c:var(--sev-medium)}.t-low{--c:var(--sev-low)}.t-info{--c:var(--sev-info)}
.t-ok{--c:var(--success)}.t-warn{--c:var(--warning)}.t-err{--c:var(--error)}.t-blue{--c:var(--blue)}.t-acc{--c:var(--accent)}.t-tan{--c:var(--tan)}
.sdot{display:inline-grid;place-items:center;width:16px;height:16px;color:var(--c)}
.sdot.spin .i{animation:spin 1.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.phase{display:inline-flex;align-items:center;gap:6px;color:var(--text-body)}
.phase.dim{color:var(--text-muted)}
.kbd{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 4px;border:1px solid var(--border-strong);border-radius:3px;font-size:11px;color:var(--text-muted)}
.alertbtn{position:relative;color:color-mix(in oklab, var(--warning) 85%, var(--text));border-color:color-mix(in oklab, var(--warning) 45%, transparent)}
.alertbtn b{position:absolute;top:-6px;right:-6px;min-width:16px;height:16px;padding:0 4px;display:grid;place-items:center;border-radius:999px;background:var(--warning);color:var(--bg-app);font-size:10px;font-weight:700}

/* engagement view */
.ehead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:16px var(--gutter) 10px}
.ehead h1{font-size:var(--fs-lg)}
.ehead .sp{margin-left:auto;display:flex;gap:8px}
.echips{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:0 var(--gutter) 14px;font-size:var(--fs-xs);color:var(--text-muted)}
.pillc{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;white-space:nowrap;border:1px solid color-mix(in oklab, var(--c) 50%, transparent);color:color-mix(in oklab, var(--c) 82%, var(--text));background:color-mix(in oklab, var(--c) 12%, transparent)}
.callout{padding:14px var(--gutter);font-size:var(--fs-sm);color:var(--text-body);background:color-mix(in oklab, var(--warning) 15%, var(--page-bg));border-block:1px solid color-mix(in oklab, var(--warning) 30%, transparent)}
.callout b{display:block;color:color-mix(in oklab, var(--warning) 82%, var(--text));font-weight:600}
.etabs{display:flex;gap:20px;overflow-x:auto;padding:14px var(--gutter) 0;border-bottom:1px solid var(--border);scrollbar-width:none}
.etab{display:inline-flex;align-items:center;gap:8px;padding-bottom:10px;border-bottom:2px solid transparent;white-space:nowrap;font-size:var(--fs-sm);color:var(--text-muted)}
.etab:hover{color:var(--text-body);text-decoration:none}
.etab.on{color:var(--text);border-bottom-color:var(--accent)}
.etab .n{min-width:20px;height:18px;padding:0 6px;display:inline-grid;place-items:center;border-radius:999px;background:var(--neutral-soft-bg);font-size:11px;color:var(--text-muted)}
.etab .n.hot{background:color-mix(in oklab, var(--error) 22%, transparent);color:color-mix(in oklab, var(--error) var(--badge-ink), var(--text))}
.toc{border:1px solid var(--border-subtle);border-radius:var(--r-ctl);overflow:hidden}
.toc button{display:grid;grid-template-columns:24px 92px minmax(0,1fr) auto 40px;gap:10px;align-items:center;width:100%;padding:8px 12px;border:0;border-bottom:1px solid var(--border-subtle);background:none;text-align:left;font-size:var(--fs-xs);color:var(--text-body)}
.toc button:last-child{border-bottom:0}
.toc button:hover{background:var(--bg-hover)}
.toc .k{display:flex;align-items:center;gap:8px}.toc .k i{width:7px;height:7px;border-radius:2px;background:var(--c)}
.toc .x{color:var(--text-muted)}.toc .r{text-align:right;color:var(--text-muted)}
.kvs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 20px}
.kvs div{min-width:0}.kvs .label{display:block;margin-bottom:4px}
.kvs span:last-child{font-size:var(--fs-sm);overflow-wrap:anywhere}
@media (max-width:760px){.kvs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.switch{display:inline-flex;align-items:center;gap:8px;padding:0;border:0;background:none;font-size:var(--fs-2xs);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}
.switch i{width:34px;height:20px;border-radius:999px;background:var(--track);position:relative;transition:background .16s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--text);transition:transform .16s var(--ease)}
.switch[aria-pressed="true"] i{background:var(--accent-fill)}
.switch[aria-pressed="true"] i::after{transform:translateX(14px);background:var(--on-accent)}

/* finding rail */
.rail{position:fixed;top:0;right:0;bottom:0;width:min(720px,100vw);z-index:50;display:flex;flex-direction:column;background:var(--surface);border-left:1px solid var(--border);box-shadow:var(--shadow-window);transform:translateX(100%);visibility:hidden;transition:transform 260ms var(--ease),visibility 0s linear 260ms}
.rail.open{transform:none;visibility:visible;transition:transform 260ms var(--ease)}
.rail>header{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border);font-size:var(--fs-sm);font-weight:600}
.rail>header .iconbtn{margin-left:auto;border:0;background:none}
.rb{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;font-size:var(--fs-sm)}
.rb h2{font-size:var(--fs-lg);line-height:1.35}
.facts{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:var(--fs-xs);color:var(--text-body)}
.facts span{overflow-wrap:anywhere}
.facts b{margin-right:6px;font-size:var(--fs-2xs);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint)}
.facts a{color:var(--accent-fg)}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{height:26px;padding:0 9px;border:1px solid var(--border-strong);border-radius:var(--r-pill);background:none;font-size:var(--fs-xs);color:var(--text-muted)}
.seg button:hover{color:var(--text);background:var(--bg-hover)}
.seg button[aria-pressed="true"]{border-color:var(--accent-fg);color:var(--accent-fg);background:var(--accent-soft-bg)}
.step{border:1px solid var(--border);border-radius:var(--r-card);overflow:hidden}
.step>div{display:flex;align-items:center;gap:10px;padding:7px 10px;border-bottom:1px solid var(--border);background:var(--surface-raised);font-size:var(--fs-xs);color:var(--text-muted)}
.step>div .btn-ghost{margin-left:auto;height:24px;border:0}
.step pre{margin:0;padding:12px;overflow:auto;background:var(--surface-sunken);font:inherit;font-size:var(--fs-xs);line-height:1.65;color:var(--text-body)}
.step pre b{font-weight:400;color:var(--blue)}
.redact{padding:0 2px;border-radius:2px;background:color-mix(in oklab, var(--warning) 24%, transparent);color:color-mix(in oklab, var(--warning) 85%, var(--text))}

/* forms */
.fwrap{display:flex;flex-direction:column;gap:var(--stack);padding:0 var(--gutter) var(--gutter)}
.fbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fbar .sp{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.btn-solid{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 14px;border:0;border-radius:var(--r-ctl);background:var(--accent-fill);color:var(--on-accent);font-size:var(--fs-sm);font-weight:600}
.btn-solid:hover{box-shadow:var(--shadow-glow)}
.fs{margin:0;padding:0;border:1px solid var(--border);border-radius:var(--r-card);background:var(--surface);min-width:0}
.fs>legend,.fs>.lg{float:left;width:100%;padding:12px 16px;border-bottom:1px solid var(--border-subtle)}
.fs .fb{clear:both;padding:16px;display:flex;flex-direction:column;gap:22px}
.fld h3{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:var(--fs-lg)}
.fld h3 em{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--accent-soft-bg);color:var(--accent-fg);font-size:11px;font-style:normal}
.fld .help{margin-top:8px;font-size:var(--fs-xs);color:var(--text-muted)}
.in{width:100%;min-height:38px;padding:8px 12px;border:1px solid var(--border);border-radius:var(--r-ctl);background:var(--surface-sunken);color:var(--text);font:inherit;font-size:var(--fs-sm)}
.in:focus{outline:0;border-color:var(--accent-fg);box-shadow:0 0 0 1px var(--accent-fg)}
textarea.in{min-height:96px;resize:vertical;line-height:1.5}
.icards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:900px){.icards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.icard{position:relative;display:block;padding:12px;border:1px solid var(--border);border-radius:var(--r-ctl);background:var(--surface-sunken);cursor:pointer;font-size:var(--fs-xs);color:var(--text-muted)}
.icard input{position:absolute;opacity:0;pointer-events:none}
.icard b{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:var(--fs-sm);font-weight:500;color:var(--text)}
.icard:hover{border-color:var(--border-strong)}
.icard:has(input:checked){border-color:var(--accent-fg);background:var(--accent-soft-bg);color:var(--text-body)}
.icard:has(input:focus-visible){outline:2px solid var(--accent-fg);outline-offset:2px}
.meter{display:flex;align-items:center;gap:3px;margin-top:10px}
.meter i{flex:1;height:2px;background:var(--border-strong)}
.meter i.on{background:var(--tan)}
.icard:has(input:checked) .meter i.on{background:var(--accent-fg)}
.meter span{margin-left:8px;font-size:var(--fs-2xs);font-weight:600;letter-spacing:.06em;color:var(--text-muted)}
.starters{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px}
.starters button{min-height:28px;padding:4px 9px;border:1px solid var(--border-strong);border-radius:var(--r-ctl);background:none;font-size:var(--fs-xs);color:var(--text-body);text-align:left}
.starters button:hover{background:var(--bg-hover)}
.row2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.row2{grid-template-columns:1fr}}
.row2 label{display:block;font-size:var(--fs-xs);color:var(--text-muted)}
.row2 label span{display:block;margin-bottom:6px}
.check,.row2 label.check{display:flex;align-items:center;gap:8px;font-size:var(--fs-sm);color:var(--text-body)}
.check input{width:16px;height:16px;accent-color:var(--accent-fill)}
.cmd{display:flex;align-items:flex-start;gap:10px;padding:12px 16px;border:1px solid var(--border);border-radius:var(--r-card);background:var(--surface-sunken);font-size:var(--fs-sm)}
.cmd code{flex:1;min-width:0;padding:0;background:none;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text-body)}
.cmd code b{font-weight:400;color:var(--accent-fg)}

/* settings */
.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--stack)}
@media (max-width:980px){.sgrid{grid-template-columns:1fr}}
.srow{display:grid;grid-template-columns:150px minmax(0,1fr);align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border-subtle);font-size:var(--fs-sm)}
.srow:last-child{border-bottom:0}
.srow>span:first-child{color:var(--text-muted)}
.swatches{display:flex;gap:8px}
.swatches button{width:24px;height:24px;padding:0;border-radius:50%;border:2px solid transparent;background:var(--sw);box-shadow:0 0 0 1px var(--border-strong)}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface), 0 0 0 4px var(--sw)}
:root[data-corners="sharp"]{--r-ctl:0px;--r-pill:0px;--r-card:0px}

.toast{position:fixed;left:50%;bottom:22px;z-index:60;max-width:calc(100vw - 32px);padding:10px 14px;border:1px solid var(--border-strong);border-radius:var(--r-card);background:var(--surface-raised);box-shadow:var(--shadow-window);font-size:var(--fs-sm);color:var(--text);transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s var(--ease)}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:640px){.pagehead h1{font-size:var(--fs-2xl)}.stat .v{font-size:var(--fs-2xl)}.chart{gap:5px}}
/* narrow screens: a table scrolls sideways before its columns are squeezed, and the bar keeps room for the tabs */
@media (max-width:760px){table.dt{min-width:760px}.panel table.dt{min-width:560px}.modepill{display:none}.rail{width:100vw}}
</style>

/* a ladder row: marker and name, a track, then proven / recorded */
function sevLadder(list){

}
/* a count ladder: count, name, track; the top row carries the accent */
function countLadder(rows){

}

/* data table: columns carry a key, a heading, a cell renderer and, for sorting, a value */
function dt(id,cols,rows,st,o){
  o=o||{};const sk=st&&st.sort[0],sd=st&&st.sort[1];
  if(st){const c=cols.find(c=>c.k===sk);if(c){const v=c.v||(r=>r[sk]);rows=rows.slice().sort((a,b)=>{const x=v(a),y=v(b);return (x>y?1:x<y?-1:0)*sd;});}}
  if(o.per){const p=st.page||0;o.total=rows.length;rows=rows.slice(p*o.per,p*o.per+o.per);}
  if(!rows.length)return '<div class="emptyrow"><b>'+(o.empty||'Nothing matches these filters')+'</b>'+(o.emptyHint||'Clear a filter to see more.')+'</div>';
  const head=cols.map(c=>'<th class="'+(c.r?'r':'')+'"'+(st&&c.k===sk?' aria-sort="'+(sd>0?'ascending':'descending')+'"':'')+'>'+(st&&c.s!==false?'<button type="button" data-sort="'+c.k+'">'+c.h+'<span aria-hidden="true">'+(c.k===sk?(sd>0?'↑':'↓'):'↕')+'</span></button>':c.h)+'</th>').join('');
  const body=rows.map(r=>'<tr class="'+(o.link?'link':'')+(o.cur&&o.cur(r)?' cur':'')+'" '+(o.attr?o.attr(r):'')+'>'+cols.map(c=>'<td class="'+(c.c||'')+(c.r?' r':'')+'">'+c.f(r)+'</td>').join('')+'</tr>').join('');
  return '<div class="tw"><table class="dt" data-table="'+id+'"><thead><tr>'+head+'</tr></thead><tbody>'+body+'</tbody></table></div>';
}

      +'<div><div class="label" style="display:flex;align-items:center;margin-bottom:8px">Reproduce · '+t.steps.length+'<button class="btn-ghost" type="button" data-copy="all" style="margin-left:auto">'+ic('copy')+'copy all</button></div><div style="display:grid;gap:10px">'
      +t.steps.map((s,i)=>'<div class="step"><div><span class="b n">'+s[0]+'</span>step '+(i+1)+' of '+t.steps.length+'<button class="btn-ghost" type="button" data-copy="'+i+'">'+ic('copy')+'copy</button></div><pre>'+code(s[1])+'</pre></div>').join('')+'</div>'
      +'<p class="note" style="margin-top:10px">Secrets were scrubbed from these commands. Substitute the real values, or read the unredacted proof with <code>gimorra findings show '+f.id+'</code> on the machine that proved it.</p></div>';
  }
  h+='<div><div class="label" style="margin-bottom:8px">Notes</div><p>'+esc(src?'Flagged by the source audit. A scan of the running service would turn this into a claim or rule it out.':t.note)+'</p></div>';
  $('#railBody').innerHTML=h;
}
function openRail(i){
  ui.rail=i;if(ui.cur.page==='findings')history.replaceState(null,'','#findings/'+F[i].id);
  relist();drawRail();$('#railBody').scrollTop=0;
}
function closeRail(){
  if(ui.rail==null)return;const was=ui.rail;ui.rail=null;if(ui.cur.page==='findings')history.replaceState(null,'','#findings');
  relist();drawRail();const b=view.querySelector('button[data-find="'+was+'"]');if(b)b.focus();
}

/* ================= targets ================= */
function pageTargets(){
  const rows=ENG.filter(e=>e.apex),s=ui.tgt;ui.list=null;
  const cols=[{k:'apex',h:'Apex',c:'t',f:e=>'<a href="#engagement/'+e.id+'">'+e.apex+'</a>'},{k:'client',h:'Program',c:'m',f:e=>e.client},{k:'hosts',h:'Hosts',r:1,c:'num',v:()=>7,f:()=>7},{k:'roster',h:'Roster',r:1,c:'num',v:()=>3,f:()=>3},{k:'notes',h:'Notes',r:1,c:'num',v:()=>2,f:()=>2},{k:'runs',h:'Runs',r:1,c:'num',v:()=>1,f:()=>1},
    {k:'findings',h:'Findings',r:1,c:'num',v:e=>count(byEng(e.id),f=>f.status==='confirmed'),f:e=>count(byEng(e.id),f=>f.status==='confirmed')},{k:'layers',h:'Model layers',s:false,c:'nw',f:e=>e.status==='done'?'<span class="b t-ok">synthesis</span><span class="b n">no curation</span>':'<span class="b n">no synthesis</span><span class="b n">no curation</span>'},{k:'age',h:'Last pass',r:1,c:'m',f:e=>e.age+'d'}];
  return '<div class="pagehead"><h1>Targets</h1><p>Every apex this machine holds a board for: the estate the runs contribute to and read from.</p></div><div id="list">'+dt('tgt',cols,rows,s,{link:1,attr:e=>'data-go="#engagement/'+e.id+'"'})+'<div class="tfoot"><span>'+rows.length+' boards · a range such as 10.20.0.0/16 has no apex and keeps no board</span></div></div>';
}

/* ================= new scan ================= */
const INT=[['passive','eye','Recon and OSINT only: nothing is probed.',1],['lite','target','A first look: fewer specialists, a smaller budget.',2],['balanced','gauge','The default: the full specialist pack.',3],['aggressive','flame','The largest budget, and the only tier that permits DoS-class traffic.',4]];
const STARTERS=['focus on IDOR and broken access control','auth and session handling only - no port scanning','map the API surface first, then test what it exposes','report only - do not exploit anything'];
function scanCmd(){
  const s=ui.scan,q=t=>/[^\w.:\/-]/.test(t)?"'"+t+"'":t;
  return 'gimorra scan'+(s.target.trim()?' -t '+q(s.target.trim()):'')+' --intensity '+s.intensity+(s.autonomy!=='unrestricted'?' --autonomy '+s.autonomy:'')+(s.cap?' --spend-cap-usd '+s.cap:'')+(s.prompt.trim()?' -p '+JSON.stringify(s.prompt.trim()):'')+(s.dry?' --dry-run':'')+(s.detach?' --detach':'');
}
function scanSummary(){
  const s=ui.scan,k=POOL[s.intensity];
  $('#scanCmd').innerHTML='<b>gimorra scan</b>'+esc(scanCmd().slice(12));
  $('#scanChips').innerHTML='<span class="b n">spending pool $'+(k>=1000?(k/1000)+'k':k)+'</span><span class="b t-acc">intensity '+s.intensity+'</span><span class="b n">autonomy '+s.autonomy+'</span><span class="b n">'+(s.cap?'spend cap $'+s.cap:'spend cap default')+'</span>';
}
function pageNewScan(){
  const s=ui.scan;ui.list=null;
  return '<div class="pagehead"><h1>New scan</h1><p>Point at an authorized target: triage, scope, then the goal supervisor.</p></div><form class="fwrap" id="scanForm" autocomplete="off">'
    +'<div class="fbar"><button class="btn-solid" type="submit">'+ic('target')+'Start scan</button><span class="sp" id="scanChips"></span></div>'
    +'<fieldset class="fs"><legend class="label">Essentials</legend><div class="fb">'
    +'<div class="fld"><h3><em>1</em>What to scan</h3><input class="in" name="target" type="text" value="'+esc(s.target)+'" placeholder="acme.test  or  10.0.0.0/24  or  https://api.acme.test/item?id=1" aria-label="Target" spellcheck="false"><p class="help">A URL, host, domain, IP or CIDR. Leave it blank to start from the prompt alone: scope is read from the hosts the sentence names.</p></div>'
    +'<div class="fld"><h3><em>2</em>Intensity</h3><div class="icards" role="radiogroup" aria-label="Intensity">'+INT.map(i=>'<label class="icard"><input type="radio" name="intensity" value="'+i[0]+'"'+(s.intensity===i[0]?' checked':'')+'><b>'+ic(i[1])+i[0].charAt(0).toUpperCase()+i[0].slice(1)+'</b>'+i[2]+'<span class="meter">'+[1,2,3,4].map(n=>'<i class="'+(n<=i[3]?'on':'')+'"></i>').join('')+'<span>$'+(POOL[i[0]]/1000)+'K'+(i[0]==='balanced'?' DEFAULT':'')+'</span></span></label>').join('')+'</div><p class="help">Sets the specialist pack, the budget pool and the turn caps. Everything left blank below is derived from it.</p></div>'
    +'<div class="fld"><h3><em>3</em>Prompt</h3><textarea class="in" name="prompt" placeholder="pentest api.acme.test - focus on IDOR and broken access control" aria-label="Prompt">'+esc(s.prompt)+'</textarea><div class="starters"><span class="label">Start from</span>'+STARTERS.map(t=>'<button type="button" data-starter="'+esc(t)+'">'+t+'</button>').join('')+'</div><p class="help">Optional. Steers the goal supervisor and overrides the auto-derived brief. Prose never widens scope: only a host it names does.</p></div></div></fieldset>'
    +'<fieldset class="fs"><legend class="label">Budget and autonomy</legend><div class="fb"><div class="row2">'
    +'<label><span>Spend cap, USD (--spend-cap-usd)</span><input class="in" name="cap" type="number" min="0" step="5" inputmode="decimal" value="'+esc(s.cap)+'" placeholder="default for the intensity"></label>'
    +'<label><span>Autonomy (--autonomy)</span><select class="in" name="autonomy">'+['unrestricted','standard','strict'].map(a=>opt(a,s.autonomy)).join('')+'</select></label>'
    +'<div style="display:grid;gap:10px;align-content:end"><label class="check"><input type="checkbox" name="detach"'+(s.detach?' checked':'')+'>Run in the background (--detach)</label><label class="check"><input type="checkbox" name="dry"'+(s.dry?' checked':'')+'>Read the derivation first (--dry-run)</label></div></div>'
    +'<p class="note">Unrestricted means no approval gates. Use standard or strict, and a spend cap, when the target or the budget is not yours.</p></div></fieldset>'
    +'<div><div class="label" style="margin-bottom:8px">What this form runs</div><div class="cmd"><code id="scanCmd"></code><button class="btn-ghost" type="button" data-copy="cmd">'+ic('copy')+'copy</button></div></div></form>';
}

/* ================= settings ================= */
const ACCENTS=['#78d670','#e0a84a','#7fb0e0','#e58a9a','#b79cf0'];
function applyPrefs(){
  const p=ui.prefs;root.style.setProperty('--accent',p.accent);
  p.density==='compact'?root.setAttribute('data-density','compact'):root.removeAttribute('data-density');
  p.corners==='sharp'?root.setAttribute('data-corners','sharp'):root.removeAttribute('data-corners');
  try{localStorage.setItem('gm-ui',JSON.stringify(p));}catch(e){}
}
function pageSettings(){
  const p=ui.prefs,mode=root.getAttribute('data-mode');ui.list=null;
  const seg=(key,vals,cur)=>'<span class="seg">'+vals.map(v=>'<button type="button" data-pref="'+key+':'+v+'" aria-pressed="'+(v===cur)+'">'+v+'</button>').join('')+'</span>';
  const row=(k,v)=>'<div class="srow"><span>'+k+'</span><span>'+v+'</span></div>';
  return '<div class="pagehead"><h1>Settings</h1><p>Runtime configuration for this gateway.</p></div><div class="pad"><div class="sgrid">'
    +panel('Appearance','stored in this browser only',row('mode',seg('mode',['dark','light'],mode))+row('accent','<span class="swatches">'+ACCENTS.map(a=>'<button type="button" data-pref="accent:'+a+'" aria-pressed="'+(a===p.accent)+'" aria-label="Accent '+a+'" style="--sw:'+a+'"></button>').join('')+'</span>')+row('density',seg('density',['default','compact'],p.density))+row('corners',seg('corners',['default','sharp'],p.corners))+row('font','JetBrains Mono'))
    +panel('Build','sample',row('version','gimorra 0.1.101-alpha')+row('channel','alpha')+row('author','@j3ssie')+row('about','Autonomous offensive security agent'))
    +panel('Runtime','read from the gateway',row('Tier','Embedded')+row('Orchestrator model','claude-opus-5-5')+row('Specialist model','claude-sonnet-5-5')+row('Autonomy default','unrestricted'))
    +panel('Drivers and store','one codebase, two tiers',row('Store','sqlite')+row('Queue','inproc')+row('Stream','emitter')+row('Engagements',ENG.length)+row('Jobs',JOBS.length)+row('Findings',F.length))
    +'</div><p class="note">Configuration is file and environment driven. Drivers and the orchestrator model come from <code>~/.gimorra/configs.yaml</code> or <code>GIMORRA_*</code> variables; the switch between tiers is config only.</p></div>';
}

/* ================= routing ================= */
const PAGES={dashboard:pageDashboard,engagements:pageEngagements,engagement:pageEngagement,findings:pageFindings,targets:pageTargets,'new-scan':pageNewScan,settings:pageSettings};
const TABOF={engagement:'engagements'};
function relist(){const l=$('#list');if(l&&ui.list)l.innerHTML=ui.list();}
function syncTop(){
  const n=waiting();$('#alertN').textContent=n;$('#alertBtn').hidden=!n;
  document.querySelectorAll('#tabs .tab').forEach(t=>{const on=t.dataset.tab===(TABOF[ui.cur.page]||ui.cur.page);t.classList.toggle('on',on);on?t.setAttribute('aria-current','page'):t.removeAttribute('aria-current');});
}
function draw(){
  view.innerHTML=PAGES[ui.cur.page](ui.cur.a,ui.cur.b);
  if(ui.cur.page==='new-scan')scanSummary();
  drawRail();syncTop();
}
function route(){
  const p=(location.hash||'#dashboard').slice(1).split('/'),c={page:PAGES[p[0]]?p[0]:'dashboard',a:p[1]||'',b:p[2]||''};
  const moved=c.page!==ui.cur.page||(c.page==='engagement'&&c.a!==ui.cur.a);
  ui.cur=c;
  if(c.page==='findings'){const i=F.findIndex(f=>f.id===c.a);ui.rail=i<0?null:i;}else if(moved)ui.rail=null;
  draw();if(moved)content.scrollTop=0;
}
window.addEventListener('hashchange',route);

/* ================= events ================= */
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600);}
function copy(text){(navigator.clipboard?navigator.clipboard.writeText(text):Promise.reject()).then(()=>toast('Copied.'),()=>toast('Copy is blocked here. Select the text instead.'));}
document.addEventListener('click',e=>{
  const el=x=>e.target.closest(x);let b;
  if((b=el('[data-sort]'))){const s=ui[b.closest('table').dataset.table],k=b.dataset.sort;s.sort=[k,s.sort[0]===k?-s.sort[1]:1];s.page=0;ui.cur.page==='targets'?draw():relist();return;}
  if((b=el('[data-page]'))){ui.find.page+=+b.dataset.page;relist();content.scrollTop=0;return;}
  if((b=el('[data-triage]'))){const f=F[ui.rail];f.status=b.dataset.triage;f.by=f.status==='open'?'-':'operator';if(f.status!=='open')f.potential=false;relist();drawRail();toast('Marked '+f.status+'. Sample data: the change stays in this tab.');return;}
  if((b=el('[data-copy]'))){const k=b.dataset.copy;copy(k==='cmd'?scanCmd():k==='all'?Array.from(rail.querySelectorAll('.step pre')).map(p=>p.textContent).join('\n\n'):b.closest('.step').querySelector('pre').textContent);return;}
  if((b=el('[data-appr]'))){const p=b.dataset.appr.split(':');APPR[+p[0]].state=p[1];draw();toast(p[1]==='yes'?'Recorded. The run can advance.':'Refused. The run moves on without it.');return;}
  if((b=el('[data-toast]'))){toast(b.dataset.toast);return;}
  if((b=el('[data-switch]'))){b.setAttribute('aria-pressed',String(b.getAttribute('aria-pressed')!=='true'));return;}
  if((b=el('[data-starter]'))){ui.scan.prompt=b.dataset.starter;$('#scanForm').elements.prompt.value=ui.scan.prompt;scanSummary();return;}
  if((b=el('[data-pref]'))){const i=b.dataset.pref.indexOf(':'),k=b.dataset.pref.slice(0,i),v=b.dataset.pref.slice(i+1);if(k==='mode'){if(root.getAttribute('data-mode')!==v)$('#modeToggle').click();}else{ui.prefs[k]=v;applyPrefs();}draw();return;}
  if((b=el('[data-find]'))){openRail(+b.dataset.find);return;}
  if((b=el('tr[data-go]'))&&!el('a')){location.hash=b.dataset.go;}
});
document.addEventListener('input',e=>{
  const f=e.target.dataset&&e.target.dataset.f;
  if(f){const p=f.split('.');ui[p[0]][p[1]]=e.target.value;ui[p[0]].page=0;relist();return;}
  if(e.target.form&&e.target.form.id==='scanForm'){const t=e.target;ui.scan[t.name]=t.type==='checkbox'?t.checked:t.value;scanSummary();}
});
document.addEventListener('submit',e=>{e.preventDefault();toast(ui.scan.target.trim()||ui.scan.prompt.trim()?'Sample console: nothing was started. The command below is what would run.':'Name a target or write a prompt first.');});
function hint(e){const c=e.target.closest&&e.target.closest('.colw'),h=$('#chartHint');if(h)h.textContent=c?c.dataset.day:'last 12 days · hover a day';}
view.addEventListener('mouseover',hint);view.addEventListener('focusin',hint);view.addEventListener('mouseout',e=>{if(e.target.closest('.colw'))hint({target:view});});
$('#railClose').addEventListener('click',closeRail);
/* ---- theme ---- */
var themeColor=document.querySelector('meta[name="theme-color"]');
function syncThemeColor(){themeColor.setAttribute('content',root.getAttribute('data-mode')==='light'?'#fbf9f6':'#211b14');}
$('#modeToggle').addEventListener('click',function(){
  var next=root.getAttribute('data-mode')==='light'?'dark':'light';
  root.setAttribute('data-mode',next);syncThemeColor();
  try{localStorage.setItem('gm-mode',next);}catch(e){}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeRail();return;}
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='t')$('#modeToggle').click();
  if(e.key==='/'){const i=view.querySelector('.filter input');if(i){e.preventDefault();i.focus();}}
});
syncThemeColor();applyPrefs();route();
})();
</script>
</body>
</html>
