<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vigolium · Scan lifecycle (sample)</title>
<meta name="description" content="Sample canvas page: the path of one scan request through Vigolium, drawn as a pannable infrastructure diagram you can send a request through.">
<link rel="icon" href="../assets/vigolium-mark.png">
<meta name="color-scheme" content="dark light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- Parser-blocking on purpose: the stored theme has to land before the first paint. -->
<script>
(function () {
  var t = null;
  try { t = localStorage.getItem("vg-lifecycle-theme"); } catch (e) {}
  if (t !== "light" && t !== "dark") t = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  document.documentElement.dataset.theme = t;
})();
</script>
<style>
/* Hallmark · shape: app screen · genre: modern-minimal · theme: custom · idea: "a scan request drawn the way an edge platform draws its request path, and you can send one through" · vibe: "black ground, hairlines, hatching, exact"
 * paper: oklch(0% 0 0) · accent: oklch(94.6% 0 0) · display: Geist · body: Geist
 * nav: one-line top bar with scene tabs · signature: the request trace travelling the diagram · states: no selection, node selected, tracing, blocked, reduced motion
 * axes: dark/grotesk/neutral · posture: restrained · contrast: pass · v2.0.0 */
/* Hallmark · pre-emit critique: P4 H4 E4 S4 R4 V4 · weakest: S, the frame is a known diagram idiom; the record lookup with seen, new and changed outcomes is the part only a scanner has, so the trace is built on it */
/* Not Hallmark-clean on 67, on purpose: diagram group labels are uppercase because the reference diagrams the page was asked to follow set them that way. Interface labels outside the canvas stay sentence case. Mono on the same labels (gate 64) is kept for the same reason. */
:root {
  color-scheme: dark;
  --space-3xs: 2px; --space-2xs: 4px; --space-xs: 8px; --space-sm: 12px; --space-md: 16px; --space-lg: 24px; --space-xl: 40px;
  --text-xs: 0.75rem; --text-sm: 0.875rem; --text-md: 1rem; --text-lg: 1.2rem; --text-node: 0.9375rem;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-micro: 120ms; --dur-short: 220ms;
  --color-paper: light-dark(oklch(98.5% 0 0), oklch(0% 0 0));
  --color-paper-2: light-dark(oklch(100% 0 0), oklch(14.5% 0 0));
  --color-paper-3: light-dark(oklch(96% 0 0), oklch(20.5% 0 0));
  --color-ink: light-dark(oklch(20.5% 0 0), oklch(94.6% 0 0));
  --color-ink-2: light-dark(oklch(42% 0 0), oklch(74% 0 0));
  --color-muted: light-dark(oklch(51% 0 0), oklch(66% 0 0));
  --color-rule: light-dark(oklch(91.5% 0 0), oklch(25% 0 0));
  --color-rule-2: light-dark(oklch(80% 0 0), oklch(36% 0 0));
  --color-edge: light-dark(oklch(45% 0 0), oklch(94.6% 0 0));
  --color-hatch: light-dark(oklch(0% 0 0 / 0.055), oklch(100% 0 0 / 0.075));
  --color-accent: var(--color-ink); --color-accent-ink: var(--color-paper);
  --color-focus: light-dark(oklch(55% 0.2 255), oklch(74% 0.14 250));
  --color-ok: light-dark(oklch(46% 0.1 175), oklch(80% 0.13 178));
  --color-warn: light-dark(oklch(49% 0.12 65), oklch(82% 0.14 78));
  --color-info: light-dark(oklch(49% 0.17 255), oklch(77% 0.12 250));
  --color-error: light-dark(oklch(51% 0.2 25), oklch(72% 0.17 22));
  --color-alt: light-dark(oklch(48% 0.17 300), oklch(77% 0.12 300));
  --color-select: var(--color-info);
  --font-display: "Geist", ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --font-body: "Geist", ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius-card: 6px; --radius-ctl: 6px; --radius-pill: 999px;
  --bar-h: 56px; --side-w: 360px;
  --shadow-hud: 0 8px 24px -12px oklch(0% 0 0 / 0.5);
  --z-edges: 1; --z-nodes: 2; --z-marks: 3; --z-hud: 10; --z-bar: 20;
}
:root[data-theme="light"] { color-scheme: light; }

*, *::before, *::after { box-sizing: border-box; }
html, body { overflow-x: clip; }
html { scrollbar-color: var(--color-rule-2) var(--color-paper); }
body {
  margin: 0; height: 100dvh; display: grid; grid-template-rows: var(--bar-h) minmax(0, 1fr);
  background: var(--color-paper); color: var(--color-ink);
  font-family: var(--font-body); font-size: var(--text-sm); line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
::selection { background: color-mix(in oklab, var(--color-info) 30%, transparent); }
:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
h1, h2, h3, p, ol, ul, dl, dd, pre { margin: 0; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; overflow-wrap: break-word; min-width: 0; text-wrap: balance; }
button { font: inherit; color: inherit; }
a { color: inherit; }
svg { display: block; }
[hidden] { display: none !important; }
.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.sprite { position: absolute; width: 0; height: 0; }

/* ── top bar ─────────────────────────────────────────────────────────── */
.bar {
  position: relative; z-index: var(--z-bar); display: flex; align-items: stretch; gap: var(--space-lg);
  padding-inline: var(--space-md); border-bottom: 1px solid var(--color-rule); background: var(--color-paper);
}
.crumbs { display: flex; align-items: center; gap: var(--space-xs); min-width: 0; }
.brand { display: inline-flex; align-items: center; gap: var(--space-xs); text-decoration: none; font-weight: 600; border-radius: var(--radius-ctl); }
.brand img { border-radius: 5px; }
.crumbs .sep { color: var(--color-rule-2); font-size: var(--text-lg); font-weight: 400; }
.crumbs .proj { color: var(--color-ink-2); font-family: var(--font-mono); font-size: var(--text-xs); white-space: nowrap; }
.crumbs h1 { font-size: var(--text-sm); font-weight: 500; white-space: nowrap; }
.tabs { display: flex; align-items: stretch; gap: var(--space-2xs); overflow-x: auto; scrollbar-width: none; }
.tabs a {
  position: relative; display: inline-flex; align-items: center; padding-inline: var(--space-sm);
  color: var(--color-muted); text-decoration: none; white-space: nowrap;
  transition: color var(--dur-micro);
}
.tabs a:hover { color: var(--color-ink); }
.tabs a[aria-current="page"] { color: var(--color-ink); }
.tabs a[aria-current="page"]::after { content: ""; position: absolute; inset: auto var(--space-sm) -1px; height: 2px; background: var(--color-ink); }
.tabs a:focus-visible { outline-offset: -4px; border-radius: var(--radius-ctl); }
.bar-end { margin-left: auto; display: flex; align-items: center; gap: var(--space-sm); }
.note { color: var(--color-muted); font-size: var(--text-xs); white-space: nowrap; }

.btn {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-xs);
  height: 32px; padding-inline: var(--space-sm); border: 1px solid var(--color-rule-2); border-radius: var(--radius-ctl);
  background: var(--color-paper); color: var(--color-ink); cursor: pointer; white-space: nowrap; font-weight: 500;
  transition: background-color var(--dur-micro), border-color var(--dur-micro), color var(--dur-micro);
}
.btn::after { content: ""; position: absolute; inset: -6px -2px; }
.btn:hover { background: var(--color-paper-3); border-color: var(--color-ink-2); }
.btn:active { background: var(--color-rule); }
.btn.sq { width: 32px; padding: 0; }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }
.btn.primary { background: var(--color-accent); color: var(--color-accent-ink); border-color: var(--color-accent); }
.btn.primary:hover { background: var(--color-ink-2); border-color: var(--color-ink-2); }
.btn.primary:active { background: var(--color-muted); border-color: var(--color-muted); }
:root[data-theme="dark"] .t-moon, :root[data-theme="light"] .t-sun { display: none; }

/* ── stage ───────────────────────────────────────────────────────────── */
.stage { display: grid; grid-template-columns: minmax(0, 1fr) var(--side-w); min-height: 0; }
.canvas { position: relative; overflow: hidden; min-height: 0; touch-action: none; cursor: grab; background: var(--color-paper); }
.canvas.panning { cursor: grabbing; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
.world.ease { transition: transform var(--dur-short) var(--ease-out); }
.world::before {
  content: ""; position: absolute; inset: -1600px; pointer-events: none;
  background-image: radial-gradient(var(--color-rule) 1px, transparent 1px); background-size: 24px 24px;
}

/* regions */
.reg { position: absolute; border: 1px solid var(--color-rule-2); border-radius: var(--radius-card); pointer-events: none; }
.reg.hatch { background: repeating-linear-gradient(-45deg, var(--color-hatch) 0 1px, transparent 1px 7px), var(--color-paper); }
.reg.grp { background: repeating-linear-gradient(-45deg, var(--color-hatch) 0 1px, transparent 1px 7px), var(--color-paper-3); }
.reg.dash { border-style: dashed; background: var(--color-paper); }
.reg.dash.inner { background: var(--color-paper-2); }
.reg.tint { border: 0; border-radius: 5px 5px 0 0; background: repeating-linear-gradient(-45deg, color-mix(in oklab, var(--color-info) 24%, transparent) 0 1px, transparent 1px 7px), color-mix(in oklab, var(--color-info) 5%, transparent); }
.reg.line { height: 0; border: 0; border-top: 1px solid var(--color-rule-2); border-radius: 0; }
.glabel {
  position: absolute; display: inline-flex; align-items: center; gap: var(--space-xs); white-space: nowrap; pointer-events: none;
  font: 500 var(--text-sm)/1 var(--font-mono); text-transform: uppercase; color: var(--color-ink);
}
.glabel .ic { color: var(--tone, currentColor); }
.glabel.plain { font: 500 var(--text-md)/1 var(--font-body); text-transform: none; }
.glabel.plain .ic { width: 18px; height: 18px; color: var(--color-ink-2); }
.glabel img { border-radius: 4px; }

/* edges */
.edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; z-index: var(--z-edges); }
.edge .ln { fill: none; stroke: var(--tone, var(--color-edge)); stroke-width: 1; transition: stroke-width var(--dur-micro); }
.edge.dashed .ln { stroke-dasharray: 4 4; }
.edge .ah { fill: var(--tone, var(--color-edge)); }
.edge.on .ln { stroke: var(--trace, var(--tone, var(--color-edge))); stroke-width: 2.25; }
.edge.on .ah { fill: var(--trace, var(--tone, var(--color-edge))); }
.tone-ok { --tone: var(--color-ok); } .tone-warn { --tone: var(--color-warn); }
.tone-info { --tone: var(--color-info); } .tone-bad { --tone: var(--color-error); } .tone-alt { --tone: var(--color-alt); }

/* nodes */
.node {
  position: absolute; z-index: var(--z-nodes); display: grid; place-content: center; justify-items: center; gap: var(--space-3xs);
  padding: 0 var(--space-xs); border: 1px solid var(--color-rule-2); border-radius: var(--radius-card);
  background: var(--color-paper); color: var(--color-ink); text-align: center; cursor: pointer;
  font: 500 var(--text-node)/1.3 var(--font-body);
  transition: border-color var(--dur-micro), background-color var(--dur-micro), box-shadow var(--dur-micro);
}
.node:hover { border-color: var(--color-ink-2); }
.node.on { border-color: var(--trace, var(--color-ink)); background: light-dark(color-mix(in oklab, var(--trace, var(--color-ink)) 7%, var(--color-paper-2)), color-mix(in oklab, var(--trace, var(--color-ink)) 13%, var(--color-paper))); }
.node.bad { border-color: var(--color-error); background: color-mix(in oklab, var(--color-error) 16%, var(--color-paper)); }
.node[aria-pressed="true"] { border-color: var(--color-select); box-shadow: 0 0 0 1px var(--color-select), 0 0 0 5px color-mix(in oklab, var(--color-select) 20%, transparent); }
.node.dashed { border-style: dashed; }
.node code { font: 400 var(--text-xs)/1.3 var(--font-mono); color: var(--color-muted); }
.node small { font: 400 var(--text-xs)/1.3 var(--font-body); color: var(--color-muted); }
.node.path { font: 400 var(--text-sm)/1.3 var(--font-mono); }
.node .or { display: block; margin-block: var(--space-2xs); color: var(--color-muted); font-weight: 400; }
.node.tile .ic, .node.round .ic { width: 26px; height: 26px; }
.node.round { border-radius: 50%; }
.node.round.tint { border-color: color-mix(in oklab, var(--color-info) 60%, var(--color-paper)); background: color-mix(in oklab, var(--color-info) 14%, var(--color-paper)); color: var(--color-info); }
.node.row { grid-auto-flow: column; align-items: center; gap: var(--space-xs); text-align: left; }
.node.row .ic { width: 18px; height: 18px; color: var(--tone, var(--color-ink-2)); }
.deco { position: absolute; z-index: var(--z-nodes); display: grid; place-items: center; border: 1px solid var(--color-rule-2); border-radius: var(--radius-card); background: var(--color-paper); pointer-events: none; }
.deco .ic { width: 26px; height: 26px; }

/* pills and badges on edges */
.pill {
  position: absolute; z-index: var(--z-marks); transform: translate(-50%, -50%); pointer-events: none;
  display: inline-flex; align-items: center; gap: var(--space-xs); height: 26px; padding: 0 var(--space-sm) 0 var(--space-xs); white-space: nowrap;
  border: 1px solid color-mix(in oklab, var(--tone, var(--color-ink)) 62%, var(--color-paper)); border-radius: var(--radius-pill);
  background: color-mix(in oklab, var(--tone, var(--color-ink)) 15%, var(--color-paper)); color: var(--tone, var(--color-ink));
  font: 400 var(--text-xs)/1 var(--font-mono);
}
.pill.plain { background: var(--color-paper); }
.pill .ic { width: 13px; height: 13px; }
.badge {
  position: absolute; z-index: var(--z-marks); transform: translate(-50%, -50%); pointer-events: none;
  display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%;
  background: color-mix(in oklab, var(--tone, var(--color-info)) 20%, var(--color-paper)); color: var(--tone, var(--color-info));
  box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--tone, var(--color-info)) 65%, var(--color-paper));
  transition: background-color var(--dur-micro), color var(--dur-micro), box-shadow var(--dur-micro);
}
.badge.bad { --tone: var(--color-error); }
.pkt {
  position: absolute; left: 0; top: 0; z-index: var(--z-marks); width: var(--space-sm); height: var(--space-sm); margin: calc(var(--space-sm) / -2) 0 0 calc(var(--space-sm) / -2); border-radius: 50%;
  background: var(--trace, var(--color-ink)); box-shadow: 0 0 0 4px color-mix(in oklab, var(--trace, var(--color-ink)) 30%, transparent);
  pointer-events: none; opacity: 0; transition: opacity var(--dur-micro);
}
.pkt.show { opacity: 1; }

/* canvas HUD */
.hud { position: absolute; z-index: var(--z-hud); cursor: default; }
.zoom { left: var(--space-md); top: var(--space-md); display: flex; gap: var(--space-2xs); }
.zoom output { display: grid; place-items: center; min-width: 52px; height: 32px; padding-inline: var(--space-xs); border: 1px solid var(--color-rule); border-radius: var(--radius-ctl); background: var(--color-paper); color: var(--color-ink-2); font-variant-numeric: tabular-nums; }
.trace {
  left: 50%; bottom: var(--space-md); transform: translateX(-50%); width: min(820px, calc(100% - 2 * var(--space-md)));
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-xs) var(--space-sm);
  padding: var(--space-xs); border: 1px solid var(--color-rule-2); border-radius: 10px; background: var(--color-paper-2);
  box-shadow: var(--shadow-hud);
}
.trace-status { flex: 1 1 100%; min-width: 0; padding: var(--space-2xs) var(--space-xs) 0; color: var(--color-ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trace-status b { color: var(--color-ink); font-weight: 500; }
.trace-status .n { font-variant-numeric: tabular-nums; color: var(--color-muted); margin-right: var(--space-xs); }
.seg { display: flex; margin-right: auto; padding: var(--space-3xs); border: 1px solid var(--color-rule); border-radius: var(--radius-ctl); background: var(--color-paper); overflow-x: auto; scrollbar-width: none; max-width: 100%; }
.seg button {
  position: relative; display: inline-flex; align-items: center; gap: var(--space-xs); height: 28px; padding-inline: var(--space-sm); border: 0; border-radius: 4px;
  background: transparent; color: var(--color-muted); cursor: pointer; white-space: nowrap;
  transition: background-color var(--dur-micro), color var(--dur-micro);
}
.seg button::after { content: ""; position: absolute; inset: -8px 0; }
.seg button .ic { width: 14px; height: 14px; color: var(--tone, var(--color-ink-2)); }
.seg button:hover { color: var(--color-ink); }
.seg button[aria-pressed="true"] { background: var(--color-paper-3); color: var(--color-ink); }

/* ── side panel ──────────────────────────────────────────────────────── */
.side { border-left: 1px solid var(--color-rule); background: var(--color-paper); overflow-y: auto; min-height: 0; }
.side section { padding: var(--space-lg); }
.side section + section { border-top: 1px solid var(--color-rule); }
.side h2 { font-size: var(--text-lg); line-height: 1.25; }
.side h3 { font-size: var(--text-sm); }
.side p { color: var(--color-ink-2); margin-top: var(--space-xs); text-wrap: pretty; }
.props { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: var(--space-xs) var(--space-sm); margin-top: var(--space-md); }
.props dt { color: var(--color-muted); }
.facts { list-style: none; padding: 0; margin-top: var(--space-md); display: grid; gap: var(--space-xs); }
.facts li { padding-left: var(--space-md); position: relative; color: var(--color-ink-2); }
.facts li::before { content: ""; position: absolute; left: 0; top: 0.72em; width: 8px; height: 1px; background: var(--color-rule-2); }
.code { margin-top: var(--space-md); padding: var(--space-sm); border: 1px solid var(--color-rule); border-radius: var(--radius-card); background: var(--color-paper-2); font: 400 var(--text-xs)/1.7 var(--font-mono); overflow-x: auto; white-space: pre; }
.legend { list-style: none; padding: 0; margin-top: var(--space-md); display: grid; gap: var(--space-sm); }
.legend li { display: grid; gap: var(--space-2xs); color: var(--color-ink-2); }
.legend .pill { position: static; transform: none; justify-self: start; }
.side .btn { margin-top: var(--space-md); }
.route-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-sm); }
.route-head span { color: var(--color-muted); font-size: var(--text-xs); }
.route { list-style: none; padding: 0; margin: var(--space-sm) calc(-1 * var(--space-xs)) 0; counter-reset: s; }
.route button {
  counter-increment: s; display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 0 var(--space-xs); width: 100%; padding: var(--space-xs);
  border: 0; border-radius: var(--radius-ctl); background: transparent; text-align: left; cursor: pointer;
  transition: background-color var(--dur-micro);
}
.route button::before { content: counter(s); grid-row: span 2; color: var(--color-muted); font-variant-numeric: tabular-nums; }
.route button:hover { background: var(--color-paper-3); }
.route b { font-weight: 500; }
.route span { grid-column: 2; color: var(--color-muted); font-size: var(--text-xs); line-height: 1.45; }
.route li.done b { color: var(--color-ink-2); }
.route li[aria-current="step"] button { background: var(--color-paper-3); box-shadow: inset 2px 0 0 var(--trace, var(--color-ink)); }
.route li.bad[aria-current="step"] button { box-shadow: inset 2px 0 0 var(--color-error); }
.route li.bad[aria-current="step"] b { color: var(--color-error); }

.fallback { position: absolute; inset: 0; overflow: auto; padding: var(--space-xl); background: var(--color-paper); }
.fallback ol { margin-top: var(--space-md); padding-left: var(--space-lg); display: grid; gap: var(--space-xs); max-width: 60ch; color: var(--color-ink-2); }

@media (max-width: 60rem) {
  body { height: auto; display: block; }
  .bar { height: var(--bar-h); gap: var(--space-sm); }
  .stage { display: block; }
  .canvas { height: 68svh; min-height: 420px; }
  .side { border-left: 0; border-top: 1px solid var(--color-rule); }
  .crumbs .proj, .crumbs .sep.p, .note { display: none; }
}
@media (max-width: 40rem) {
  .crumbs .word, .crumbs .sep { display: none; }
  .btn, .seg button { font-size: var(--text-md); }
  .trace-status { white-space: normal; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
}
</style>
</head>

<svg class="sprite" aria-hidden="true">
  <symbol id="i-terminal" viewBox="0 0 24 24"><path d="M5 17l6-5-6-5M13 18.5h7"/></symbol>

        ["disc2", ["d2"], "The spider reads every link and form on the page."],
        ["forms", ["d7"], "Inputs are recorded as insertion points."],
        ["off", ["d8"], "One link points at cdn.vendor.test, which the boundary list denies."],
        ["op", ["d9"], "Written to the coverage table and reported. Never requested."]] },
    ],
  },
};

/* ── state ────────────────────────────────────────────────────────────── */
const canvas = $("#canvas"), world = $("#world"), detail = $("#detail"), routeEl = $("#route");
const statusEl = $("#status"), seg = $("#seg"), send = $("#send");
const st = { scene: "lifecycle", trace: "new", node: null };
const view = { x: 0, y: 0, k: 1 };
let userMoved = false, runId = 0, playing = false, sent = false, pkt = null;
const scene = () => SCENES[st.scene];
const trace = () => scene().traces.find((t) => t.id === st.trace) || scene().traces[0];
const title = (n) => n.t || DOC[n.id].t;

/* ── drawing ──────────────────────────────────────────────────────────── */
function pathD(p, r = 10) {
  let d = `M${p[0][0]},${p[0][1]}`;
  for (let i = 1; i < p.length - 1; i++) {
    const [x0, y0] = p[i - 1], [x1, y1] = p[i], [x2, y2] = p[i + 1];
    const d1 = Math.hypot(x1 - x0, y1 - y0), d2 = Math.hypot(x2 - x1, y2 - y1), rr = Math.min(r, d1 / 2, d2 / 2);
    d += ` L${x1 - ((x1 - x0) / d1) * rr},${y1 - ((y1 - y0) / d1) * rr} Q${x1},${y1} ${x1 + ((x2 - x1) / d2) * rr},${y1 + ((y2 - y1) / d2) * rr}`;
  }
  const l = p[p.length - 1];
  return `${d} L${l[0]},${l[1]}`;
}
const head = (tip, from) => `<path class="ah" d="M0,0 L-8,-4 L-8,4 Z" transform="translate(${tip[0]},${tip[1]}) rotate(${(Math.atan2(tip[1] - from[1], tip[0] - from[0]) * 180) / Math.PI})"/>`;
function edgeSvg(e) {
  const p = e.p, n = p.length, a = e.a || "";
  return `<g class="edge${e.tone ? " tone-" + e.tone : ""}${e.dash ? " dashed" : ""}" data-id="${e.id}"><path class="ln" d="${pathD(p)}"/>${a === "e" || a === "b" ? head(p[n - 1], p[n - 2]) : ""}${a === "b" ? head(p[0], p[1]) : ""}</g>`;
}
const box = (o) => `left:${o.x}px;top:${o.y}px;width:${o.w}px;${o.h ? `height:${o.h}px` : ""}`;
function render() {
  const sc = scene();
  world.style.width = sc.w + "px"; world.style.height = sc.h + "px";
  let h = "";
  for (const r of sc.regs || []) h += `<div class="reg ${r.c}" style="${box(r)}"></div>`;
  for (const l of sc.labels || []) h += `<span class="glabel${l.plain ? " plain" : ""}${l.tone ? " tone-" + l.tone : ""}" style="left:${l.x}px;top:${l.y}px">${l.img ? `<img src="../assets/vigolium-mark.png" width="18" height="18" alt="">` : ""}${l.i ? ic(l.i) : ""}${l.t}</span>`;
  h += `<svg class="edges" width="${sc.w}" height="${sc.h}" aria-hidden="true">${sc.edges.map(edgeSvg).join("")}</svg>`;
  for (const d of sc.decos || []) h += `<div class="deco" style="${box(d)}">${ic(d.i)}</div>`;
  for (const n of sc.nodes) {
    const iconOnly = /tile|round/.test(n.k || "");
    h += `<button type="button" class="node ${n.k || ""}" data-id="${n.id}" style="${box(n)}" aria-pressed="false"${iconOnly ? ` aria-label="${DOC[n.id].t}" title="${DOC[n.id].t}"` : ""}>${n.i ? ic(n.i) : ""}${iconOnly ? "" : `<span>${title(n)}</span>`}${n.s ? `<code>${n.s}</code>` : ""}${n.d ? `<small>${n.d}</small>` : ""}</button>`;
  }
  for (const p of sc.pills || []) h += `<span class="pill${p.tone ? " tone-" + p.tone : ""}${p.plain ? " plain" : ""}" style="left:${p.x}px;top:${p.y}px">${ic(p.i)}${p.t}</span>`;
  for (const b of sc.badges || []) h += `<span class="badge" data-id="${b.id}" style="left:${b.x}px;top:${b.y}px">${ic(b.i)}</span>`;
  world.innerHTML = h + `<div class="pkt"></div>`;
  pkt = $(".pkt", world);
  setTone();
  seg.innerHTML = sc.traces.map((t) => `<button type="button" class="tone-${t.tone}" data-trace="${t.id}" aria-pressed="${t.id === trace().id}">${ic(t.i)}${t.label}</button>`).join("");
  document.querySelectorAll(".tabs a").forEach((a) => a.dataset.scene === st.scene ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
}

/* ── side panel ───────────────────────────────────────────────────────── */
// The selected outcome's colour, read by the packet, the visited path and the route list.
const TONE = { ok: "ok", warn: "warn", info: "info", alt: "alt", bad: "error" };
const setTone = () => $(".stage").style.setProperty("--trace", `var(--color-${TONE[trace().tone]})`);

function renderDetail() {
  const sc = scene(), d = st.node && DOC[st.node];
  world.querySelectorAll(".node").forEach((n) => n.setAttribute("aria-pressed", String(n.dataset.id === st.node)));
  if (!d) {
    detail.innerHTML = `<h2>${sc.title}</h2><p>${sc.lead}</p><ul class="legend">${sc.traces.map((t) => `<li><span class="pill tone-${t.tone}">${ic(t.i)}${t.label}</span><span>${t.sum}</span></li>`).join("")}</ul>`;
    return;
  }
  detail.innerHTML = `<h2>${d.t}</h2><p>${d.lead}</p>
    <dl class="props"><dt>Stage</dt><dd>${d.stage}</dd><dt>Kind</dt><dd>${d.kind}</dd></dl>
    ${d.facts ? `<ul class="facts">${d.facts.map((f) => `<li>${f}</li>`).join("")}</ul>` : ""}
    ${d.code ? `<pre class="code">${d.code.join("\n")}</pre>` : ""}
    ${d.jump ? `<a class="btn" href="#${d.jump[0]}/${SCENES[d.jump[0]].traces[0].id}/${d.jump[1]}">${d.jump[2]}</a> ` : ""}<button class="btn" type="button" data-clear>Back to overview</button>`;
}
function renderRoute(cur = -1, bad = false) {
  const t = trace();
  $("#routeName").textContent = t.label;
  routeEl.innerHTML = t.steps.map((s, i) => `<li class="${i < cur ? "done" : ""}${bad && i === cur ? " bad" : ""}"${i === cur ? ' aria-current="step"' : ""}><button type="button" data-node="${s[0]}"><b>${DOC[s[0]].t}</b><span>${s[2]}</span></button></li>`).join("");
  const side = routeEl.closest(".side"), li = routeEl.children[cur];
  if (li && side.scrollHeight > side.clientHeight + 1) li.scrollIntoView({ block: "nearest" });
}

/* ── the trace ────────────────────────────────────────────────────────── */
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const edgeEl = (id) => world.querySelector(`.edge[data-id="${id}"]`);
const nodeEl = (id) => world.querySelector(`.node[data-id="${id}"]`);
function clearMarks() {
  world.querySelectorAll(".on, .bad").forEach((e) => e.classList.remove("on", "bad"));
  pkt.classList.remove("show");
}
function travel(v, my) {
  return new Promise((res) => {
    const rev = v[0] === "-", g = edgeEl(rev ? v.slice(1) : v), ln = $(".ln", g), len = ln.getTotalLength();
    const dur = Math.max(240, len / 0.55), t0 = performance.now();
    const tick = (now) => {
      if (my !== runId) return res();
      const t = Math.min(1, (now - t0) / dur), p = ln.getPointAtLength(len * (rev ? 1 - t : t));
      pkt.style.transform = `translate(${p.x}px,${p.y}px)`;
      pkt.classList.add("show");
      if (t < 1) requestAnimationFrame(tick); else { g.classList.add("on"); res(); }
    };
    requestAnimationFrame(tick);
  });
}
function setStatus(i, t, bad) {
  const s = t.steps[i];
  statusEl.innerHTML = `<span class="n">${i + 1} / ${t.steps.length}</span><b>${DOC[s[0]].t}</b> ${s[2]}`;
  renderRoute(i, bad);
}
function arrive(i, t) {
  const s = t.steps[i], last = i === t.steps.length - 1, bad = last && !!t.bad;
  pkt.classList.remove("show");
  nodeEl(s[0]).classList.add(bad ? "bad" : "on");
  reveal(nodeEl(s[0]));
  for (const id of s[3] || []) (nodeEl(id) || edgeEl(id)).classList.add("on");
  if (bad) { world.querySelector(`.badge[data-id="${t.bad}"]`).classList.add("bad"); s[1].forEach((v) => edgeEl(v.replace("-", "")).classList.add("tone-bad")); }
  setStatus(i, t, bad);
}
function setPlaying(on) {
  playing = on;
  send.innerHTML = on ? `${ic("stop")}<span>Stop</span>` : `${ic("play")}<span>${sent ? "Send again" : "Send request"}</span>`;
}
async function play() {
  const my = ++runId, t = trace();
  resetTrace(false); sent = true; setPlaying(true);
  for (let i = 0; i < t.steps.length; i++) {
    if (!RM.matches) for (const v of t.steps[i][1]) { await travel(v, my); if (my !== runId) return; }
    else t.steps[i][1].forEach((v) => edgeEl(v.replace("-", "")).classList.add("on"));
    arrive(i, t);
    if (!RM.matches) { await wait(i === t.steps.length - 1 ? 0 : 620); if (my !== runId) return; }
  }
  setPlaying(false);
}
function resetTrace(bump = true) {
  if (bump) runId++;
  world.querySelectorAll(".edge.tone-bad").forEach((e) => { const d = scene().edges.find((x) => x.id === e.dataset.id); if (d.tone !== "bad") e.classList.remove("tone-bad"); });
  clearMarks(); renderRoute();
  if (bump) { sent = false; setPlaying(false); statusEl.textContent = "Pick an outcome, then send a request."; }
}

/* ── view: pan, zoom, fit ─────────────────────────────────────────────── */
function apply(ease) {
  world.classList.toggle("ease", !!ease);
  world.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.k})`;
  $("#zlabel").textContent = Math.round(view.k * 100) + "%";
}
function bounds() {
  const sc = scene(), all = [...sc.nodes, ...(sc.regs || []).filter((r) => r.h)];
  const x0 = Math.min(...all.map((n) => n.x)), y0 = Math.min(...all.map((n) => n.y));
  const x1 = Math.max(...all.map((n) => n.x + n.w)), y1 = Math.max(...all.map((n) => n.y + n.h));
  return { x: x0, y: Math.min(y0, 40), w: x1 - x0, h: Math.max(y1, ...sc.edges.flatMap((e) => e.p.map((p) => p[1]))) - Math.min(y0, 40) };
}
function fit(ease) {
  const W = canvas.clientWidth, H = canvas.clientHeight, b = bounds();
  const pad = { l: 24, r: 24, t: 64, b: 128 };
  // On a narrow canvas a whole-diagram fit is unreadable: hold a floor and start at the top-left instead.
  view.k = clamp(Math.min((W - pad.l - pad.r) / b.w, (H - pad.t - pad.b) / b.h), W < 640 ? 0.5 : 0.2, 1.4);
  view.x = pad.l + Math.max(0, W - pad.l - pad.r - b.w * view.k) / 2 - b.x * view.k;
  view.y = pad.t + Math.max(0, H - pad.t - pad.b - b.h * view.k) / 2 - b.y * view.k;
  userMoved = false; apply(ease);
}
function zoomAt(cx, cy, f, ease) {
  const k = clamp(view.k * f, 0.2, 2.5), r = k / view.k;
  view.x = cx - (cx - view.x) * r; view.y = cy - (cy - view.y) * r; view.k = k; userMoved = true; apply(ease);
}
const mid2 = () => [canvas.clientWidth / 2, canvas.clientHeight / 2];

const ptrs = new Map(); let drag = null, pinch = null, moved = false;
canvas.addEventListener("pointerdown", (e) => {
  if (e.target.closest(".hud") || e.button > 0) return;
  ptrs.set(e.pointerId, [e.clientX, e.clientY]); moved = false;
  if (ptrs.size === 1) drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y };
  else if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), k: view.k }; drag = null; }
});
canvas.addEventListener("pointermove", (e) => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (pinch && ptrs.size === 2) {
    const [a, b] = [...ptrs.values()], r = canvas.getBoundingClientRect();
    zoomAt((a[0] + b[0]) / 2 - r.left, (a[1] + b[1]) / 2 - r.top, clamp((pinch.k * Math.hypot(a[0] - b[0], a[1] - b[1])) / pinch.d, 0.2, 2.5) / view.k);
    moved = true; return;
  }
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!moved && Math.hypot(dx, dy) < 5) return;
  if (!moved) { moved = true; canvas.setPointerCapture(e.pointerId); canvas.classList.add("panning"); }
  view.x = drag.vx + dx; view.y = drag.vy + dy; userMoved = true; apply();
});
const endPtr = (e) => { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null; if (!ptrs.size) { drag = null; canvas.classList.remove("panning"); } };
canvas.addEventListener("pointerup", endPtr); canvas.addEventListener("pointercancel", endPtr);
canvas.addEventListener("click", (e) => { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
canvas.addEventListener("wheel", (e) => {
  if (e.target.closest(".hud")) return;
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  if (e.ctrlKey || e.metaKey) zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * 0.01));
  else { view.x -= e.deltaX; view.y -= e.deltaY; userMoved = true; apply(); }
}, { passive: false });
$("#zin").addEventListener("click", () => zoomAt(...mid2(), 1.25, true));
$("#zout").addEventListener("click", () => zoomAt(...mid2(), 0.8, true));
$("#zfit").addEventListener("click", () => fit(true));
new ResizeObserver(() => { if (!userMoved) fit(); }).observe(canvas);

/* ── selection, routing, keys ─────────────────────────────────────────── */
function writeHash() {
  const h = `#${st.scene}/${trace().id}${st.node ? "/" + st.node : ""}`;
  if (location.hash !== h) history.replaceState(null, "", h);
}
function select(id) { st.node = id; renderDetail(); writeHash(); }
function readHash() {
  const [s, t, n] = location.hash.slice(1).split("/");
  const next = SCENES[s] ? s : "lifecycle", changed = next !== st.scene;
  st.scene = next;
  st.trace = scene().traces.some((x) => x.id === t) ? t : scene().traces[0].id;
  st.node = scene().nodes.some((x) => x.id === n) ? n : null;
  render(); resetTrace(); renderDetail();
  if (changed || !userMoved) fit();
  writeHash();
}
world.addEventListener("click", (e) => { const n = e.target.closest(".node"); if (n) select(n.dataset.id === st.node ? null : n.dataset.id); });
// Pan a node into view when it is hidden by the canvas edge or the HUD.
function reveal(n) {
  const r = n.getBoundingClientRect(), c = canvas.getBoundingClientRect(), hud = $(".trace").offsetHeight + 24;
  if (r.left < c.left + 8 || r.right > c.right - 8 || r.top < c.top + 56 || r.bottom > c.bottom - hud) {
    view.x += c.left + c.width / 2 - (r.left + r.width / 2); view.y += c.top + (c.height - hud + 56) / 2 - (r.top + r.height / 2); userMoved = true; apply(true);
  }
}
world.addEventListener("focusin", (e) => { const n = e.target.closest(".node"); if (n && n.matches(":focus-visible")) reveal(n); });
detail.addEventListener("click", (e) => { if (e.target.closest("[data-clear]")) select(null); });
routeEl.addEventListener("click", (e) => { const b = e.target.closest("[data-node]"); if (b) select(b.dataset.node); });
seg.addEventListener("click", (e) => {
  const b = e.target.closest("[data-trace]"); if (!b) return;
  st.trace = b.dataset.trace;
  seg.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  setTone(); resetTrace(); if (!st.node) renderDetail(); writeHash();
});
send.addEventListener("click", () => (playing ? resetTrace() : play()));
addEventListener("hashchange", readHash);
addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  const inCanvas = e.target === document.body || canvas.contains(e.target);
  if (e.key === "Escape") { if (st.node) select(null); }
  else if (e.key === "+" || e.key === "=") zoomAt(...mid2(), 1.25, true);
  else if (e.key === "-") zoomAt(...mid2(), 0.8, true);
  else if (e.key === "0") fit(true);
  else if (inCanvas && e.key.startsWith("Arrow")) {
    const d = { ArrowLeft: [48, 0], ArrowRight: [-48, 0], ArrowUp: [0, 48], ArrowDown: [0, -48] }[e.key];
    view.x += d[0]; view.y += d[1]; userMoved = true; apply(true); e.preventDefault();
  }
});
$("#theme").addEventListener("click", () => {
  const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem("vg-lifecycle-theme", t); } catch (e) {}
});

readHash();
})();
</script>
</body>
</html>
