<meta name="color-scheme" content="light dark" />

<!-- Parser-blocking on purpose: the stored theme has to land before the first paint. -->
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem("gm-arch-theme"); } catch (e) {}
    if (t !== "light" && t !== "dark") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t;
    document.documentElement.dataset.js = "";
  })();
</script>
<style>
  /* Copperplate dark, porcelain light. */
  :root {
    --text-1: light-dark(#33302b, #ead9c0);
    --bg-app: light-dark(#efece8, color-mix(in oklab, #14100b 97.5%, var(--text-1)));
    --bg-terminal: light-dark(#fbf9f6, color-mix(in oklab, #1a150e 96%, var(--text-1)));
    --bg-raised: light-dark(#ffffff, color-mix(in oklab, #241d14 95.5%, var(--text-1)));
    --bg-inset: light-dark(#f4f1ec, color-mix(in oklab, #100c08 95.5%, var(--text-1)));
    --bg-hover: light-dark(#e9e5df, color-mix(in oklab, #2c2418 95%, var(--text-1)));
    --border-1: light-dark(#ddd8d0, color-mix(in oklab, #332917 91%, var(--text-1)));
    --border-2: light-dark(#c2bab0, color-mix(in oklab, #54432a 92.5%, var(--text-1)));
    --text-2: color-mix(in oklab, light-dark(#6b655c, #b59c7a) 78%, var(--text-1));
    --text-dim: color-mix(in oklab, light-dark(#a39c90, #77664c) 55%, var(--text-1));
    --green: light-dark(#3d8b3d, #a4c26f);
    --red: light-dark(#c53a3a, #e0705a);
    --yellow: light-dark(#a37414, #d8a24a);
    --orange: light-dark(#bb6a1e, #cf8236);
    --blue: light-dark(#3565c0, #8aa8bd);
    --cyan: light-dark(#175f68, #7fd6e4);
    --purple: light-dark(#6a4fc0, #b9a3e0);
    --accent: #78d670;
    --accent-fg: light-dark(color-mix(in oklab, var(--accent) 58%, var(--text-1)), var(--accent));
    --accent-fill: light-dark(color-mix(in oklab, var(--accent) 90%, var(--text-1)), var(--accent));
    --accent-soft: light-dark(color-mix(in oklab, var(--accent) 16%, var(--bg-terminal)), color-mix(in oklab, var(--accent) 22%, var(--bg-terminal)));
    --focus: var(--accent-fg);
    --sh-ring: light-dark(#33302b14, #ead9c014);
    --sh-a: light-dark(#33302b0a, #00000040);
    --sh-b: light-dark(#33302b0d, #00000047);
    --sh-hi: light-dark(#ffffff00, #ead9c00a);
    --shadow-surface: 0 0 0 1px var(--sh-ring), inset 0 1px 0 var(--sh-hi), 0 1px 1px var(--sh-a), 0 2px 2px -1px var(--sh-a), 0 4px 6px -3px var(--sh-b);
    --shadow-icon: 0 0 0 0.5px var(--sh-ring), 0 1px 1px -0.5px var(--sh-a), 0 2px 2px -1px var(--sh-a), 0 4px 4px -2px var(--sh-a), 0 8px 8px -4px var(--sh-b), 0 12px 12px -6px var(--sh-b);
    --pl-dot: color-mix(in oklab, var(--text-dim) 38%, transparent);
    --sans: "Suisse Intl", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --r-panel: 12px; --r-ctl: 6px; --r-code: 4px; --r-pill: 999px;
    --measure: 1140px;
    --ease: cubic-bezier(0.22, 0.68, 0.24, 1);
    color-scheme: light;
  }
  :root[data-theme="dark"] { color-scheme: dark; }

  * { box-sizing: border-box; }
  html, body, #root { height: 100%; margin: 0; }
  html { scroll-padding-top: 76px; }
  body {

  .app { height: 100%; display: flex; flex-direction: column; background: var(--bg-app); }
  .app.docs { height: auto; min-height: 100%; }

  /* ── nav ─────────────────────────────────────────────────────────────── */
  header.nav {
    position: sticky; top: 0; z-index: 40;
    background: color-mix(in oklab, var(--bg-app) 86%, transparent);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border-1);

  .app.docs header.nav { border-bottom-color: transparent; transition: border-color 0.2s; }

  .nav-inner { display: flex; align-items: center; gap: 14px; height: 60px; padding-inline: 24px; }
  .app.docs .nav-inner { max-width: calc(var(--measure) + 48px); margin-inline: auto; }
  .mark { display: inline-flex; align-items: center; gap: 10px; flex: none; color: var(--text-1); font-size: 15px; letter-spacing: -0.01em; text-decoration: none; cursor: pointer; background: none; border: 0; padding: 0; }
  .mark .glyph {
    display: grid; place-items: center; width: 28px; height: 28px; border-radius: 7px;
    background: var(--accent-soft); color: var(--accent-fg); box-shadow: var(--shadow-icon);
    font-family: var(--mono); font-size: 11.5px; font-weight: 600; transition: transform 0.2s var(--ease);
  }
  .mark img.glyph { object-fit: cover; }
  .mark:hover .glyph { transform: translateY(-1px); }
  .mark small { color: var(--text-dim); font-size: 13px; margin-left: 2px; }
  .nav-links { display: flex; align-items: center; gap: 2px; margin-left: 10px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .nav-links::-webkit-scrollbar { display: none; }
  .tab {
    flex: none; display: inline-flex; align-items: center; gap: 7px; padding: 5px 10px; border: 0;
    border-radius: var(--r-pill); background: transparent; color: var(--text-2); font-size: 14px;
    white-space: nowrap; cursor: pointer; transition: color 0.16s, background 0.16s;
  }
  .tab:hover { color: var(--text-1); background: var(--bg-hover); }
  .tab.on { color: var(--text-1); background: var(--bg-hover); }
  .num {
    width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center;
    font-family: var(--mono); font-size: 10px; color: var(--text-dim); box-shadow: inset 0 0 0 1px var(--border-2);
  }
  .tab.on .num { color: var(--accent-fg); box-shadow: inset 0 0 0 1px var(--accent-fg); }
  .nav-act { display: flex; align-items: center; gap: 6px; flex: none; margin-left: auto; position: relative; }
  .seg { display: inline-flex; padding: 3px; border-radius: var(--r-pill); background: var(--bg-inset); box-shadow: inset 0 0 0 1px var(--border-1); }
  .seg button {
    border: 0; background: transparent; color: var(--text-2); font-size: 13px; padding: 4px 12px;
    border-radius: var(--r-pill); cursor: pointer; transition: color 0.16s, background 0.16s, box-shadow 0.16s;
  }
  .seg button.on { color: var(--text-1); background: var(--bg-raised); box-shadow: var(--shadow-surface); }
  .navbtn, .legend-btn {
    position: relative; isolation: isolate; overflow: hidden;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 32px; padding: 0 14px;
    border: 0; border-radius: var(--r-pill); background: var(--bg-terminal); box-shadow: var(--shadow-surface);
    color: var(--text-1); font-size: 13.5px; white-space: nowrap; cursor: pointer; line-height: 1;
    transition: background 0.2s, color 0.2s, box-shadow 0.25s var(--ease);
  }
  .navbtn::after, .legend-btn::after {
    content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
    background: linear-gradient(105deg, transparent 25%, color-mix(in oklab, var(--halo, var(--accent)) 7%, transparent) 44%, rgb(255 255 255 / 0.06) 50%, color-mix(in oklab, var(--halo, var(--accent)) 7%, transparent) 56%, transparent 75%);
    transform: translateX(-110%); transition: transform 1.1s var(--ease);
  }
  .navbtn:hover, .legend-btn:hover {
    background: var(--bg-raised);
    box-shadow: var(--shadow-surface), 0 0 0 1px color-mix(in oklab, var(--halo, var(--accent)) 20%, transparent), 0 4px 14px -10px color-mix(in oklab, var(--halo, var(--accent)) 30%, transparent);
  }
  .navbtn:hover::after, .legend-btn:hover::after { transform: translateX(110%); }
  .legend-btn svg { width: 15px; height: 15px; display: block; flex: none; }
  .legend-btn.on { background: var(--accent-soft); color: var(--accent-fg); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--accent) 30%, transparent); }
  .legend-btn.layers { --halo: var(--blue); } .legend-btn.layers.on { color: var(--blue); background: color-mix(in oklab, var(--blue) 14%, var(--bg-terminal)); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--blue) 30%, transparent); }
  .legend-btn.decide { --halo: var(--accent); }
  .legend-btn.help { --halo: var(--orange); } .legend-btn.help.on { color: var(--orange); background: color-mix(in oklab, var(--orange) 14%, var(--bg-terminal)); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--orange) 30%, transparent); }
  .themebtn {
    display: inline-flex; align-items: center; justify-content: center; flex: none; width: 30px; height: 30px; padding: 0;
    border: 0; border-radius: var(--r-pill); background: none; color: var(--text-dim); cursor: pointer; transition: color 0.16s, background 0.16s;
  }
  .themebtn:hover { color: var(--text-1); background: var(--bg-hover); }
  .themebtn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .themebtn .moon { display: none; }
  .themebtn[data-to="dark"] .moon { display: block; }
  .themebtn[data-to="dark"] .sun { display: none; }
  .help-slot { position: relative; }
  .help-pop {
    position: absolute; top: calc(100% + 8px); right: 0; z-index: 8; width: 260px; text-align: left;
    background: var(--bg-raised); border-radius: var(--r-panel); box-shadow: var(--shadow-surface), 0 12px 32px -12px var(--sh-b); padding: 10px 12px;
  }
  .help-pop ul { margin: 0; padding: 0; list-style: none; }
  .help-pop li { margin: 0; padding: 3px 0; font-size: 12.5px; line-height: 1.45; color: var(--text-2); }

  .note { margin: 0; padding: 7px 24px; border-bottom: 1px solid var(--border-1); background: var(--bg-inset); color: var(--text-2); font-size: 12.5px; line-height: 1.45; }
  .note b { font-weight: 500; color: var(--text-1); }

  /* ── canvas ──────────────────────────────────────────────────────────── */
  .stage { flex: 1; min-height: 0; display: flex; background: var(--bg-app); }
  .canvas { flex: 1; min-width: 0; position: relative; }
  .canvas .react-flow { background: transparent; }
  .step {
    position: relative; width: 100%; height: 100%; display: flex; align-items: flex-start; gap: 12px; text-align: left;
    background: var(--bg-raised); border-radius: var(--r-panel);
    box-shadow: 0 0 0 1px var(--border-2), 0 1px 2px var(--sh-a), 0 6px 16px -8px var(--sh-b);
    padding: 10px 14px 10px 12px; cursor: grab; user-select: none; transition: box-shadow 0.2s var(--ease);
  }
  .step:hover { box-shadow: 0 0 0 1px var(--text-dim), 0 1px 2px var(--sh-a), 0 10px 24px -10px var(--sh-b); }
  .step:active { cursor: grabbing; }
  .step.is-start { box-shadow: var(--shadow-surface), 0 0 0 2px var(--green); }
  .step.is-end { box-shadow: var(--shadow-surface), 0 0 0 2px var(--blue); }
  .tag {
    position: absolute; top: -8px; right: 10px; background: var(--bg-raised); font-family: var(--mono);
    font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; line-height: 1; padding: 2px 6px; border-radius: var(--r-pill);
  }
  .is-start .tag { color: var(--green); box-shadow: inset 0 0 0 1px var(--green); }
  .is-end .tag { color: var(--blue); box-shadow: inset 0 0 0 1px var(--blue); }
  .step > span:last-child { min-width: 0; flex: 1; }
  .stepno {
    display: inline-grid; place-items: center; min-width: 16px; height: 16px; padding: 0 4px; margin-right: 5px;
    border-radius: var(--r-pill); background: var(--accent-soft); color: var(--accent-fg);
    font-family: var(--mono); font-size: 10px; font-weight: 700; vertical-align: 1px;
  }
  .step .name { font-size: 13.5px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.25; color: var(--text-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .step .sub { margin-top: 3px; color: var(--text-1); font-size: 11.75px; font-weight: 600; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .step .sub .pick { color: var(--accent-fg); font-weight: 700; }
  .step .sub .alt { color: var(--text-dim); margin-left: 6px; }
  .blurb { margin-top: 5px; color: color-mix(in oklab, var(--text-1) 85%, var(--text-2)); font-size: 11.25px; font-weight: 500; line-height: 1.4; white-space: normal; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; }
  .ico { width: 32px; height: 32px; border-radius: 8px; flex: none; display: grid; place-items: center; color: light-dark(#fff, #14100b); box-shadow: var(--shadow-icon); }
  .ico svg { width: 16px; height: 16px; display: block; }
  .tone-surface { background: var(--blue); }
  .tone-platform { background: var(--cyan); }
  .tone-store { background: var(--orange); }
  .tone-control { background: var(--purple); }
  .tone-engine { background: var(--green); }
  .tone-other { background: var(--red); }
  .ico.tech { background: light-dark(#ffffff, #f4efe6); color: var(--text-1); box-shadow: 0 0 0 1px var(--border-1), var(--shadow-icon); }
  .ico.tech img { width: 18px; height: 18px; display: block; }
  .ico.tech img.logo { border-radius: 4px; }
  .ico.mono { font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: -0.02em; color: #fff; }
  .who .ico.tech img, .layer .ico.tech img, .opt .ico.tech img, .decide-pop .ico.tech img { width: 14px; height: 14px; }
  .who .ico.mono, .opt .ico.mono, .decide-pop .ico.mono { font-size: 8.5px; }
  .react-flow__node-card { background: transparent; border: none; padding: 0; border-radius: var(--r-panel); box-shadow: none; }
  .step.is-key { animation: keyglow 2.4s ease-in-out infinite; }
  @keyframes keyglow {
    0%, 100% { box-shadow: var(--shadow-surface), 0 0 0 2px var(--orange), 0 0 14px 2px color-mix(in oklab, var(--orange) 45%, transparent); }
    50% { box-shadow: var(--shadow-surface), 0 0 0 3px var(--orange), 0 0 28px 8px color-mix(in oklab, var(--orange) 55%, transparent); }
  }
  .react-flow__node.selected .step:not(.is-key) { box-shadow: var(--shadow-surface), 0 0 0 2px var(--accent-fg); }
  .react-flow__node:focus { outline: none; }
  .react-flow__handle { opacity: 0; pointer-events: none; }
  .react-flow__edge-path { stroke: var(--text-dim); stroke-width: 1.75; }
  .react-flow__arrowhead polyline, .react-flow__arrowhead path { stroke: var(--text-dim); fill: var(--text-dim); }
  .react-flow__edge.later .react-flow__edge-path { stroke-dasharray: 6 5; }
  .react-flow__attribution { display: none; }
  .pill {
    position: absolute; pointer-events: none; background: var(--bg-raised); color: var(--text-1);
    box-shadow: 0 0 0 1px var(--border-2);
    font-family: var(--mono); font-size: 11px; padding: 2px 9px; border-radius: var(--r-pill); white-space: nowrap;
  }
  /* Edge kinds: the line and its label share one colour so a flow can be followed by eye. */
  .pill[data-kind] { color: var(--k); box-shadow: 0 0 0 1px color-mix(in oklab, var(--k) 60%, transparent); background: color-mix(in oklab, var(--k) 9%, var(--bg-raised)); font-weight: 600; }
  .k-auth { --k: var(--purple); } .k-api { --k: var(--blue); } .k-data { --k: var(--orange); } .k-flow { --k: var(--cyan); } .k-ai { --k: var(--green); }
  .pill.drag { pointer-events: auto; cursor: grab; user-select: none; touch-action: none; }
  .pill.drag:hover { box-shadow: 0 0 0 1.5px var(--k, var(--border-2)); }
  .pill.drag:active { cursor: grabbing; }
  .fixed {
    position: absolute; bottom: -8px; right: 10px; display: inline-flex; align-items: center; gap: 4px;
    background: var(--bg-raised); color: var(--yellow); box-shadow: inset 0 0 0 1px var(--yellow);
    font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.06em; text-transform: uppercase; line-height: 1; padding: 2px 6px; border-radius: var(--r-pill); white-space: nowrap;
  }
  .legend-pop h3 { margin: 14px 0 4px; font-family: var(--mono); font-size: 10.5px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-dim); }
  .lines { display: flex; flex-direction: column; gap: 4px; }
  .line { display: flex; align-items: center; gap: 10px; padding: 3px 2px; font-size: 12.5px; color: var(--text-2); }
  .line .sw { flex: none; width: 26px; height: 0; border-top: 2px solid var(--k); }
  .line .pill { position: static; font-size: 10px; padding: 1px 7px; }
  .line .fixed { position: static; flex: none; }
  .react-flow__node-band { pointer-events: none; }
  .band {
    width: 100%; height: 100%; border: 1.5px dashed color-mix(in oklab, var(--text-dim) 85%, transparent); border-radius: 22px; position: relative;
    background: color-mix(in oklab, var(--bg-terminal) 75%, transparent);
  }
  .band.alt { background: color-mix(in oklab, var(--bg-inset) 90%, transparent); }
  .band .bl {
    position: absolute; top: -12px; left: 22px; display: inline-flex; align-items: center; gap: 8px;
    padding: 4px 12px 4px 10px; border-radius: var(--r-pill); background: var(--bg-raised); box-shadow: 0 0 0 1px var(--text-dim), 0 1px 2px var(--sh-a);
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-1);
  }
  .band .bl { font-weight: 600; }
  .band .bl::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent-fill); }
  .band.alt .bl::before { background: var(--blue); }

  .zoombar {
    position: absolute; z-index: 5; left: 14px; bottom: 14px; display: flex; align-items: center; gap: 2px;
    background: var(--bg-raised); border-radius: var(--r-pill); padding: 4px; box-shadow: 0 0 0 1px var(--border-2), 0 6px 16px -8px var(--sh-b);
  }
  .zoombar button { width: 28px; height: 28px; border: 0; border-radius: var(--r-pill); background: transparent; color: var(--text-1); font-size: 16px; line-height: 1; cursor: pointer; display: grid; place-items: center; }
  .zoombar button:hover { background: var(--bg-hover); }
  .zoombar .pct { min-width: 48px; text-align: center; font-family: var(--mono); font-size: 12px; color: var(--text-2); }
  .zoombar .div { width: 1px; height: 16px; background: var(--border-1); margin: 0 2px; }

  /* ── rail ────────────────────────────────────────────────────────────── */
  .side { position: absolute; z-index: 6; top: 14px; right: 14px; width: min(660px, calc(100vw - 36px)); display: flex; flex-direction: column; gap: 10px; max-height: calc(100% - 72px); pointer-events: none; }
  .rail { width: 360px; background: var(--bg-terminal); border-radius: var(--r-panel); box-shadow: var(--shadow-surface), 0 16px 40px -16px var(--sh-b); overflow: auto; }
  .rail.float { pointer-events: auto; position: static; width: 100%; flex: 1; min-height: 0; max-height: none; }
  .legend-dock { position: absolute; z-index: 6; right: 14px; bottom: 14px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .legend-actions { display: flex; gap: 8px; }
  .legend-pop, .decide-pop {
    background: var(--bg-terminal); border-radius: var(--r-panel); box-shadow: var(--shadow-surface), 0 16px 40px -16px var(--sh-b); padding: 12px 14px 14px; overflow: auto;
  }
  .legend-pop { width: 300px; max-height: min(680px, calc(100vh - 220px)); }
  .decide-pop { width: min(560px, calc(100vw - 36px)); max-height: min(560px, calc(100vh - 220px)); }
  .legend-pop .top, .decide-pop .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .legend-pop h2, .decide-pop h2 { font-size: 15px; font-weight: 500; letter-spacing: -0.01em; }
  .rail-in { padding: 18px 20px 26px; }
  .rail h2 { margin: 10px 0 0; font-size: 22px; letter-spacing: -0.02em; line-height: 1.25; }
  .rail .lead { margin: 14px 0 0; font-size: 14px; line-height: 1.6; color: var(--text-2); }
  .rail h3 { margin: 22px 0 4px; font-size: 14px; font-weight: 600; color: var(--text-1); }
  .rail ul { margin: 0; padding: 0; list-style: none; }

/* Edges with a waypoint are routed by hand: source stub, an L or Z through the waypoint, target stub.
   Dragging a label sets the waypoint; double-click clears it and the edge goes back to the auto route. */
const EdgeCtx = createContext(null);
const DIR = { left: [-1, 0], right: [1, 0], top: [0, -1], bottom: [0, 1] };
const clamp = (v, a, b) => Math.min(Math.max(v, Math.min(a, b)), Math.max(a, b));
function cleanPoints(pts) {
  const out = [];
  for (const p of pts) { const l = out[out.length - 1]; if (!l || l.x !== p.x || l.y !== p.y) out.push(p); }
  for (let i = out.length - 2; i > 0; i--) {
    const a = out[i - 1], b = out[i], c = out[i + 1];
    if ((a.x === b.x && b.x === c.x) || (a.y === b.y && b.y === c.y)) out.splice(i, 1);
  }
  return out;
}
function roundedPath(pts, r) {
  let d = `M ${pts[0].x} ${pts[0].y}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const p = pts[i - 1], c = pts[i], q = pts[i + 1];
    const l1 = Math.hypot(c.x - p.x, c.y - p.y), l2 = Math.hypot(q.x - c.x, q.y - c.y);
    const rr = Math.min(r, l1 / 2, l2 / 2);
    const a = { x: c.x + ((p.x - c.x) / l1) * rr, y: c.y + ((p.y - c.y) / l1) * rr };
    const b = { x: c.x + ((q.x - c.x) / l2) * rr, y: c.y + ((q.y - c.y) / l2) * rr };
    d += ` L ${a.x} ${a.y} Q ${c.x} ${c.y} ${b.x} ${b.y}`;
  }
  const z = pts[pts.length - 1];
  return d + ` L ${z.x} ${z.y}`;
}
function bentPath(sx, sy, sPos, tx, ty, tPos, wp) {
  const gap = 20;
  const [sdx, sdy] = DIR[sPos], [tdx, tdy] = DIR[tPos];
  const s1 = { x: sx + sdx * gap, y: sy + sdy * gap };
  const t1 = { x: tx + tdx * gap, y: ty + tdy * gap };
  let mid, lx, ly;
  if (sdx !== 0) {
    const mx = s1.y === t1.y ? clamp(wp.x, s1.x, t1.x) : wp.x;
    mid = [{ x: mx, y: s1.y }, { x: mx, y: t1.y }]; lx = mx; ly = clamp(wp.y, s1.y, t1.y);
  } else {
    const my = s1.x === t1.x ? clamp(wp.y, s1.y, t1.y) : wp.y;
    mid = [{ x: s1.x, y: my }, { x: t1.x, y: my }]; ly = my; lx = clamp(wp.x, s1.x, t1.x);
  }
  const pts = cleanPoints([{ x: sx, y: sy }, s1, ...mid, t1, { x: tx, y: ty }]);
  return [roundedPath(pts, 12), lx, ly];
}

function PillEdge({ id, sourceX, sourceY, targetX, targetY, sourcePosition, targetPosition, label, markerEnd, data }) {
  const ctx = useContext(EdgeCtx);
  const { screenToFlowPosition } = useReactFlow();
  const wp = data && data.wp;
  const [path, labelX, labelY] = wp
    ? bentPath(sourceX, sourceY, sourcePosition, targetX, targetY, targetPosition, wp)
    : getSmoothStepPath({ sourceX, sourceY, targetX, targetY, sourcePosition, targetPosition, borderRadius: 12 });
  const kind = data && data.kind;
  const stroke = KIND_COLOR[kind] || "#c8ccd4";
  function onPointerDown(e) {
    if (!ctx || e.button !== 0) return;
    e.preventDefault(); e.stopPropagation();
    const start = screenToFlowPosition({ x: e.clientX, y: e.clientY });
    const origin = { x: labelX, y: labelY };
    const move = (ev) => {
      const p = screenToFlowPosition({ x: ev.clientX, y: ev.clientY });
      ctx.move(id, { x: Math.round(origin.x + p.x - start.x), y: Math.round(origin.y + p.y - start.y) });
    };
    const up = () => { window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
  }
  return html`<${Fragment}>
    <${BaseEdge} id=${id} path=${path} markerEnd=${markerEnd} style=${{ stroke, strokeWidth: kind ? 1.75 : 1.5 }} />
    ${label ? html`<${EdgeLabelRenderer}>
      <div class=${"pill nodrag nopan" + (kind ? " k-" + kind : "") + (ctx ? " drag" : "")} data-kind=${kind || null}
        title=${ctx ? "Drag to bend the line; double-click to reset" : null}
        onPointerDown=${onPointerDown} onDoubleClick=${() => ctx && ctx.move(id, null)}
        style=${{ transform: `translate(-50%, -50%) translate(${labelX}px, ${labelY}px)` }}>${label}</div>
    <//>` : null}
  <//>`;
}

function Band({ data }) {
  return html`<div class=${"band" + (data.alt ? " alt" : "")}><span class="bl">${data.label}</span></div>`;
}

function node(id, col, row, data) {
  return {

function edge(id, source, target, from, to, label, later, kind, wp) {

}

const STORE_KEY = "gm-arch-picks-v1"; /* only non-default picks are stored, so a changed default shows up */

function defaultPicks() {
  const out = {};
  for (const [sid, s] of Object.entries(scenes)) {
    for (const n of s.nodes) {
      if (n.data.options && n.data.options.length) {
        const rec = n.data.options.find((o) => o.rec) || n.data.options[0];
        out[sid + ":" + n.id] = rec.id;
      }
    }
  }
  return out;
}
function loadPicks() {
  const base = defaultPicks();
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return base;
    const saved = JSON.parse(raw);
    for (const k of Object.keys(base)) if (typeof saved[k] === "string") base[k] = saved[k];
  } catch (e) { /* ignore */ }
  return base;
}
const WP_KEY = "gm-arch-waypoints-v1";
function loadWps() {
  try { const raw = localStorage.getItem(WP_KEY); return raw ? JSON.parse(raw) : {}; } catch (e) { return {}; }
}
function saveWps(w) {
  try { localStorage.setItem(WP_KEY, JSON.stringify(w)); } catch (e) { /* ignore */ }
}
function savePicks(p) {
  const base = defaultPicks();
  const diff = {};
  for (const [k, v] of Object.entries(p)) if (v !== base[k]) diff[k] = v;
  try { localStorage.setItem(STORE_KEY, JSON.stringify(diff)); } catch (e) { /* ignore */ }
}

function bandNodes(scene) {
  const maxX = Math.max(...scene.nodes.map((n) => n.position.x + CARD_W));
  return (scene.bands || []).map(([row, label], i) => ({
    id: "band-" + row, type: "band",
    position: { x: -72, y: ROW0 + row * GAP - BAND_PAD },
    data: { label, alt: i % 2 === 1 },
    style: { width: maxX + 72 + 56, height: CARD_H + BAND_PAD * 2 },
    zIndex: -1, draggable: false, selectable: false, focusable: false,
  }));
}
function sceneNodes(scene) {
  return [...bandNodes(scene), ...scene.nodes.map((n) => ({
    ...n,
    position: { ...n.position },
    data: { ...n.data },
    style: { ...n.style },
    draggable: true,
  }))];
}


function decisionsMarkdown(picks) {
  const lines = ["# Architecture decisions", ""];
  for (const [sid, s] of Object.entries(scenes)) {
    lines.push("## " + s.label, "");
    lines.push("| Node | Pick | Note |", "|---|---|---|");
    for (const n of s.nodes) {
      const opts = n.data.options || [];
      if (!opts.length) continue;
      const pick = pickOf(n.data, picks[sid + ":" + n.id]);
      const rec = opts.find((o) => o.rec);
      const note = pick.rec ? "recommended" : rec ? "instead of " + rec.name : "";
      lines.push(`| ${n.data.title} | ${pick.name} | ${note} |`);
    }
    lines.push("");
  }
  return lines.join("\n");
}

  const d = h.match(/^docs\/([A-Z_]+)(?:\/(.+))?$/);
  if (d && DOCS.some((x) => x.id === d[1])) return { view: "docs", docId: d[1], anchor: d[2] || null, sceneId: "sys" };
  return { view: "diagram", sceneId: Object.hasOwn(scenes, h) ? h : "sys", docId: "SYSTEM_DESIGN", anchor: null };
}

  if (location.hash.slice(1) !== h) history.replaceState(null, "", "#" + h);
}

function FrameScene({ sceneId, focusId }) {
  const { setViewport, getNodes } = useReactFlow();
  const first = useRef(true);
  function fit(centerId) {
    const nodes = getNodes();
    if (!nodes.length) return;
    const minX = Math.min(...nodes.map((n) => n.position.x));
    const maxX = Math.max(...nodes.map((n) => n.position.x + (n.measured?.width || n.width || CARD_W)));
    const minY = Math.min(...nodes.map((n) => n.position.y));
    const maxY = Math.max(...nodes.map((n) => n.position.y + (n.measured?.height || n.height || CARD_H)));
    const el = document.querySelector(".canvas");
    const w = el?.clientWidth || 900;
    const h = el?.clientHeight || 700;
    const graphW = Math.max(1, maxX - minX);
    const graphH = Math.max(1, maxY - minY);
    const zoom = Math.min(1, (w - 72) / graphW, (h - 56) / graphH);
    const mid = (minX + maxX) / 2;
    let y = h / 2 - ((minY + maxY) / 2) * zoom;
    if (centerId) {
      const n = nodes.find((node) => node.id === centerId);
      if (n) y = h / 2 - (n.position.y + CARD_H / 2) * zoom;
    }
    const duration = first.current ? 0 : 240;
    first.current = false;
    setViewport({ x: w / 2 - mid * zoom, y, zoom }, { duration });
  }
  useEffect(() => {
    const t = setTimeout(() => fit(focusId), 30);
    return () => clearTimeout(t);
  }, [sceneId]);
  return null;
}

function embeddedDoc(id) {
  const el = document.querySelector('script[type="text/markdown"][data-doc="' + id + '"]');
  return el ? el.textContent.replace(/^\n/, "") : null;
}
async function loadDoc(id) {
  // The documents are embedded at the end of this file as text/markdown scripts.
  const t = embeddedDoc(id);
  if (t != null) return { text: t, source: "embedded" };
  return { text: "# " + id + "\n\nThis document is not embedded in the page.", source: "missing" };
}
function slugify(t) { return t.toLowerCase().replace(/`/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 80); }
function wireCopy(btn, text) {
  btn.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(text()); btn.classList.add("done"); setTimeout(() => btn.classList.remove("done"), 1400); }
    catch (e) { window.prompt("Copy:", text()); }
  });
}

function DocsView({ docId, anchor, onAnchor, onOpen, onDiagram }) {
  const meta = DOCS.find((d) => d.id === docId) || DOCS[0];
  const [doc, setDoc] = useState({ loading: true, html: "", raw: "", title: meta.label, source: null });
  const [toc, setToc] = useState([]);
  const [active, setActive] = useState(null);
  const ref = useRef(null);

  useEffect(() => {
    let live = true;
    setDoc((d) => ({ ...d, loading: true }));
    loadDoc(docId).then(({ text, source }) => {
      if (!live) return;
      const title = (text.match(/^# (.*)$/m) || [])[1] || meta.label;
      const body = text.replace(/^# .*\n/, "");
      setDoc({ loading: false, html: marked.parse(body, { gfm: true, breaks: false }), raw: text, title, source });
    });
    return () => { live = false; };
  }, [docId]);

  useEffect(() => {
    const root = ref.current;
    if (!root || doc.loading) return;
    const used = new Set();
    const items = [];
    for (const h of root.querySelectorAll("h2, h3, h4")) {
      let id = slugify(h.textContent) || "section";
      while (used.has(id)) id += "-";
      used.add(id);
      h.id = id;
      const a = document.createElement("a");
      a.className = "anchor"; a.href = "#docs/" + docId + "/" + id; a.textContent = "#"; a.setAttribute("aria-label", "Link to this section");
      a.addEventListener("click", (e) => { e.preventDefault(); onAnchor(id); h.scrollIntoView({ behavior: "smooth", block: "start" }); });
      h.appendChild(a);
      if (h.tagName !== "H4") items.push({ level: h.tagName, id, text: h.textContent.replace(/#$/, "").trim() });
    }
    for (const t of root.querySelectorAll("table")) {
      if (t.parentElement.classList.contains("tablewrap")) continue;
      const w = document.createElement("div"); w.className = "tablewrap"; t.replaceWith(w); w.appendChild(t);
    }
    for (const pre of root.querySelectorAll("pre")) {
      if (pre.parentElement.classList.contains("codeblock")) continue;
      const code = pre.querySelector("code");
      const lang = ((code && code.className.match(/language-(\S+)/)) || [])[1] || "text";
      const fig = document.createElement("figure"); fig.className = "codeblock";
      const cap = document.createElement("figcaption");
      const l = document.createElement("span"); l.className = "lang"; l.textContent = lang; cap.appendChild(l);
      const btn = document.createElement("button"); btn.type = "button"; btn.className = "copybtn"; btn.innerHTML = COPY_SVG + '<span class="lbl">copied</span>';
      wireCopy(btn, () => (code || pre).textContent); cap.appendChild(btn);
      pre.replaceWith(fig); fig.appendChild(cap); fig.appendChild(pre);
    }
    for (const a of root.querySelectorAll("a[href]")) {
      const href = a.getAttribute("href");
      const m = href.match(/^\.?\/?([A-Z_]+)\.md(?:#(.*))?$/);
      if (m && DOCS.some((d) => d.id === m[1])) {
        a.addEventListener("click", (e) => { e.preventDefault(); onOpen(m[1], m[2] || null); });
      } else if (/^https?:/.test(href)) { a.target = "_blank"; a.rel = "noopener"; }
    }
    setToc(items);
    if (anchor) {
      const el = document.getElementById(anchor);
      if (el) requestAnimationFrame(() => el.scrollIntoView({ block: "start" }));
    } else {
      window.scrollTo(0, 0);
    }
  }, [doc.html]);

  useEffect(() => {
    if (!toc.length) return;
    const onScroll = () => {
      let cur = null;
      for (const it of toc) {
        const el = document.getElementById(it.id);
        if (el && el.getBoundingClientRect().top <= 96) cur = it.id; else break;
      }
      setActive(cur);
    };
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, [toc]);

  const groups = [];
  for (const it of toc) {
    if (it.level === "H2" || !groups.length) groups.push({ head: it.level === "H2" ? it : null, kids: it.level === "H2" ? [] : [it] });
    else groups[groups.length - 1].kids.push(it);
  }
  const jumpTo = (id) => (e) => { e.preventDefault(); onAnchor(id); const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); };

  return html`<main class="main">
    <div class="ref-head">

      <h1>${doc.title}</h1>
      <p class="lede">${meta.lede}</p>

        </li>`)}</ol>
      </nav>
      <article class="md" ref=${ref} aria-busy=${doc.loading}

    </div>
    <footer class="foot">

    </footer>
  </main>`;
}

<script type="text/markdown" data-doc="SYSTEM_DESIGN">
# System design: Gimorra, an agent run you can check

Status: sample content. Names, numbers and commands are illustrative.

## 1. What it is

Gimorra is a command-line tool that points an AI agent at a target and comes back with findings that were proven, not asserted. You give it a target, a scope and a budget. It gives back one folder.

The design answers one question: how do you let a model do open-ended work against a real system and still trust what it reports? The answer used here is to let the agent propose and let code decide.

## 2. Principles

1. **The agent proposes. Checks with no AI in them decide.** Three controls sit outside the model's reach: the boundary list, the verifier and the rollback ledger.
2. **Only confirmed is stored.** A candidate the verifier cannot reproduce never becomes a result.
3. **A run cannot close dirty.** Every write is ledgered and undone at teardown.
4. **One run, one folder.** Everything a run writes is in one place and readable with standard tools.
5. **Replayed, not asserted.** Evidence is checked by recomputing it.

## 3. Components

| Component | Layer | Job |
|---|---|---|
| CLI | Operator | Starts, stops and reads runs. The only entry point. |
| Live console | Operator | A read view over a running folder. |
| Boundary list | Control | The scope compiled to allow and deny rules. Deny wins. |
| Autonomy and budget gate | Control | Decides whether a step may run. Re-read on every step. |
| Planner | Orchestration | Splits one goal into jobs for specialist workers. |
| Worker queue | Orchestration | One durable row per job, with an acknowledgement. |
| Model gateway | Model | One metered door to the model. Holds the key. |
| Specialist workers | Execution | Narrow model loops, each with its own workdir and tools. |
| Verifier | Control | Re-runs each candidate and returns one of three verdicts. |
| Rollback ledger | Control | Records every change and undoes it at teardown. |
| Run folder | Evidence | Manifest, coverage, results, evidence and transcripts. |

The diagram view shows the same components with the alternatives considered for each.

## 4. One run

1. **Goal and scope.** One command names the target, the scope, the autonomy level and the budget.
2. **Compile the bounds.** The scope becomes allow and deny rules. An ambiguous scope stops the run here.
3. **Plan.** The planner writes jobs: a worker kind, a slice of the surface, a share of the budget.
4. **Dispatch.** Each job is a queue row. The worker that claims it acknowledges on the same row.
5. **Work.** The worker loops. Before each tool call the gate is re-read and any host is checked.
6. **Candidate.** The worker hands back a claim with the request that produced it.
7. **Verify.** A check with no AI in it replays the request and returns a verdict.
8. **Record.** A confirmed result is written with its evidence and added to the hash chain.
9. **Teardown.** The ledger is unwound newest first, then the manifest is sealed.
10. **Report.** The folder is closed. Findings are listed, rendered, or proven again later.

```text
$ gimorra scan -t https://app.sample.test
▸ surface   app.sample.test, *.sample.test
▸ autonomy  supervised, asks before writes
▸ budget    $8.00, 45m
run 7f3a21c
...
18m 42s · 5 confirmed · $3.71 est.
ledger closed clean
```

## 5. Controls

### 5.1 Boundary list

Compiled before a request moves and checked on every step that names a host, before autonomy gets a say. Deny wins and ambiguity blocks. An out-of-bounds host is recorded on the coverage table and never contacted.

### 5.2 Verifier

A candidate is re-run host-side by the least invasive check that can settle it, and the bytes are kept. The verdict is `confirmed`, `rejected` or `inconclusive`. Nothing certifies itself: the worker that found a candidate has no say in its verdict.

### 5.3 Rollback ledger

Every write goes into the ledger first, with the step that undoes it. Teardown unwinds the ledger, and so does `run stop`. A run that cannot unwind cleanly is marked `held` and names the entry that is stuck.

> The gate is re-read, not snapshotted. A stop or an expiry reaches a job that is already running on its next step.

## 6. Evidence

A run comes back as one folder you can read, diff and replay.

- **Coverage table.** One table, every pass unioned onto it.
- **Result document.** A pair: a redacted copy the chain hashes, and a raw twin kept unhashed. Purging the twin cannot break the chain.
- **Evidence chain.** Each result hashes the one before it, and the manifest holds the head.
- **Import.** The chain is recomputed against the manifest. What lands is closed: a reading surface, never a launching pad.

The folder layout and the commands are in [Operations](./OPERATIONS.md#run-folder). The reasons behind each choice are in [Decisions](./DECISIONS.md).

## 7. What it does not do

- It does not store a result the verifier could not reproduce.
- It does not contact a host outside the boundary list, including through a redirect.
- It does not leave changes on the target after a run closes.
- It does not start new work from an imported run.

# Operations

## Commands

| Command | What it does |
|---|---|
| `gimorra doctor` | Checks the install. |
| `gimorra scan -t <target>` | Tests a live target: a URL, host, domain, IP or CIDR. |
| `gimorra audit <path>` | Audits source: a repo or a shipped bundle. |
| `gimorra run stop` | Halts new work, then unwinds the ledger. |
| `gimorra findings` | Lists confirmed findings. |
| `gimorra findings reprove <id>` | Runs the stored check for one finding again. |
| `gimorra findings report` | Renders the report from the run folder. |
| `gimorra eng scope-check` | Compiles a scope and prints the boundary list. |

## Run states

| State | Meaning |
|---|---|
| `running` | Work is being dispatched or is in flight. |
| `done` | The queue is empty and the ledger closed clean. |
| `held` | The run stopped but an undo is stuck. The entry is named. |
| `failed` | The run ended on an error. Confirmed results are kept. |

## Verdicts

| Verdict | Stored | Meaning |
|---|---|---|
| `confirmed` | yes | The check reproduced the candidate. |
| `rejected` | no | The check ran and the candidate did not hold. |
| `inconclusive` | no | The check could not settle it. It is listed for a person to look at. |

## Stopping a run

A run ends early for one of three reasons, and all three take the same path.

1. The operator runs `gimorra run stop`, or presses `k` in the console.
2. The budget or the clock runs out.
3. A process dies. The run resumes from its queue rows on the next start.

In each case the gate refuses new work, running jobs see the change on their next step, and teardown unwinds the ledger.

## Run folder

```text
runs/7f3a21c/
  manifest.json      run id, scope, bounds, counts, chain head
  coverage.tsv       every host, route and parameter seen
  results/           one redacted document per confirmed result
  evidence/          request, response and verdict per result
  transcript/        one append-only file per worker
```

`ls` answers what a run wrote. `rm -rf` removes it. A tarball of the folder is the whole run.

## Console keys

| Key | Action |
|---|---|
| `q` | Quit the console. The run keeps going. |
| `p` | Pause dispatch. |
| `k` | Stop the run. |
| `↑` `↓` | Scroll the transcript. |

<script type="text/markdown" data-doc="DECISIONS">
# Decisions

Sample content. Each record gives the context, the decision and what it costs.

## 1. Verify by deterministic replay

**Context.** A model that reports its own findings will sometimes report things that are not there.

**Decision.** Every candidate is re-run by code the model cannot reach. Only `confirmed` is stored.

**Cost.** A check has to exist for each class of result. A class with no check yields `inconclusive`, not a finding.

## 2. Compile the scope before the run

**Context.** An instruction in a prompt is a suggestion. One bad turn can leave the scope.

**Decision.** The scope is compiled into allow and deny rules and checked in code on every step. Deny wins.

**Cost.** The scope has to be written down up front, and wildcards need care.

## 3. Ledger and undo, not snapshots

**Context.** Most targets cannot be snapshotted, and restoring one would wipe other people's work.

**Decision.** Each write is recorded with its inverse and undone at teardown.

**Cost.** Every tool that writes needs an undo. A change with no clean inverse is refused.

## 4. The queue lives in the run folder

**Context.** A run should be one thing you can copy, archive or delete.

**Decision.** Jobs are durable rows in a file inside the run folder.

**Cost.** One host per run. A fleet needs a shared queue instead.

## 5. Results are pairs

**Context.** Evidence often contains the sensitive data it proves access to.

**Decision.** Each result is a redacted copy that is hashed and a raw twin that is not.

**Cost.** Two files per result, and redaction rules to maintain.
