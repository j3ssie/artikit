<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gimorra · Console · Copperplate (sample)</title>
<meta name="description" content="Gimorra console sample in the Copperplate theme: dashboard plates, engagements, findings with proofs, targets, a new-scan form and settings, all on sample data." />
<meta name="color-scheme" content="dark light" />
<link rel="icon" href="../assets/gimorra-logo.png" />
<script>(function(){try{var t=localStorage.getItem('gl-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<!--
  Gimorra · Console · Copperplate: the Gimorra · Console dashboard (same sample data, same routes) redrawn in the theme of
  the Gimorra · Copperplate landing page. Tokens are in :root and resolve through light-dark(), so the used color-scheme
  of :root is the only switch (data-theme="light" | "dark", stored as gl-theme like the landing page).
  Every chart is a "plate": a flat SVG on a dot-matrix ground painted by the pl-* classes, drawn by one
  card(id, options, draw) definition and placed with <article data-card="id">.
  Chart colours: severity --sev-*, verdict --vd-*, job status --js-*.
  Blocks: header.nav (mark, .tabs, actions, GitHub) · .phead (eyebrow, h1, .scope) · .kpis of .kpi · .grid of .card
          .card = .ch (title, form, table switch) + .fig (the plate) + .tv (its table) + .lg (legend pills) + .cap
          .sheet (a card holding .bar + .tbl table + .tfoot) · .rail (finding drawer) · .tip · .toast
-->
<style>
:root{
  --text-1: light-dark(#33302b, #ead9c0);
  --bg-app: light-dark(#efece8, color-mix(in oklab, #14100b 97.5%, var(--text-1)));
  --bg-terminal: light-dark(#fbf9f6, color-mix(in oklab, #1a150e 96%, var(--text-1)));
  --bg-raised: light-dark(#ffffff, color-mix(in oklab, #241d14 95.5%, var(--text-1)));
  --bg-inset: light-dark(#f4f1ec, color-mix(in oklab, #100c08 95.5%, var(--text-1)));
  --bg-hover: light-dark(#e9e5df, color-mix(in oklab, #2c2418 95%, var(--text-1)));
  --border-1: light-dark(#ddd8d0, color-mix(in oklab, #332917 91%, var(--text-1)));
  --border-2: light-dark(#c2bab0, color-mix(in oklab, #54432a 92.5%, var(--text-1)));
  --text-2: color-mix(in oklab, light-dark(#6b655c, #b59c7a) 78%, var(--text-1));
  --text-dim: color-mix(in oklab, light-dark(#a39c90, #77664c) 55%, var(--text-1));
  --green: light-dark(#3d8b3d, #a4c26f);
  --red: light-dark(#c53a3a, #e0705a);
  --yellow: light-dark(#a37414, #d8a24a);
  --orange: light-dark(#bb6a1e, #cf8236);
  --blue: light-dark(#3565c0, #8aa8bd);
  --green-ink: light-dark(color-mix(in oklab, var(--green) 74%, var(--text-1)), var(--green));
  --red-ink: light-dark(color-mix(in oklab, var(--red) 84%, var(--text-1)), color-mix(in oklab, var(--red) 86%, var(--text-1)));
  --yellow-ink: light-dark(color-mix(in oklab, var(--yellow) 72%, var(--text-1)), var(--yellow));
  --orange-ink: light-dark(color-mix(in oklab, var(--orange) 72%, var(--text-1)), var(--orange));
  --blue-ink: light-dark(color-mix(in oklab, var(--blue) 80%, var(--text-1)), var(--blue));
  --accent: #78d670;
  --accent-fg: light-dark(color-mix(in oklab, var(--accent) 40%, var(--text-1)), var(--accent));
  --accent-fill: light-dark(color-mix(in oklab, var(--accent) 90%, var(--text-1)), var(--accent));
  --accent-soft: light-dark(color-mix(in oklab, var(--accent) 16%, var(--bg-terminal)), color-mix(in oklab, var(--accent) 22%, var(--bg-terminal)));
  --focus: var(--accent-fg);
  /* chart colours */
  --sev-critical: var(--red);
  --sev-high: color-mix(in oklab, var(--red) 58%, var(--orange));
  --sev-medium: var(--orange);
  --sev-low: color-mix(in oklab, var(--orange) 46%, var(--bg-raised));
  --sev-info: color-mix(in oklab, var(--text-dim) 80%, var(--bg-raised));
  --neutral: color-mix(in oklab, var(--text-dim) 55%, var(--bg-raised));
  --vd-ok: light-dark(#4f9120, #a4c26f);
  --vd-no: light-dark(#af3646, #da6862);
  --vd-maybe: light-dark(#a37414, #d8a24a);
  --vd-hold: light-dark(#bc6712, #ca8038);
  --js-live: var(--accent-fill);
  --js-wait: light-dark(#3766c0, #529ccb);
  --sh-ring: light-dark(#33302b14, #ead9c014);
  --sh-a: light-dark(#33302b0a, #00000040);
  --sh-b: light-dark(#33302b0d, #00000047);
  --sh-hi: light-dark(#ffffff00, #ead9c00a);
  --shadow-surface: 0 0 0 1px var(--sh-ring), inset 0 1px 0 var(--sh-hi), 0 1px 1px var(--sh-a), 0 2px 2px -1px var(--sh-a), 0 4px 6px -3px var(--sh-b);
  --shadow-icon: 0 0 0 0.5px var(--sh-ring), 0 1px 1px -0.5px var(--sh-a), 0 2px 2px -1px var(--sh-a), 0 4px 4px -2px var(--sh-a), 0 8px 8px -4px var(--sh-b), 0 12px 12px -6px var(--sh-b);
  --shadow-float: var(--shadow-surface), 0 24px 60px -20px light-dark(#33302b33, #000000aa);
  /* plate paint */
  --pl-dot-lit: var(--accent-fill);
  --pl-dot-plate: color-mix(in oklab, var(--text-dim) 26%, transparent);
  --pl-dot-plate-hi: color-mix(in oklab, var(--text-dim) 40%, transparent);
  --pl-dot-grid: color-mix(in oklab, var(--text-dim) 78%, transparent);
  --pl-tick: color-mix(in oklab, var(--border-2) 60%, var(--bg-terminal));
  --pl-faint: color-mix(in oklab, var(--text-dim) 62%, var(--bg-terminal));
  --sans: "Suisse Intl", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --r-panel: 12px;
  --r-ctl: 6px;
  --r-pill: 999px;
  --measure: 1180px;
  --gutter: 24px;
  --band: 64px;
  --pad-card: 18px 20px 16px;
  --cell: 11px;
  --ease: cubic-bezier(0.22, 0.68, 0.24, 1);
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  /* liquid glass: a translucent fill that blurs what is behind it, a bright rim along the top edge, a darker one along the bottom,
     a hairline ring, a soft drop, and a glint that follows the pointer (--mx, --my, set in the script) */
  --glass: light-dark(rgb(255 255 255 / 0.55), rgb(255 255 255 / 0.055));
  --glass-hover: light-dark(rgb(255 255 255 / 0.82), rgb(255 255 255 / 0.1));
  --glass-lens: light-dark(rgb(255 255 255 / 0.92), rgb(255 255 255 / 0.13));
  --glass-hi: light-dark(rgb(255 255 255 / 0.95), rgb(255 255 255 / 0.2));
  --glass-lo: light-dark(rgb(51 48 43 / 0.07), rgb(0 0 0 / 0.32));
  --glass-ring: light-dark(rgb(51 48 43 / 0.1), rgb(255 255 255 / 0.08));
  --glass-drop: light-dark(rgb(51 48 43 / 0.12), rgb(0 0 0 / 0.42));
  --glass-glint: light-dark(rgb(255 255 255 / 0.95), rgb(255 255 255 / 0.17));
  --glass-blur: blur(14px) saturate(170%);
  --shadow-glass: inset 0 1px 0 var(--glass-hi), inset 0 -1px 0 var(--glass-lo), 0 0 0 1px var(--glass-ring), 0 1px 2px var(--glass-drop), 0 6px 16px -8px var(--glass-drop);
  --shadow-lens: inset 0 1px 0 var(--glass-hi), inset 0 -1px 0 var(--glass-lo), 0 0 0 1px var(--glass-ring), 0 1px 3px -1px var(--glass-drop);
  color-scheme: light dark;
}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:76px}
body{margin:0;background:var(--bg-app);color:var(--text-1);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:color-mix(in oklab, var(--accent) 38%, transparent)}
a{color:var(--text-1);text-decoration:underline;text-decoration-color:var(--border-2);text-underline-offset:3px;transition:text-decoration-color 0.16s}
a:hover{text-decoration-color:currentColor}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:var(--r-ctl)}
h1,h2,h3{font-weight:400;margin:0;color:var(--text-1)}
p{margin:0}
b,strong{font-weight:500;color:var(--text-1)}
code{font-family:var(--mono);font-size:0.875em;padding:0.09em 0.35em;border-radius:4px;background:var(--bg-hover);color:var(--text-1)}
svg.i{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* ---------- nav ---------- */
.main,.nav-inner,.foot{max-width:calc(var(--measure) + 2 * var(--gutter));margin-inline:auto;padding-inline:var(--gutter)}
header.nav{position:sticky;top:0;z-index:40;background:color-mix(in oklab, var(--bg-app) 86%, transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color 0.2s}
header.nav.stuck{border-bottom-color:var(--border-1)}
.nav-inner{display:flex;align-items:center;gap:14px;min-height:calc(36px + 24px * var(--tw-d, 1))} /* 60px, shorter as the dock's density tightens */
.mark{display:inline-flex;align-items:center;gap:10px;flex:none;color:var(--text-1);font-size:15px;letter-spacing:-0.01em;text-decoration:none}
.mark .glyph{display:block;width:28px;height:28px;border-radius:7px;box-shadow:var(--shadow-icon);transition:transform 0.2s var(--ease)}
.mark:hover .glyph{transform:translateY(-1px)}
.ver{flex:none;padding:2px 9px;border-radius:var(--r-pill);background:var(--accent-soft);box-shadow:inset 0 0 0 1px color-mix(in oklab, var(--accent) 30%, transparent);color:var(--accent-fg);font-family:var(--mono);font-size:11.5px;white-space:nowrap}
/* the segmented pill: primary tabs, engagement tabs and every small switch on the page */
.seg{display:inline-flex;align-items:center;gap:2px;min-width:0;max-width:100%;padding:3px;border-radius:var(--r-pill);background:var(--glass);box-shadow:var(--shadow-glass);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg>a,.seg>button{all:unset;box-sizing:border-box;cursor:pointer;flex:none;display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 12px;border-radius:var(--r-pill);font-size:13.5px;color:var(--text-2);white-space:nowrap;transition:color 0.2s,background 0.25s var(--ease),box-shadow 0.25s var(--ease),transform 0.35s var(--spring)}
.seg>a:hover,.seg>button:hover{color:var(--text-1);background:color-mix(in srgb, var(--glass-lens) 45%, transparent)}
.seg>a:active,.seg>button:active{transform:scale(0.95)}
.seg>.on,.seg>[aria-pressed="true"]{color:var(--accent-fg);background:color-mix(in srgb, var(--accent) 13%, var(--glass-lens));box-shadow:var(--shadow-lens)}
.seg>.on:hover,.seg>[aria-pressed="true"]:hover{color:var(--accent-fg);background:color-mix(in srgb, var(--accent) 16%, var(--glass-lens))}
.seg>a:focus-visible,.seg>button:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.seg.sm>a,.seg.sm>button{height:24px;padding:0 10px;font-family:var(--mono);font-size:11.5px}
.seg .n{font-family:var(--mono);font-size:11px;color:var(--text-dim)}
.seg .n.hot{color:var(--red-ink)}
.tabs{margin-left:6px}
.nav-act{display:flex;align-items:center;gap:6px;flex:none;margin-left:auto}
.iconbtn{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:none;width:30px;height:30px;padding:0;border:0;border-radius:var(--r-pill);background:none;color:var(--text-dim);text-decoration:none;cursor:pointer;transition:color 0.2s,background 0.25s var(--ease),box-shadow 0.25s var(--ease),transform 0.35s var(--spring)}
.iconbtn:hover{color:var(--text-1);background:var(--glass-hover);box-shadow:var(--shadow-lens);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur)}
.iconbtn:active{transform:scale(0.9)}
.iconbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.iconbtn.gh svg{width:17px;height:17px;fill:currentColor;stroke:none}
.iconbtn.gh{color:var(--text-2)}
.themebtn .moon,.themebtn[data-to="dark"] .sun{display:none}
.themebtn[data-to="dark"] .moon{display:block}
.sep{width:1px;height:18px;margin:0 4px;background:var(--border-1);flex:none}
/* buttons */
.btn,.pick{position:relative;isolation:isolate;overflow:hidden;background:var(--glass);box-shadow:var(--shadow-glass);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);transition:color 0.2s,background 0.25s var(--ease),box-shadow 0.25s var(--ease),transform 0.35s var(--spring)}
.btn::before,.pick::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;background:radial-gradient(130% 100% at var(--mx, 50%) var(--my, -30%), var(--glass-glint), transparent 55%);opacity:0.5;transition:opacity 0.25s}
.btn:hover,.pick:hover,.pick[aria-expanded="true"]{background:var(--glass-hover)}
.btn:hover::before,.pick:hover::before,.pick[aria-expanded="true"]::before{opacity:1}
.btn:active,.pick:active{transform:scale(0.96)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:32px;padding:0 14px;border:0;border-radius:var(--r-pill);color:var(--text-1);font-size:13.5px;text-decoration:none;white-space:nowrap}
/* tinted glass: the hue is in the fill and the rim, the label is the ink tone */
.btn.accent{color:var(--orange-ink);background:color-mix(in srgb, var(--orange) 13%, var(--glass));box-shadow:var(--shadow-glass),inset 0 0 0 1px color-mix(in srgb, var(--orange) 42%, transparent)}
.btn.accent:hover{background:color-mix(in srgb, var(--orange) 20%, var(--glass-hover))}
.btn.warn{color:var(--yellow-ink);background:color-mix(in srgb, var(--yellow) 12%, var(--glass));box-shadow:var(--shadow-glass),inset 0 0 0 1px color-mix(in srgb, var(--yellow) 38%, transparent)}
.btn.warn:hover{background:color-mix(in srgb, var(--yellow) 18%, var(--glass-hover))}
.btn.sm{height:26px;padding:0 10px;font-family:var(--mono);font-size:11.5px}
.btn.danger:hover{color:var(--red-ink);background:color-mix(in srgb, var(--red) 12%, var(--glass-hover))}
.btn svg{width:14px;height:14px}
.dotw{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:0.35}}
@media (max-width:980px){.nav-inner{flex-wrap:wrap;padding-block:10px;row-gap:10px}.tabs{order:5;flex-basis:100%;margin-left:0;justify-content:flex-start}.tabs.seg{width:max-content}}
@media (max-width:620px){.ver,.sep{display:none}.lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}.nav-act .btn{padding:0 10px}}
@media (max-width:480px){:root{--gutter:16px}.nav-inner{gap:8px}.nav-act{gap:2px}}
@media (max-width:370px){.mark .wm{display:none}}
@media (pointer:coarse){.iconbtn{width:36px;height:40px}}

/* ---------- page head and bands ---------- */
.phead{padding:22px 0 2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.eyebrow{margin:0 0 10px;font-size:14px;line-height:1.6;color:var(--text-dim)}
.eyebrow::first-letter{text-transform:uppercase}
.hl{color:var(--accent-fg)}
.scope b{font-weight:400}
.scope{display:flex;flex-wrap:wrap;gap:4px 8px;margin:0;font-family:var(--mono);font-size:12px;color:var(--text-2)}
.scope i{font-style:normal;color:var(--text-dim)}
.scope a{color:inherit}
.band{padding-top:calc(var(--band) / 2)}
.bandhead{margin:0 0 20px}
.band-title{font-size:clamp(19px,2vw,22px);line-height:1.25;letter-spacing:-0.02em;text-wrap:balance}
.lede{max-width:760px;margin:0 0 16px;font-size:14.5px;color:var(--text-2);text-wrap:pretty}
.note{font-size:13px;color:var(--text-dim);text-wrap:pretty}
.note code{font-size:12px}
/* engagement head */
.ehead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:20px 0 0}
.ehead h1{font-size:20px;font-weight:500;letter-spacing:-0.02em;line-height:1.2}
.ehead .sp{display:flex;gap:4px;margin-left:auto}
.back{background:var(--glass);box-shadow:var(--shadow-glass);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur)}

/* ---------- pills ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;line-height:1.6;padding:2px 9px;border-radius:var(--r-pill);background:var(--lit-bg,var(--bg-hover));color:var(--lit,var(--text-2));white-space:nowrap;vertical-align:middle}
.pill+.pill{margin-left:4px}
.pill.ok{--lit:var(--green-ink);--lit-bg:color-mix(in srgb, var(--green) 14%, transparent)}
.pill.no{--lit:var(--red-ink);--lit-bg:color-mix(in srgb, var(--red) 14%, transparent)}
.pill.maybe{--lit:var(--yellow-ink);--lit-bg:color-mix(in srgb, var(--yellow) 14%, transparent)}
.pill.acc{--lit:var(--accent-fg);--lit-bg:var(--accent-soft)}
.pill.blue{--lit:var(--blue-ink);--lit-bg:color-mix(in srgb, var(--blue) 14%, transparent)}
.pill.line{background:none;box-shadow:inset 0 0 0 1px var(--border-2);color:var(--text-dim)}
.pill.sev i,.pill i.sw{width:6px;height:6px;border-radius:2px;flex:none;background:var(--c)}
.pill b{font-weight:400;color:var(--text-dim)}
.pill svg{width:12px;height:12px}
.state{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11.5px;color:var(--text-2);white-space:nowrap}
.state i{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none;position:relative}
.state.run i::after{content:"";position:absolute;inset:0;border-radius:50%;background:inherit;animation:ping 2.1s ease-out infinite}
@keyframes ping{0%{transform:scale(1);opacity:0.65}100%{transform:scale(2.8);opacity:0}}
.chips{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:14px;font-family:var(--mono);font-size:12px;color:var(--text-dim)}
.chips .pill+.pill{margin-left:0}

/* ---------- stat tiles ---------- */
.kpis{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));gap:16px;margin-top:24px}
.kpi{min-width:0;padding:16px 18px 14px;border-radius:var(--r-panel);background:var(--bg-terminal);box-shadow:var(--shadow-surface)}
.kl{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text-dim)}
.kl i{width:7px;height:7px;border-radius:2px;background:var(--c,var(--pl-tick))}
.kv{margin-top:2px;font-size:30px;font-weight:500;line-height:1.2;letter-spacing:-0.03em;color:var(--text-1);font-variant-numeric:tabular-nums}
.kv small{margin-left:6px;font-size:13px;font-weight:400;letter-spacing:0;color:var(--text-dim)}
.kd{margin-top:4px;font-family:var(--mono);font-size:11px;color:var(--text-dim);overflow-wrap:anywhere}
.kd b{font-weight:400;color:var(--text-2)}
.kd .c-no{color:var(--red-ink)}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(min(var(--cols,4),3),minmax(0,1fr))}}
@media (max-width:720px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kv{font-size:26px}}

/* ---------- cards ---------- */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.grid+.grid{margin-top:16px}
.card{position:relative;display:flex;flex-direction:column;min-width:0;padding:var(--pad-card);border-radius:var(--r-panel);background:var(--bg-terminal);box-shadow:var(--shadow-surface)}
.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.ch{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.ch h3{font-size:16px;line-height:1.3;letter-spacing:-0.01em}
.form{margin-top:2px;font-family:var(--mono);font-size:11px;color:var(--text-dim)}
.tb{all:unset;box-sizing:border-box;flex:none;cursor:pointer;display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:var(--r-pill);font-family:var(--mono);font-size:11.5px;color:var(--text-dim);transition:color 0.2s,background 0.25s var(--ease),box-shadow 0.25s var(--ease),transform 0.35s var(--spring)}
.tb:hover{color:var(--text-1);background:var(--glass-hover);box-shadow:var(--shadow-lens)}
.tb:active{transform:scale(0.94)}
.tb[aria-pressed="true"]{color:var(--accent-fg)}
.tb:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.fig{position:relative;flex:1;display:flex;flex-direction:column;justify-content:center;margin-top:14px;border-radius:var(--r-ctl);cursor:default}
.plot{min-width:0}
.lg{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:12px}
.lg:empty{display:none}
.lg .pill+.pill{margin-left:0}

const tipEl=$('#tip'),still=matchMedia('(prefers-reduced-motion: reduce)');
function mountCards(){
  live=[];

    const d=CARDS[a.dataset.card],sc=a.dataset.scope||'',c=Object.assign({},d,{h0:d.h,el:a,uid:d.id+(sc?'-'+sc:''),list:sc?byEng(sc):F,cur:-1});

    $('h3',a).textContent=d.title;$('.form',a).textContent=d.form;
    Object.assign(c,{fig:$('.fig',a),plot:$('.plot',a),lg:$('.lg',a),tv:$('.tv',a),btn:$('.tb',a),capEl:$('.cap',a)});
    wire(c);live.push(c);
  });
  live.forEach(c=>render(c));live.forEach(fill);
}
function render(c,grow){
  grow=grow||0;const dk=Math.min(1.2,.55+.45*(parseFloat(getComputedStyle(root).getPropertyValue('--tw-d'))||1));c.h=Math.round(c.h0*dk); /* plates shorten with the dock's density */
  const shown=!c.fig.hidden,W=shown?(c.W=Math.max(220,Math.floor(c.plot.clientWidth))):c.W||600,o=c.out=c.draw({W:W,H:c.h+grow,list:c.list}),H=o.H||c.h+grow;
  legend(c.lg,o.legend||[]);c.capEl.textContent=[c.cap,o.cap2].filter(Boolean).join(' ');
  if(!shown)return table(c);
  c.plot.innerHTML='<svg class="plate" viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" aria-hidden="true">'+ground('g-'+c.uid,W,H)+o.body+'<g class="hov"></g></svg>';
  c.fig.setAttribute('aria-label',c.title+'. '+(o.aria||c.cap)+' Use the arrow keys to step through the values.');

/* cards in one row are as tall as the tallest: a plate with room left over is drawn again to fill its panel */
function fill(c){if(c.fig.hidden)return;const room=c.fig.clientHeight-c.plot.offsetHeight;if(room>6)render(c,Math.min(200,Math.floor(room)));}
function legend(el,items){

}
function table(c){
  const t=c.out.table;
  c.tv.innerHTML='<table><thead><tr>'+t.head.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+t.rows.map(r=>'<tr>'+r.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
}
function tipShow(t,x,y){
  if(t!==tipFor){tipFor=t;tipEl.innerHTML=(t.t?'<p class="tip-t">'+esc(t.t)+'</p>':'')+t.rows.map(r=>'<div class="tip-r">'+(r[0]?'<i style="--c:var('+r[0]+')"></i>':'')+'<span>'+esc(r[1])+'</span><b>'+esc(r[2])+'</b></div>').join('');}
  const w=tipEl.offsetWidth,h=tipEl.offsetHeight;let left=x+14,top=y-h-12;
  if(left+w>innerWidth-8)left=x-w-14;if(left<8)left=8;if(top<8)top=y+18;
  tipEl.style.transform='translate('+Math.round(left)+'px,'+Math.round(top)+'px)';tipEl.classList.add('show');
}
function locate(c,e){
  const o=c.out,pts=o.pts||[];if(!pts.length)return -1;
  if(o.hover==='x'){const x=e.clientX-c.plot.firstElementChild.getBoundingClientRect().left;if(x<pts[0].x-20||x>pts[pts.length-1].x+20)return -1;let b=0;pts.forEach((p,i)=>{if(Math.abs(p.x-x)<Math.abs(pts[b].x-x))b=i;});return b;}
  const t=e.target.closest('[data-i]');return t?+t.dataset.i:-1;
}
function show(c,i,cx,cy){
  const o=c.out,p=o.pts[i];if(!p)return;
  if(c.cur!==i){
    c.fig.querySelectorAll('.on').forEach(el=>el.classList.remove('on'));
    c.fig.querySelectorAll('[data-i="'+i+'"]').forEach(el=>el.classList.add('on'));
    c.fig.classList.toggle('dim',!!o.dim);
    const b=p.box;$('.hov',c.fig).innerHTML=b?'<rect class="pl-cursor" x="'+r1(b[0])+'" y="'+r1(b[1])+'" width="'+r1(b[2])+'" height="'+r1(b[3])+'" rx="'+(b[4]||4)+'"/>':'';
    c.cur=i;c.fig.style.cursor=o.go?'pointer':'';
  }
  const r=c.plot.firstElementChild.getBoundingClientRect();
  tipShow(p.tip,cx==null?r.left+p.x:cx,cy==null?r.top+p.y:cy);
}
function leave(c){
  if(c.cur<0&&!tipEl.classList.contains('show'))return;
  c.cur=-1;c.fig.classList.remove('dim');c.fig.style.cursor='';c.fig.querySelectorAll('.on').forEach(el=>el.classList.remove('on'));
  const h=$('.hov',c.fig);if(h)h.innerHTML='';tipEl.classList.remove('show');

/* the ground's answer to the pointer: the spot follows a mouse, a press sends one wave across the plate */
function spot(c,e,press){
  const svg=c.plot.firstElementChild;if(!svg||(!press&&e.pointerType!=='mouse'))return;
  const r=svg.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  if(!press){const s=$('.pl-spot',svg);if(s){s.setAttribute('cx',r1(x));s.setAttribute('cy',r1(y));s.setAttribute('r',180);}return;}
  const ring=$('.pl-wave',svg);if(still.matches||!ring)return;
  const far=Math.hypot(Math.max(x,r.width-x),Math.max(y,r.height-y))+90,stop=svg.querySelector('#g-'+c.uid+'w stop'),t0=performance.now();
  ring.setAttribute('cx',r1(x));ring.setAttribute('cy',r1(y));cancelAnimationFrame(c.wave);
  const frame=now=>{const t=Math.min(1,(now-t0)/1300),rad=(1-(1-t)**3)*far;ring.setAttribute('r',r1(rad));ring.setAttribute('opacity',t<1?((1-t)**1.4).toFixed(3):0);if(stop)stop.setAttribute('offset',Math.max(0,1-90/Math.max(rad,1)).toFixed(3));if(t<1&&ring.isConnected)c.wave=requestAnimationFrame(frame);};

function wire(c){
  const f=c.fig;

  f.addEventListener('pointerdown',e=>spot(c,e,true));
  f.addEventListener('pointerleave',()=>leave(c));
  f.addEventListener('blur',()=>leave(c));
  f.addEventListener('click',e=>{const i=locate(c,e);if(c.out.go&&i>=0)location.hash=c.out.go[i];});
  f.addEventListener('keydown',e=>{
    const n=(c.out.pts||[]).length,k=e.key;if(!n)return;let i=c.cur;
    if(k==='ArrowRight'||k==='ArrowDown')i=i<0?0:(i+1)%n;else if(k==='ArrowLeft'||k==='ArrowUp')i=i<0?n-1:(i-1+n)%n;
    else if(k==='Home')i=0;else if(k==='End')i=n-1;else if(k==='Enter'&&c.out.go&&i>=0){location.hash=c.out.go[i];return;}else if(k==='Escape'){leave(c);return;}else return;
    e.preventDefault();e.stopPropagation();show(c,i);
  });
  c.btn.addEventListener('click',()=>{
    const on=c.btn.getAttribute('aria-pressed')!=='true';c.btn.setAttribute('aria-pressed',on);leave(c);
    if(on){c.tv.style.height=c.fig.offsetHeight+'px';table(c);}
    c.fig.hidden=on;c.tv.hidden=!on;c.btn.textContent=on?'plate':'table';
    if(!on){render(c);fill(c);}
  });
}
/* the dock sends a resize after a font, size, density or gutter change: measure again and redraw every plate */

  const row=(k,v)=>'<div class="srow"><span>'+k+'</span><span>'+v+'</span></div>';
  const box=(title,form,body,span)=>'<section class="card s'+(span||6)+'"><header class="ch"><div><h3>'+title+'</h3><p class="form">'+form+'</p></div></header><div class="cbody">'+body+'</div></section>';
  return phead('Settings',['stored in this browser','sample values'])
    +'<div class="band"><div class="grid">'
    +box('Appearance','stored in this browser only',row('mode',seg('mode',['dark','light'],mode()))+row('more','<button class="btn sm" type="button" data-opendock>open the tweak dock</button>')+'<p class="note" style="margin-top:12px">Theme, surface, font, size, corners, density, gutter and accent are in the tweak dock at the bottom of the page. A look you pick there is written to the address, so a link carries it.</p>')
    +box('Build','sample',row('version','gimorra 0.1.101-alpha')+row('channel','alpha')+row('author','@j3ssie')+row('source','<a href="https://github.com/j3ssie/artikit" target="_blank" rel="noopener">github.com/j3ssie/artikit</a>')+row('about','Autonomous offensive security agent'))
    +'</div><div class="grid">'
    +box('Runtime','read from the gateway',row('tier','Embedded')+row('orchestrator model','claude-opus-5-5')+row('specialist model','claude-sonnet-5-5')+row('autonomy default','unrestricted'))
    +box('Drivers and store','one codebase, two tiers',row('store','sqlite')+row('queue','inproc')+row('stream','emitter')+row('engagements',ENG.length)+row('jobs',JOBS.length)+row('findings',F.length))
    +'</div><p class="note" style="margin-top:16px">Configuration is file and environment driven. Drivers and the orchestrator model come from <code>~/.gimorra/configs.yaml</code> or <code>GIMORRA_*</code> variables; the switch between tiers is config only.</p></div>';
}

/* ================= theme ================= */
const sysLight=matchMedia('(prefers-color-scheme: light)');
const mode=()=>root.dataset.theme||(sysLight.matches?'light':'dark');
function syncTheme(){const to=mode()==='dark'?'light':'dark',b=$('#themebtn'),l='Switch to '+to+' theme';b.dataset.to=to;b.setAttribute('aria-label',l);b.title=l;}
/* the tweak dock owns the scheme when it is on the page: it sets data-theme and remembers it */
function setTheme(m){if(window.Tweaks)Tweaks.set({mode:m});else{root.dataset.theme=m;try{localStorage.setItem('gl-theme',m);}catch(e){}}syncTheme();live.forEach(c=>leave(c));}
document.addEventListener('tweakchange',()=>{syncTheme();if(ui.cur.page==='settings'){const a=document.activeElement&&document.activeElement.dataset.pref;draw();const nb=a&&view.querySelector('[data-pref="'+a+'"]');if(nb)nb.focus();}});
sysLight.addEventListener('change',()=>{if(!root.dataset.theme)syncTheme();});
$('#themebtn').addEventListener('click',()=>{setTheme(mode()==='dark'?'light':'dark');if(ui.cur.page==='settings')draw();});

/* ================= routing ================= */
const PAGES={dashboard:pageDashboard,engagements:pageEngagements,engagement:pageEngagement,findings:pageFindings,targets:pageTargets,'new-scan':pageNewScan,settings:pageSettings};
const TABOF={engagement:'engagements'};
function relist(){const l=$('#list');if(l&&ui.list){l.innerHTML=ui.list();if(l.querySelector('[data-card]'))mountCards();}}
function syncTop(){
  const n=waiting();$('#alertN').textContent=n;$('#alertBtn').hidden=!n;
  document.querySelectorAll('#tabs a').forEach(t=>{const on=t.dataset.tab===(TABOF[ui.cur.page]||ui.cur.page);t.classList.toggle('on',on);on?t.setAttribute('aria-current','page'):t.removeAttribute('aria-current');});
}
function draw(){
  tipEl.classList.remove('show');ddClose(false);
  view.innerHTML=PAGES[ui.cur.page](ui.cur.a,ui.cur.b);
  if(ui.cur.page==='new-scan')scanSummary();
  mountCards();drawRail();syncTop();
}
function route(){
  const p=(location.hash||'#dashboard').slice(1).split('/'),c={page:PAGES[p[0]]?p[0]:'dashboard',a:p[1]||'',b:p[2]||''};
  const moved=c.page!==ui.cur.page||(c.page==='engagement'&&c.a!==ui.cur.a);
  ui.cur=c;
  if(c.page==='findings'){const i=F.findIndex(f=>f.id===c.a);ui.rail=i<0?null:i;}else if(moved)ui.rail=null;
  draw();if(moved)scrollTo(0,0);
}
addEventListener('hashchange',route);
addEventListener('scroll',()=>$('#nav').classList.toggle('stuck',scrollY>4),{passive:true});

/* ================= events ================= */
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600);}
function copy(text){(navigator.clipboard?navigator.clipboard.writeText(text):Promise.reject()).then(()=>toast('Copied.'),()=>toast('Copy is blocked here. Select the text instead.'));}
document.addEventListener('click',e=>{
  const el=x=>e.target.closest(x);let b;
  if((b=el('[data-sort]'))){const s=ui[b.closest('table').dataset.table],k=b.dataset.sort;s.sort=[k,s.sort[0]===k?-s.sort[1]:1];s.page=0;ui.cur.page==='targets'?draw():relist();const nb=view.querySelector('[data-sort="'+k+'"]');if(nb)nb.focus();return;}
  if((b=el('[data-page]'))){ui.find.page+=+b.dataset.page;relist();const nb=view.querySelector('[data-page="'+b.dataset.page+'"]');if(nb&&!nb.disabled)nb.focus();return;}
  if((b=el('[data-triage]'))){const f=F[ui.rail];f.status=b.dataset.triage;f.by=f.status==='open'?'-':'operator';if(f.status!=='open')f.potential=false;relist();drawRail();toast('Marked '+f.status+'. Sample data: the change stays in this tab.');return;}
  if((b=el('[data-copy]'))){const k=b.dataset.copy;copy(k==='cmd'?scanCmd():k==='all'?Array.from(rail.querySelectorAll('.term pre')).map(p=>p.textContent).join('\n\n'):b.closest('.term').querySelector('pre').textContent);return;}
  if((b=el('[data-appr]'))){const p=b.dataset.appr.split(':');APPR[+p[0]].state=p[1];draw();toast(p[1]==='yes'?'Recorded. The run can advance.':'Refused. The run moves on without it.');return;}
  if((b=el('[data-toast]'))){toast(b.dataset.toast);return;}
  if((b=el('[data-switch]'))){b.setAttribute('aria-pressed',String(b.getAttribute('aria-pressed')!=='true'));return;}
  if((b=el('[data-starter]'))){ui.scan.prompt=b.dataset.starter;$('#scanForm').elements.prompt.value=ui.scan.prompt;scanSummary();return;}
  if((b=el('[data-pref]'))){const i=b.dataset.pref.indexOf(':'),k=b.dataset.pref.slice(0,i),v=b.dataset.pref.slice(i+1);if(k==='mode')setTheme(v);draw();const nb=view.querySelector('[data-pref="'+k+':'+v+'"]');if(nb)nb.focus();return;}
  if((b=el('[data-opendock]'))){if(window.Tweaks)Tweaks.set({open:true});const f=document.querySelector('.tw button');if(f)f.focus();return;}
  if((b=el('[data-dd]'))){ddFor===b?ddClose(true):ddOpen(b);return;}
  if((b=el('[data-find]'))){openRail(+b.dataset.find);return;}
  if((b=el('tr[data-go]'))&&!el('a')){location.hash=b.dataset.go;}
});
document.addEventListener('input',e=>{
  const f=e.target.dataset&&e.target.dataset.f;
  if(f){const p=f.split('.');ui[p[0]][p[1]]=e.target.value;ui[p[0]].page=0;relist();return;}
  if(e.target.form&&e.target.form.id==='scanForm'){const t=e.target;ui.scan[t.name]=t.type==='checkbox'?t.checked:t.value;scanSummary();}
});
document.addEventListener('submit',e=>{e.preventDefault();toast(ui.scan.target.trim()||ui.scan.prompt.trim()?'Sample console: nothing was started. The command below is what would run.':'Name a target or write a prompt first.');});
$('#railClose').addEventListener('click',closeRail);
$('#scrim').addEventListener('click',closeRail);
document.addEventListener('keydown',e=>{
  if(ddFor)return; /* the open listbox has the keys */
  if((e.key==='ArrowDown'||e.key==='ArrowUp')&&e.target.dataset&&e.target.dataset.dd){e.preventDefault();ddOpen(e.target);return;}
  if(e.key==='Escape'){closeRail();return;}
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='t')$('#themebtn').click();
  if(e.key==='/'){const i=view.querySelector('.search input');if(i){e.preventDefault();i.focus();}}
});
/* ================= the listbox every dropdown opens ================= */
const ddm=document.createElement('div');ddm.className='ddmenu';ddm.setAttribute('role','listbox');ddm.tabIndex=-1;ddm.hidden=true;document.body.append(ddm);
let ddFor=null,ddAct=0,ddRows=[];
function ddOpen(b){
  const d=DD[b.dataset.dd];if(!d)return;ddClose(false);ddFor=b;ddRows=d.rows();
  const cur=uiGet(b.dataset.dd);ddAct=Math.max(0,ddRows.findIndex(x=>x[0]===cur));
  ddm.setAttribute('aria-label',d.label);
  ddm.innerHTML=ddRows.map((x,i)=>'<div role="option" id="dd-'+i+'" data-i="'+i+'" aria-selected="'+(x[0]===cur)+'"><span>'+esc(x[1])+'</span>'+(x[2]!=null?'<b>'+x[2]+'</b>':'')+'</div>').join('');
  ddm.hidden=false;b.setAttribute('aria-expanded','true');ddPlace();ddMark();ddm.focus({preventScroll:true});
}
function ddPlace(){
  const r=ddFor.getBoundingClientRect();ddm.style.minWidth=Math.max(160,Math.round(r.width))+'px';
  const h=ddm.offsetHeight,w=ddm.offsetWidth,up=r.bottom+6+h>innerHeight-8&&r.top-6-h>8,left=Math.max(8,Math.min(r.left,innerWidth-w-8));
  ddm.classList.toggle('up',up);ddm.style.setProperty('--ox',Math.round(r.left+r.width/2-left)+'px');
  ddm.style.transform='';ddm.style.left=Math.round(left)+'px';ddm.style.top=Math.round(up?r.top-6-h:r.bottom+6)+'px';
}
function ddMark(){Array.from(ddm.children).forEach((o,i)=>o.classList.toggle('act',i===ddAct));ddm.setAttribute('aria-activedescendant','dd-'+ddAct);const a=ddm.children[ddAct];if(a)a.scrollIntoView({block:'nearest'});}
function ddClose(refocus){if(!ddFor)return;const b=ddFor;ddFor=null;ddm.hidden=true;b.setAttribute('aria-expanded','false');if(refocus&&b.isConnected)b.focus({preventScroll:true});}
function ddChoose(i){
  const b=ddFor,x=ddRows[i];if(!b||!x)return;ddClose(true);
  const k=b.dataset.dd,p=k.split('.'),d=DD[k];if(ui[p[0]][p[1]]===x[0])return;ui[p[0]][p[1]]=x[0];
  b.querySelector('b').textContent=x[1];b.classList.toggle('on',!!x[0]&&!d.required);b.setAttribute('aria-label',d.label+': '+x[1]);
  if(p[0]==='scan')scanSummary();else{ui[p[0]].page=0;relist();}
}
ddm.addEventListener('pointermove',e=>{const o=e.target.closest('[role="option"]');if(o&&+o.dataset.i!==ddAct){ddAct=+o.dataset.i;ddMark();}});
ddm.addEventListener('click',e=>{const o=e.target.closest('[role="option"]');if(o)ddChoose(+o.dataset.i);});
ddm.addEventListener('keydown',e=>{
  const n=ddRows.length,k=e.key;
  if(k==='ArrowDown')ddAct=(ddAct+1)%n;else if(k==='ArrowUp')ddAct=(ddAct-1+n)%n;else if(k==='Home')ddAct=0;else if(k==='End')ddAct=n-1;
  else if(k==='Enter'||k===' '){e.preventDefault();ddChoose(ddAct);return;}
  else if(k==='Escape'){e.preventDefault();ddClose(true);return;}
  else if(k==='Tab'){ddClose(true);return;}
  else if(k.length===1&&!e.metaKey&&!e.ctrlKey){const s=k.toLowerCase(),hit=i=>ddRows[i][1].toLowerCase().startsWith(s);let j=-1;for(let s2=1;s2<=n;s2++){const c=(ddAct+s2)%n;if(hit(c)){j=c;break;}}if(j<0)return;ddAct=j;}
  else return;
  e.preventDefault();ddMark();
});
document.addEventListener('pointerdown',e=>{if(ddFor&&!ddm.contains(e.target)&&!ddFor.contains(e.target))ddClose(false);},true);
addEventListener('scroll',()=>{if(ddFor)ddPlace();},{passive:true});
addEventListener('resize',()=>ddClose(false));

/* ================= the glint: a glass button's highlight leans toward the pointer ================= */
document.addEventListener('pointermove',e=>{
  const b=e.target.closest&&e.target.closest('.btn,.pick');if(!b||e.pointerType!=='mouse')return;
  const r=b.getBoundingClientRect();b.style.setProperty('--mx',((e.clientX-r.left)/r.width*100).toFixed(1)+'%');b.style.setProperty('--my',((e.clientY-r.top)/r.height*100-60).toFixed(1)+'%');
},{passive:true});
document.addEventListener('pointerout',e=>{const b=e.target.closest&&e.target.closest('.btn,.pick');if(b&&!b.contains(e.relatedTarget)){b.style.removeProperty('--mx');b.style.removeProperty('--my');}});

syncTheme();measure();route();
})();
</script>
</body>
</html>
