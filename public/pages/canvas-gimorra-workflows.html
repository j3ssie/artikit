<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gimorra · Workflows (sample)</title>
<meta name="description" content="Sample canvas page: agent workflows for Gimorra drawn as loop and swimlane diagrams on a pannable canvas, with a run you can start and an activity feed.">
<link rel="icon" href="../assets/gimorra-logo.png">
<meta name="color-scheme" content="dark light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- Parser-blocking on purpose: the stored theme has to land before the first paint. -->
<script>
(function () {
  var t = null;
  try { t = localStorage.getItem("gm-workflows-theme"); } catch (e) {}
  if (t !== "light" && t !== "dark") t = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  document.documentElement.dataset.theme = t;
})();
</script>
<style>
/* Hallmark · shape: app screen · genre: modern-minimal · theme: custom · idea: "a workflow is a loop you can watch close: trigger, steps inside a dashed frame, a pill at each end" · vibe: "near-black, quiet, mono-labelled, keyboard-first"
 * paper: oklch(14.5% 0.003 255) · accent: oklch(74% 0.19 148) · display: Inter · body: Inter
 * nav: one-line top bar, workflow list as the master pane · signature: the loop diagram running step by step · states: not run, running, completed, step selected, reduced motion
 * axes: dark/grotesk/chromatic-green · posture: restrained · contrast: pass · v2.0.0 */
/* Hallmark · pre-emit critique: P4 H4 E4 S4 R4 V4 · weakest: V, it shares a pannable canvas with the scan-lifecycle page; the vertical loop, the swimlane and the run feed are what set it apart */
/* Not Hallmark-clean on 67, on purpose: loop-diagram nodes and pills are uppercase because the reference diagram the page was asked to follow sets them that way. Interface labels outside the canvas stay sentence case. Mono on the same labels (gate 64) is kept for the same reason. */
:root {
  color-scheme: dark;
  --space-3xs: 2px; --space-2xs: 4px; --space-xs: 8px; --space-sm: 12px; --space-md: 16px; --space-lg: 24px; --space-xl: 40px;
  --text-xs: 0.75rem; --text-sm: 0.8125rem; --text-md: 0.9375rem; --text-lg: 1.125rem;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-micro: 120ms; --dur-short: 220ms;
  --color-paper: light-dark(oklch(98.8% 0 0), oklch(14.5% 0.003 255));
  --color-paper-2: light-dark(oklch(96.8% 0.002 255), oklch(17.5% 0.003 255));
  --color-paper-3: light-dark(oklch(100% 0 0), oklch(21% 0.004 255));
  --color-paper-4: light-dark(oklch(94.5% 0.003 255), oklch(25% 0.005 255));
  --color-ink: light-dark(oklch(22.5% 0.006 265), oklch(97.5% 0.002 200));
  --color-ink-2: light-dark(oklch(37% 0.008 260), oklch(84% 0.006 260));
  --color-muted: light-dark(oklch(52% 0.01 260), oklch(67% 0.012 260));
  --color-rule: light-dark(oklch(92% 0.004 260), oklch(26.5% 0.008 260));
  --color-rule-2: light-dark(oklch(84% 0.006 260), oklch(36% 0.01 260));
  --color-edge: light-dark(oklch(62% 0.008 260), oklch(50% 0.01 260));
  --color-node-rule: light-dark(oklch(86% 0.006 260), oklch(26.5% 0.008 260));
  --color-accent: light-dark(oklch(49% 0.15 150), oklch(74% 0.19 148));
  --color-accent-ink: light-dark(oklch(100% 0 0), oklch(14.5% 0.003 255));
  --color-focus: light-dark(oklch(52% 0.17 258), oklch(74% 0.13 255));
  --color-accent-2: light-dark(oklch(50% 0.16 275), oklch(77% 0.11 275));
  --color-run: light-dark(oklch(52% 0.12 75), oklch(83% 0.15 85));
  --color-error: light-dark(oklch(51% 0.2 25), oklch(72% 0.17 22));
  --font-display: "Inter", ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --font-body: "Inter", ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius-card: 8px; --radius-ctl: 6px; --radius-sharp: 2px; --radius-pill: 999px;
  --bar-h: 56px; --list-w: 264px; --panel-w: 344px;
  --z-edges: 1; --z-nodes: 2; --z-marks: 3; --z-hud: 10; --z-bar: 20;
}
:root[data-theme="light"] { color-scheme: light; }

*, *::before, *::after { box-sizing: border-box; }
html, body { overflow-x: clip; }
html { scrollbar-color: var(--color-rule-2) var(--color-paper); }
body {
  margin: 0; height: 100dvh; display: grid; grid-template-rows: var(--bar-h) minmax(0, 1fr);
  background: var(--color-paper); color: var(--color-ink);
  font-family: var(--font-body); font-size: var(--text-sm); line-height: 1.5; letter-spacing: -0.005em;
  -webkit-font-smoothing: antialiased;
}
::selection { background: color-mix(in oklab, var(--color-accent) 30%, transparent); }
:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
h1, h2, h3, p, ol, ul, dl, dd { margin: 0; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; overflow-wrap: break-word; min-width: 0; text-wrap: balance; }
ul, ol { list-style: none; padding: 0; }
button { font: inherit; color: inherit; letter-spacing: inherit; }
a { color: inherit; }
svg { display: block; }
[hidden] { display: none !important; }
.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.sprite { position: absolute; width: 0; height: 0; }
kbd { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding-inline: var(--space-2xs); border: 1px solid var(--color-rule-2); border-radius: 4px; font: 500 0.6875rem/1 var(--font-mono); color: var(--color-ink-2); }

/* ── top bar ─────────────────────────────────────────────────────────── */
.bar {
  position: relative; z-index: var(--z-bar); display: flex; align-items: center; gap: var(--space-md);
  padding-inline: var(--space-md); border-bottom: 1px solid var(--color-rule); background: var(--color-paper-2);
}
.crumbs { display: flex; align-items: center; gap: var(--space-xs); min-width: 0; }
.brand { display: inline-flex; align-items: center; gap: var(--space-xs); text-decoration: none; font-weight: 600; border-radius: var(--radius-ctl); }
.brand img { border-radius: 5px; }
.crumbs .sep { color: var(--color-rule-2); }
.crumbs h1 { font-size: var(--text-sm); font-weight: 500; white-space: nowrap; }
.crumbs .cur { color: var(--color-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-end { margin-left: auto; display: flex; align-items: center; gap: var(--space-sm); }
.note { color: var(--color-muted); font-size: var(--text-xs); white-space: nowrap; }

.btn {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-xs);
  height: 32px; padding-inline: var(--space-sm); border: 1px solid var(--color-rule-2); border-radius: var(--radius-ctl);
  background: var(--color-paper-3); color: var(--color-ink); cursor: pointer; white-space: nowrap; font-weight: 500;
  transition: background-color var(--dur-micro), border-color var(--dur-micro);
}
.btn::after { content: ""; position: absolute; inset: -6px -2px; }
.btn:hover { background: var(--color-paper-4); }
.btn:active { background: var(--color-rule); }
.btn.sq { width: 32px; padding: 0; }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }
.btn.primary { background: var(--color-ink); color: var(--color-paper); border-color: var(--color-ink); }
.btn.primary:hover { background: var(--color-ink-2); border-color: var(--color-ink-2); }
.btn.primary:active { background: var(--color-muted); border-color: var(--color-muted); }
.btn.primary kbd { border-color: color-mix(in oklab, var(--color-paper) 40%, transparent); color: var(--color-paper); }
:root[data-theme="dark"] .t-moon, :root[data-theme="light"] .t-sun { display: none; }

/* ── shell ───────────────────────────────────────────────────────────── */
.shell { display: grid; grid-template-columns: var(--list-w) minmax(0, 1fr) var(--panel-w); min-height: 0; }
.list { display: flex; flex-direction: column; border-right: 1px solid var(--color-rule); background: var(--color-paper-2); min-height: 0; overflow-y: auto; }
.list h2 { padding: var(--space-md) var(--space-md) var(--space-xs); font-size: var(--text-xs); font-weight: 500; color: var(--color-muted); }
.list ul { padding: 0 var(--space-xs); display: grid; gap: var(--space-3xs); }
.wf {
  display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 0 var(--space-xs); align-items: center; width: 100%;
  padding: var(--space-xs); border: 0; border-radius: var(--radius-ctl); background: transparent; text-align: left; cursor: pointer;
  transition: background-color var(--dur-micro);
}
.wf:hover { background: var(--color-paper-3); }
.wf[aria-current="true"] { background: var(--color-paper-4); }
.wf .ic { color: var(--color-muted); }
.wf[aria-current="true"] .ic { color: var(--color-accent-2); }
.wf[data-run="run"] .ic { color: var(--color-run); }
.wf[data-run="done"] .ic { color: var(--color-accent); }
.wf b { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wf span { grid-column: 2; color: var(--color-muted); font-size: var(--text-xs); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.keys { margin-top: auto; padding: var(--space-md); display: grid; grid-template-columns: auto 1fr; gap: var(--space-xs) var(--space-sm); align-items: center; color: var(--color-muted); font-size: var(--text-xs); border-top: 1px solid var(--color-rule); }
.keys dt { display: flex; gap: var(--space-2xs); }

.canvas { position: relative; overflow: hidden; min-height: 0; touch-action: none; cursor: grab; background: var(--color-paper); }
.canvas.panning { cursor: grabbing; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
.world.ease { transition: transform var(--dur-short) var(--ease-out); }
.world::before {
  content: ""; position: absolute; inset: -1600px; pointer-events: none;
  background-image: radial-gradient(var(--color-rule) 1px, transparent 1px); background-size: 24px 24px; opacity: 0.6;
}

/* regions */
.reg { position: absolute; pointer-events: none; }
.reg.loop { border: 1px dashed var(--color-rule-2); border-radius: var(--radius-card); transition: border-color var(--dur-short); }
.reg.loop.on { border-color: color-mix(in oklab, var(--color-accent) 60%, var(--color-rule-2)); }
.reg.lane { border: 1px solid var(--color-rule-2); border-radius: var(--radius-sharp); }
.reg.gap { background: var(--color-paper); }
.glabel { position: absolute; display: inline-flex; align-items: center; gap: var(--space-xs); white-space: nowrap; pointer-events: none; font: 500 var(--text-sm)/1 var(--font-mono); text-transform: uppercase; color: var(--color-muted); }

/* edges */
.edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; z-index: var(--z-edges); }
.edge .ln { fill: none; stroke: var(--color-edge); stroke-width: 1; transition: stroke var(--dur-short); }
.edge.dashed .ln { stroke-dasharray: 3 4; }
.edge .ah { fill: var(--color-edge); transition: fill var(--dur-short); }
.edge.on .ln { stroke: color-mix(in oklab, var(--color-accent) 78%, var(--color-ink)); }
.edge.on .ah { fill: color-mix(in oklab, var(--color-accent) 78%, var(--color-ink)); }

/* nodes */
.node {
  position: absolute; z-index: var(--z-nodes); display: block; padding: 0; border: 1px solid var(--color-node-rule); border-radius: var(--radius-card);
  background: var(--color-paper-3); color: var(--color-ink); text-align: left; cursor: pointer; white-space: nowrap;
  font: 500 var(--text-xs)/18px var(--font-mono);
  transition: border-color var(--dur-micro), background-color var(--dur-micro), box-shadow var(--dur-micro);
}
.node:hover { border-color: var(--color-rule-2); background: var(--color-paper-4); }
.node[aria-pressed="true"] { border-color: var(--color-accent-2); box-shadow: 0 0 0 1px var(--color-accent-2), 0 0 0 5px color-mix(in oklab, var(--color-accent-2) 20%, transparent); }
.node[data-state="run"] { border-color: color-mix(in oklab, var(--color-run) 70%, var(--color-rule)); }
.node[data-state="done"] { border-color: color-mix(in oklab, var(--color-accent) 55%, var(--color-rule)); }
.node.step { padding: var(--space-sm) var(--space-md); text-transform: uppercase; }
.nt { display: flex; align-items: center; gap: var(--space-xs); }
.ni { display: grid; place-items: center; width: 16px; height: 16px; flex: none; color: var(--color-ink-2); }
.ns { display: block; padding-left: var(--space-lg); line-height: 22px; font-weight: 400; color: var(--color-muted); transition: color var(--dur-micro); }
.nt + .ns { margin-top: var(--space-xs); }
.ns.done { color: var(--color-ink-2); }
.tok { color: var(--color-accent-2); }
.node.step[data-state="idle"] .ni { color: var(--color-accent-2); }
.node.step[data-state="idle"][data-id="trigger"] .ni { color: var(--color-run); }
.world .node[data-state="run"] .ni { color: var(--color-run); }
.world .node[data-state="done"] .ni { color: var(--color-accent); }
.node[data-state="run"] .ni .ic { animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
/* swimlane nodes: sharp, icon cell, mixed case */
.node.cell { display: grid; grid-template-columns: 64px minmax(0, 1fr); align-items: stretch; border-radius: var(--radius-sharp); border-color: var(--color-rule-2); background: var(--color-paper); font-size: var(--text-md); font-weight: 400; }
.node.cell .ni { width: auto; height: auto; background: var(--color-paper-3); border-right: 1px solid var(--color-rule-2); color: var(--color-ink); }
.node.cell .ni .ic { width: 24px; height: 24px; }
.node.cell .ct { display: flex; align-items: center; padding-inline: var(--space-md); }
.node.big { display: grid; grid-template-rows: 58px minmax(0, 1fr); border-radius: var(--radius-sharp); border-color: var(--color-rule-2); background: var(--color-paper); font-size: var(--text-md); font-weight: 400; }
.node.big .ct { display: grid; place-items: center; background: var(--color-paper-3); border-bottom: 1px solid var(--color-rule-2); }
.node.big .ni { width: auto; height: auto; color: var(--color-ink); }
.node.big .ni .ic { width: 64px; height: 64px; stroke-width: 1.1; }
.node.agent[data-state="idle"] .ni { color: var(--color-accent-2); background: color-mix(in oklab, var(--color-accent-2) 13%, var(--color-paper-3)); }
.node.cell:hover, .node.big:hover { background: var(--color-paper); border-color: var(--color-ink-2); }

.pill {
  position: absolute; z-index: var(--z-marks); transform: translate(-50%, 0); pointer-events: none;
  display: inline-flex; align-items: center; gap: var(--space-xs); height: 30px; padding: 0 var(--space-md) 0 var(--space-sm); white-space: nowrap;
  border: 1px solid var(--color-rule-2); border-radius: var(--radius-pill); background: var(--color-paper-3); color: var(--color-ink);
  font: 500 var(--text-xs)/1 var(--font-mono); text-transform: uppercase;
  transition: border-color var(--dur-short), background-color var(--dur-short);
}
.pill .ic { color: var(--color-accent); }
.pill.on { border-color: color-mix(in oklab, var(--color-accent) 60%, var(--color-rule-2)); background: color-mix(in oklab, var(--color-accent) 14%, var(--color-paper-3)); }

/* canvas HUD */
.hud { position: absolute; z-index: var(--z-hud); cursor: default; display: flex; gap: var(--space-2xs); }
.zoom { left: var(--space-md); top: var(--space-md); }
.zoom output { display: grid; place-items: center; min-width: 52px; height: 32px; padding-inline: var(--space-xs); border: 1px solid var(--color-rule); border-radius: var(--radius-ctl); background: var(--color-paper-3); color: var(--color-ink-2); font-variant-numeric: tabular-nums; }
.runbar { right: var(--space-md); top: var(--space-md); align-items: center; gap: var(--space-sm); }
.runbar p { color: var(--color-muted); font-variant-numeric: tabular-nums; }

/* ── panel ───────────────────────────────────────────────────────────── */
.panel { border-left: 1px solid var(--color-rule); background: var(--color-paper-2); overflow-y: auto; min-height: 0; }
.panel section { padding: var(--space-lg); }
.panel section + section { border-top: 1px solid var(--color-rule); }
.panel h2 { font-size: var(--text-lg); line-height: 1.3; letter-spacing: -0.012em; }
.panel h3 { font-size: var(--text-sm); }
.panel p { color: var(--color-ink-2); margin-top: var(--space-xs); text-wrap: pretty; }
.props { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: var(--space-sm); margin-top: var(--space-md); }
.props dt { color: var(--color-muted); }
.props dd { display: flex; align-items: center; gap: var(--space-xs); min-width: 0; }
.props dd .ic { color: var(--color-accent); }
.step-head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-sm); }
.quote { margin-top: var(--space-sm); padding: var(--space-sm); border: 1px solid var(--color-rule); border-radius: var(--radius-ctl); background: var(--color-paper); color: var(--color-ink-2); }
.tools { display: flex; flex-wrap: wrap; gap: var(--space-2xs) var(--space-sm); font: 400 var(--text-xs)/1.6 var(--font-mono); color: var(--color-ink-2); }
.feed-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-sm); }
.feed-head span { color: var(--color-muted); font-size: var(--text-xs); font-variant-numeric: tabular-nums; }
.feed { margin-top: var(--space-sm); display: grid; gap: var(--space-sm); }
.feed li { display: grid; grid-template-columns: 16px 40px minmax(0, 1fr); gap: var(--space-xs); align-items: start; color: var(--color-ink-2); }
.feed .ic { margin-top: var(--space-3xs); color: var(--color-accent); }
.feed time { color: var(--color-muted); font-variant-numeric: tabular-nums; }
.empty { color: var(--color-muted); }

.fallback { position: absolute; inset: 0; overflow: auto; padding: var(--space-xl); background: var(--color-paper); }
.fallback ol { margin-top: var(--space-md); padding-left: var(--space-lg); list-style: decimal; display: grid; gap: var(--space-xs); max-width: 60ch; color: var(--color-ink-2); }

@media (max-width: 68rem) { :root { --list-w: 220px; --panel-w: 304px; } }
@media (max-width: 60rem) {
  body { height: auto; display: block; }
  .bar { height: var(--bar-h); }
  .shell { display: block; }
  .list { border-right: 0; border-bottom: 1px solid var(--color-rule); }
  .list h2, .keys { display: none; }
  .list ul { display: flex; overflow-x: auto; padding: var(--space-xs); scrollbar-width: none; }
  .list li { flex: none; }
  .wf { width: auto; }
  .canvas { height: 66svh; min-height: 420px; }
  .panel { border-left: 0; border-top: 1px solid var(--color-rule); }
  .note, .btn kbd { display: none; }
}
@media (max-width: 40rem) {
  .crumbs .cur, .crumbs .sep.c { display: none; }
  body { font-size: var(--text-md); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0.01ms !important; animation: none !important; }
}
</style>
</head>

const PILLS = { start: ["loop", "Loop started", "Loop started"], done: ["donec", "Loop completed", "Loop completed"] };

/* ── layout for loop workflows ────────────────────────────────────────── */
const CH = 7.25, GAP = 44;
const wOf = (n) => Math.ceil(Math.max(n.t.length, ...(n.subs || []).map((s) => s.length)) * CH) + 24 + 32 + 12;
const hOf = (n) => ((n.subs || []).length ? 52 + 22 * n.subs.length : 44);
function build(wf) {
  if (wf.kind !== "loop" || wf.nodes) return wf;
  const CX = 440, nodes = [], edges = [], pills = [], order = [], docs = {};
  let y = 40, prev = null, loop = null, inLoop = false, rowW = 0;
  const place = (n, cx) => { const w = wOf(n), h = hOf(n); nodes.push({ ...n, k: "step", x: Math.round(cx - w / 2), y, w, h }); docs[n.id] = n; return { cx, top: y, bot: y + h, w, id: n.id }; };
  for (const it of wf.items) {
    let cur;
    if (it.pill) {
      cur = [{ cx: CX, top: y, bot: y + 30, w: 0, id: "pill-" + it.pill }];
      pills.push({ id: "pill-" + it.pill, x: CX, y, i: PILLS[it.pill][0], t: PILLS[it.pill][1] });
      if (it.pill === "done" && loop) { loop.y1 = Math.max(...prev.map((c) => c.bot)) + 24; inLoop = false; }
    } else if (it.row) {
      const ws = it.row.map(wOf), total = ws.reduce((a, b) => a + b, 0) + 28 * (ws.length - 1);
      let x = CX - total / 2;
      cur = it.row.map((n, i) => { const c = place(n, x + ws[i] / 2); x += ws[i] + 28; return c; });
      rowW = Math.max(rowW, total);
    } else {
      cur = [place(it, CX)];
      if (loop && inLoop) loop.w = Math.max(loop.w, cur[0].w);
    }
    if (prev) {
      const via = [];
      for (const a of prev) for (const b of cur) {
        const id = `e-${a.id}-${b.id}`, midY = a.bot + (b.top - a.bot) / 2;
        edges.push({ id, dash: 1, a: "b", s: 5, p: a.cx === b.cx ? [[a.cx, a.bot + 3], [b.cx, b.top - 3]] : [[a.cx, a.bot + 3], [a.cx, midY], [b.cx, midY], [b.cx, b.top - 3]] });
        via.push(id);
      }
      order.push({ ids: cur.map((c) => c.id), via, pill: it.pill, at: it.at || (it.row && it.row[0].at), log: it.log, row: it.row });
    } else order.push({ ids: [cur[0].id], via: [], at: it.at, log: it.log });
    if (it.pill === "start") { loop = { y0: y + 30 + GAP - 24, y1: 0, w: 0 }; inLoop = true; }
    y = Math.max(...cur.map((c) => c.bot)) + GAP; prev = cur;
  }
  const lw = Math.max(loop.w + 150, rowW + 88);
  Object.assign(wf, { nodes, edges, pills, order, docs, w: 880, h: y, regs: [{ id: "loop", c: "loop", x: CX - lw / 2, y: loop.y0, w: lw, h: loop.y1 - loop.y0 }] });

}

/* ── state ────────────────────────────────────────────────────────────── */
const canvas = $("#canvas"), world = $("#world"), feed = $("#feed"), runBtn = $("#run"), runStatus = $("#runStatus");
const st = { wf: "retest", node: null };
const view = { x: 0, y: 0, k: 1 };
let userMoved = false, runId = 0, running = false;
const ran = {};
const cur = () => build(WF[st.wf]);
const stepIds = () => [...new Set(cur().order.flatMap((o) => o.ids).filter((id) => !id.startsWith("pill-")))];

/* ── drawing ──────────────────────────────────────────────────────────── */
function pathD(p, r = 10) {
  let d = `M${p[0][0]},${p[0][1]}`;
  for (let i = 1; i < p.length - 1; i++) {
    const [x0, y0] = p[i - 1], [x1, y1] = p[i], [x2, y2] = p[i + 1];
    const d1 = Math.hypot(x1 - x0, y1 - y0), d2 = Math.hypot(x2 - x1, y2 - y1), rr = Math.min(r, d1 / 2, d2 / 2);
    d += rr ? ` L${x1 - ((x1 - x0) / d1) * rr},${y1 - ((y1 - y0) / d1) * rr} Q${x1},${y1} ${x1 + ((x2 - x1) / d2) * rr},${y1 + ((y2 - y1) / d2) * rr}` : ` L${x1},${y1}`;
  }
  const l = p[p.length - 1];

const tri = (x, y, deg, s) => `<path class="ah" d="M${s * 0.55},0 L${-s * 0.45},${-s * 0.5} L${-s * 0.45},${s * 0.5} Z" transform="translate(${x},${y}) rotate(${deg})"/>`;
const deg = (a, b) => (Math.atan2(a[1] - b[1], a[0] - b[0]) * 180) / Math.PI;
function edgeSvg(e) {
  const p = e.p, n = p.length, s = e.s || 11;

  if (e.a === "b") h += tri(p[0][0], p[0][1], deg(p[0], p[1]), s);
  for (const m of e.m || []) h += tri(m[0], m[1], m[2], s);
  return `<g class="edge${e.dash ? " dashed" : ""}" data-id="${e.id}">${h}</g>`;
}
const box = (o) => `left:${o.x}px;top:${o.y}px;width:${o.w}px;height:${o.h}px`;
function nodeHtml(n) {
  const head = `<span class="ni" data-icon="${n.i}">${ic(n.i)}</span>`;
  const body = n.k === "step"
    ? `<span class="nt">${head}<span>${n.t}</span></span>${(n.subs || []).map((s) => `<span class="ns">${s.replace(/\[.+?\]/g, '<span class="tok">$&</span>')}</span>`).join("")}`
    : n.k === "big" ? `<span class="ct">${n.t}</span>${head}` : `${head}<span class="ct">${n.t}</span>`;
  return `<button type="button" class="node ${n.k}" data-id="${n.id}" data-state="idle" style="${box(n)}" aria-pressed="false">${body}</button>`;
}
function render() {
  const wf = cur();
  world.style.width = wf.w + "px"; world.style.height = wf.h + "px";
  let h = "";
  for (const r of wf.regs || []) h += `<div class="reg ${r.c}"${r.id ? ` data-id="${r.id}"` : ""} style="${box(r)}"></div>`;
  for (const l of wf.labels || []) h += `<span class="glabel" style="left:${l.x}px;top:${l.y}px">${ic(l.i)}${l.t}</span>`;
  h += `<svg class="edges" width="${wf.w}" height="${wf.h}" aria-hidden="true">${wf.edges.map(edgeSvg).join("")}</svg>`;
  h += wf.nodes.map(nodeHtml).join("");
  for (const p of wf.pills || []) h += `<span class="pill" data-id="${p.id}" style="left:${p.x}px;top:${p.y}px">${ic(p.i)}${p.t}</span>`;
  world.innerHTML = h;
  $("#curName").textContent = wf.name;
  $("#wfList").innerHTML = Object.entries(WF).map(([id, w]) => `<li><button type="button" class="wf" data-wf="${id}" data-run="${ran[id] || ""}"${id === st.wf ? ' aria-current="true"' : ""}>${ic(ran[id] === "done" ? "donec" : w.kind === "loop" ? "loop" : "lanes")}<b>${w.name}</b><span>${w.trigger}</span></button></li>`).join("");
  $("#about").innerHTML = `<h2>${wf.name}</h2><p>${wf.about}</p><dl class="props"><dt>Status</dt><dd>${ic("donec")}Enabled</dd>${wf.props.map((p) => `<dt>${p[0]}</dt><dd>${p[1]}</dd>`).join("")}<dt>Last run</dt><dd id="lastRun">Not in this session</dd></dl>`;
}
function renderStep() {
  const wf = cur(), d = st.node && wf.docs[st.node], el = $("#step");
  world.querySelectorAll(".node").forEach((n) => n.setAttribute("aria-pressed", String(n.dataset.id === st.node)));
  el.hidden = !d;
  if (!d) return;
  const n = wf.nodes.find((x) => x.id === st.node);
  el.innerHTML = `<div class="step-head"><h3>${n.t}</h3><button class="btn sq" type="button" data-clear aria-label="Close step details">${ic("x")}</button></div><p>${d.what}</p>
    ${d.prompt ? `<p class="quote">${d.prompt}</p>` : ""}
    ${d.tools ? `<dl class="props"><dt>Tools</dt><dd class="tools">${d.tools.map((t) => `<span>${t}</span>`).join("")}</dd><dt>Output</dt><dd>${d.out}</dd></dl>` : ""}`;
}

/* ── the run ──────────────────────────────────────────────────────────── */
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const q = (sel) => world.querySelector(sel);
function setState(id, state) {
  const n = q(`.node[data-id="${id}"]`);
  if (!n) { const p = q(`.pill[data-id="${id}"]`); if (p) p.classList.toggle("on", state !== "idle"); return; }
  n.dataset.state = state;
  const i = $(".ni", n);
  $("use", i).setAttribute("href", `#i-${state === "run" ? "spin" : state === "done" && n.classList.contains("step") ? "check" : i.dataset.icon}`);
  if (state === "idle") n.querySelectorAll(".ns").forEach((s) => s.classList.remove("done"));
}
function setRunning(on) {
  running = on;
  runBtn.innerHTML = on ? `${ic("stop")}<span>Stop</span><kbd>R</kbd>` : `${ic("play")}<span>Run workflow</span><kbd>R</kbd>`;
  const b = $(`.wf[data-wf="${st.wf}"]`); if (b) b.dataset.run = on ? "run" : ran[st.wf] || "";
}
function resetRun(bump = true) {
  if (bump) runId++;
  world.querySelectorAll(".on").forEach((e) => e.classList.remove("on"));
  cur().order.forEach((o) => o.ids.forEach((id) => setState(id, "idle")));
  feed.innerHTML = ""; $("#feedEmpty").hidden = false; $("#feedMeta").textContent = ""; runStatus.textContent = "";
  if (bump) setRunning(false);
}
function logLine(at, text) {
  $("#feedEmpty").hidden = true;
  feed.insertAdjacentHTML("beforeend", `<li>${ic("check")}<time>${at}</time><span>${text}</span></li>`);
}
async function run() {
  const my = ++runId, wf = cur(), steps = wf.order.filter((o) => !o.pill).length;
  resetRun(false); setRunning(true);
  let done = 0;
  for (const o of wf.order) {
    o.via.forEach((id) => q(`.edge[data-id="${id}"]`).classList.add("on"));
    if (o.pill === "start") q(".reg.loop").classList.add("on");
    o.ids.forEach((id) => setState(id, "run"));
    reveal(q(`.node[data-id="${o.ids[0]}"]`));
    if (!o.pill) runStatus.textContent = `Step ${done + 1} of ${steps}`;
    const subs = o.ids.length === 1 ? [...(q(`.node[data-id="${o.ids[0]}"]`)?.querySelectorAll(".ns") || [])] : [];
    for (const s of subs) { await wait(340); if (my !== runId) return; s.classList.add("done"); }
    if (o.row) {
      for (const n of [...o.row].sort((a, b) => a.at.localeCompare(b.at))) { await wait(620); if (my !== runId) return; setState(n.id, "done"); logLine(n.at, n.log); }
    } else {
      await wait(o.pill ? 320 : 560); if (my !== runId) return;
      o.ids.forEach((id) => setState(id, "done"));
      if (o.log) logLine(o.at, o.log);
    }
    if (!o.pill) done++;
  }
  const last = [...wf.order].reverse().find((o) => o.at).at;
  if (q(".reg.loop")) q(".reg.loop").classList.remove("on");
  ran[st.wf] = "done"; setRunning(false);
  $("use", $(`.wf[data-wf="${st.wf}"]`)).setAttribute("href", "#i-donec");
  runStatus.textContent = `Completed in ${last}`;
  $("#feedMeta").textContent = `${feed.children.length} events`;
  const lr = $("#lastRun"); if (lr) lr.textContent = `Completed in ${last}`;
}

/* ── view: pan, zoom, fit ─────────────────────────────────────────────── */
function apply(ease) {
  world.classList.toggle("ease", !!ease);
  world.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.k})`;
  $("#zlabel").textContent = Math.round(view.k * 100) + "%";
}
function fit(ease) {
  const wf = cur(), W = canvas.clientWidth, H = canvas.clientHeight, all = [...wf.nodes, ...(wf.regs || [])];
  const x0 = Math.min(...all.map((n) => n.x)), x1 = Math.max(...all.map((n) => n.x + n.w));
  const b = { x: x0, y: 28, w: x1 - x0, h: wf.h - 40 };
  const pad = { l: 24, r: 24, t: 64, b: 28 };
  // On a narrow canvas a whole-diagram fit is unreadable: hold a floor and start at the top-left instead.
  view.k = clamp(Math.min((W - pad.l - pad.r) / b.w, (H - pad.t - pad.b) / b.h), W < 640 ? 0.55 : 0.2, 1.15);
  view.x = pad.l + Math.max(0, W - pad.l - pad.r - b.w * view.k) / 2 - b.x * view.k;
  view.y = pad.t + Math.max(0, H - pad.t - pad.b - b.h * view.k) / 2 - b.y * view.k;
  userMoved = false; apply(ease);
}
function zoomAt(cx, cy, f, ease) {
  const k = clamp(view.k * f, 0.2, 2.5), r = k / view.k;
  view.x = cx - (cx - view.x) * r; view.y = cy - (cy - view.y) * r; view.k = k; userMoved = true; apply(ease);
}
const mid = () => [canvas.clientWidth / 2, canvas.clientHeight / 2];

const ptrs = new Map(); let drag = null, pinch = null, moved = false;
canvas.addEventListener("pointerdown", (e) => {
  if (e.target.closest(".hud") || e.button > 0) return;
  ptrs.set(e.pointerId, [e.clientX, e.clientY]); moved = false;
  if (ptrs.size === 1) drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y };
  else if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), k: view.k }; drag = null; }
});
canvas.addEventListener("pointermove", (e) => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (pinch && ptrs.size === 2) {
    const [a, b] = [...ptrs.values()], r = canvas.getBoundingClientRect();
    zoomAt((a[0] + b[0]) / 2 - r.left, (a[1] + b[1]) / 2 - r.top, clamp((pinch.k * Math.hypot(a[0] - b[0], a[1] - b[1])) / pinch.d, 0.2, 2.5) / view.k);
    moved = true; return;
  }
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!moved && Math.hypot(dx, dy) < 5) return;
  if (!moved) { moved = true; canvas.setPointerCapture(e.pointerId); canvas.classList.add("panning"); }
  view.x = drag.vx + dx; view.y = drag.vy + dy; userMoved = true; apply();
});
const endPtr = (e) => { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null; if (!ptrs.size) { drag = null; canvas.classList.remove("panning"); } };
canvas.addEventListener("pointerup", endPtr); canvas.addEventListener("pointercancel", endPtr);
canvas.addEventListener("click", (e) => { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
canvas.addEventListener("wheel", (e) => {
  if (e.target.closest(".hud")) return;
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  if (e.ctrlKey || e.metaKey) zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * 0.01));
  else { view.x -= e.deltaX; view.y -= e.deltaY; userMoved = true; apply(); }
}, { passive: false });
$("#zin").addEventListener("click", () => zoomAt(...mid(), 1.25, true));
$("#zout").addEventListener("click", () => zoomAt(...mid(), 0.8, true));
$("#zfit").addEventListener("click", () => fit(true));
new ResizeObserver(() => { if (!userMoved) fit(); }).observe(canvas);

/* ── selection, routing, keys ─────────────────────────────────────────── */
function writeHash() {
  const h = `#${st.wf}${st.node ? "/" + st.node : ""}`;
  if (location.hash !== h) history.replaceState(null, "", h);
}
// Pan a node into view when it is hidden by the canvas edge or the HUD.
function reveal(n) {
  if (!n) return;
  const r = n.getBoundingClientRect(), c = canvas.getBoundingClientRect();
  if (r.left < c.left + 8 || r.right > c.right - 8 || r.top < c.top + 56 || r.bottom > c.bottom - 8) {
    view.x += c.left + c.width / 2 - (r.left + r.width / 2); view.y += c.top + c.height / 2 - (r.top + r.height / 2); userMoved = true; apply(true);
  }
}
function select(id) {
  st.node = id; renderStep(); writeHash();
  reveal(id && q(`.node[data-id="${id}"]`));
}
function open(id, node) {
  const changed = id !== st.wf || !world.firstChild;
  st.wf = WF[id] ? id : "retest";
  st.node = cur().docs[node] ? node : null;
  if (changed) { render(); resetRun(); fit(); }
  renderStep(); writeHash();
}
const readHash = () => { const [w, n] = location.hash.slice(1).split("/"); open(w, n); };
world.addEventListener("click", (e) => { const n = e.target.closest(".node"); if (n) select(n.dataset.id === st.node ? null : n.dataset.id); });
$("#wfList").addEventListener("click", (e) => { const b = e.target.closest("[data-wf]"); if (b) open(b.dataset.wf); });
$("#step").addEventListener("click", (e) => { if (e.target.closest("[data-clear]")) select(null); });
runBtn.addEventListener("click", () => (running ? resetRun() : run()));
addEventListener("hashchange", readHash);
addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  const k = e.key.toLowerCase(), ids = stepIds(), i = ids.indexOf(st.node);
  if (k === "escape") { if (st.node) select(null); }
  else if (k === "r") running ? resetRun() : run();
  else if (k === "j") select(ids[Math.min(ids.length - 1, i + 1)]);
  else if (k === "k") select(ids[Math.max(0, i - 1)]);
  else if (k === "+" || k === "=") zoomAt(...mid(), 1.25, true);
  else if (k === "-") zoomAt(...mid(), 0.8, true);
  else if (k === "0") fit(true);
  else if (/^[1-9]$/.test(k) && Object.keys(WF)[k - 1]) open(Object.keys(WF)[k - 1]);
  else if (k.startsWith("arrow") && (e.target === document.body || canvas.contains(e.target))) {
    const d = { arrowleft: [48, 0], arrowright: [-48, 0], arrowup: [0, 48], arrowdown: [0, -48] }[k];
    view.x += d[0]; view.y += d[1]; userMoved = true; apply(true); e.preventDefault();
  }
});
$("#theme").addEventListener("click", () => {
  const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem("gm-workflows-theme", t); } catch (e) {}
});

readHash();
})();
</script>
</body>
</html>
